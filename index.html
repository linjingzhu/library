구로 다룬다. 무력 자체를 아름답게 보거나 살상을 즐기는 태도로는 신뢰를 얻기 어렵다.","page":103},{"title":"064 · 승리보다 희생을 기억하기","text":"불가피한 전쟁에서도 승리에 도취하지 않는다. 많은 생명의 희생을 애도하는 자세로 싸움과 그 이후를 대한다.","page":104},{"title":"065 · 이름 없는 질서의 힘","text":"도는 특정 이름이나 지위로 소유할 수 없다. 통치자가 이를 따르면 강요가 없어도 스스로 질서가 생길 수 있다.","page":105},{"title":"066 · 도구의 한계를 알기","text":"전체를 잘라 이름 붙인 도구는 유용하지만 한계가 있다. 그 한계를 자각하고 물이 흘러가듯 자연스럽게 작용하게 한다.","page":107},{"title":"067 · 자기 이해와 자기 절제","text":"남을 아는 능력보다 자신을 아는 밝음, 남을 누르는 힘보다 자신을 이기는 힘을 중시한다. 만족과 본래의 가치를 지키는 것이 오래가는 삶의 기준이다.","page":108},{"title":"068 · 주인 행세 없는 큰일","text":"어느 방향에도 열려 있으면서 성취를 독점하지 않는다. 만물이 따르더라도 지배하려 하지 않는 태도에서 큰 결과가 나온다.","page":109},{"title":"069 · 수수하지만 고갈되지 않는 도","text":"도는 감각적으로 강렬하지 않아도 삶을 편안하게 하는 근원으로 설명된다. 눈에 띄는 자극만으로 유익함을 판단하지 않는다.","page":110},{"title":"070 · 반전의 흐름과 유연함","text":"조임과 펼침, 약해짐과 강해짐은 서로 전환된다. 단단한 대결만 고집하지 않고 변화의 순서를 읽는 유연함을 강조한다.","page":111},{"title":"071 · 본래 모습을 되찾는 조건","text":"지도자가 도를 따르면 만물이 스스로 제 모습을 회복한다. 작위가 커질 때 파괴적인 강제보다 고요함으로 가라앉힌다.","page":112}],"practice":["갈등에서 반드시 필요한 목적과 힘을 보여주려는 욕구를 구분한다."],"keywords":["비폭력","자기절제","성취","자연질서"]},{"id":"tao-10","title":"겉치레보다 깊은 덕","part":"하편 덕경 · 편집상 묶음","pages":[117,124],"summary":"덕은 자신이 덕망 있다고 의식하고 강요하는 태도와 구별된다. 높은 지위와 드러난 현상을 떠받치는 낮은 기반과 보이지 않는 근원을 함께 본다.","points":[{"title":"072 · 덕을 의식하지 않는 덕","text":"덕을 갖췄다는 자의식과 보답 요구가 커질수록 행위는 겉치레가 되기 쉽다. 자연스럽게 행하는 태도와 의도적인 도덕 연출을 구별한다.","page":117},{"title":"073 · 표현과 근원 구별하기","text":"편자는 도·덕·인·의·예를 점차 구체화되는 표현의 관계로 읽는다. 예의와 충성의 표현이 혼란을 거쳐 질서로 이어지는 과정도 설명한다.","page":118},{"title":"074 · 예측의 재치보다 실질","text":"영리한 예측과 외형만으로 자신을 지키려 하지 않는다. 말과 표현 뒤에 있는 실제 관계와 본질을 우선한다.","page":119},{"title":"075 · 하나의 생성 원리","text":"천지와 만물, 통치의 안정은 각각 고립된 일이 아니라 하나의 생성 근원과 연결된다. 이를 체득하는 일이 질서의 바탕으로 제시된다.","page":120},{"title":"076 · 높음을 받치는 낮음","text":"줄임이 늘림으로, 늘림이 줄임으로 바뀔 수 있다. 고귀한 지위와 높은 성취가 낮은 기반 위에 있음을 잊지 않는다.","page":122},{"title":"077 · 명예를 과시하지 않기","text":"높은 지위에 있어도 부족함을 자각하고 눈에 띄는 영광을 추구하지 않는다. 소박한 존재로도 충분히 가치 있을 수 있다.","page":123},{"title":"078 · 형태 없는 근원에서 존재로","text":"도의 작용은 되돌아감과 약함으로 표현된다. 구체적인 존재는 모양이 없는 근원에서 나타난다고 설명한다.","page":124}],"practice":["평판을 높이는 행동과 실제로 도움이 되는 행동이 다른 지점을 찾아본다."],"keywords":["덕","실질","겸손","근원"]},{"id":"tao-11","title":"완성에 갇히지 않는 성장","part":"하편 덕경 · 편집상 묶음","pages":[125,138],"summary":"큰 재능은 정해진 완성형에 도달하기보다 계속 성장한다는 것이 이 책의 독특한 독법이다. 부족해 보임과 부드러움의 힘을 인정하고, 욕망을 덜어 충분함을 배운다.","points":[{"title":"079 · 낯선 도리에 대한 반응","text":"도리에 맞는 말을 들었을 때 실천하거나 망설이거나 비웃는 반응이 나뉜다. 익숙한 상식과 다르다는 이유만으로 의미를 버리지 않는다.","page":125},{"title":"080 · 좋음이 나빠 보이는 역설","text":"밝음·진전·넓은 덕이 겉보기에는 어둠·후퇴·부족함처럼 보일 수 있다. 첫인상으로 가치를 확정하지 않는다.","page":126},{"title":"081 · 끝없이 커지는 가능성","text":"편자는 큰 그릇을 늦게 완성되는 것이 아니라 계속 성장해 완성되지 않는 것으로 읽는다. 재능과 관용을 정해진 한계에 가두지 않는다.","page":127},{"title":"082 · 대립에서 조화와 만물로","text":"도에서 하나, 둘, 셋과 만물이 생겨나는 설명을 현상·음양·조화의 관계로 풀이한다. 차이는 단절보다 생성의 조건으로 이해된다.","page":128},{"title":"083 · 강함에 매달리지 않기","text":"자신을 낮추고 덜어내는 일이 오히려 보존과 성장에 기여한다. 강인함만 밀어붙이는 태도는 오래 버티기 어렵다는 교훈을 전한다.","page":130},{"title":"084 · 부드러움이 스며드는 힘","text":"물처럼 유연한 것은 단단한 대상의 틈에도 작용한다. 강요와 설명을 앞세우지 않는 무위와 무언의 유익함을 보여준다.","page":131},{"title":"085 · 몸보다 소유를 앞세우지 않기","text":"명예와 재산에 지나치게 집착하면 상실의 고통과 위험이 커진다. 충분함을 알고 멈출 수 있어야 평안을 지킬 수 있다.","page":132},{"title":"086 · 완전함의 수수한 외양","text":"완성도와 솜씨가 높아도 겉으로는 부족하고 서툴게 보일 수 있다. 화려한 표면과 실제로 오래 작동하는 능력을 구별한다.","page":133},{"title":"087 · 맑고 고요한 상태","text":"소란과 흥분보다 맑고 차분한 기운을 삶의 바른 상태로 제시한다. 겉의 요란함을 생기의 크기로 착각하지 않는다.","page":135},{"title":"088 · 만족은 욕망의 멈춤에서","text":"도가 있는 세상은 전쟁의 자원을 생활로 되돌린다. 채워도 끝나지 않는 탐욕을 줄이고 만족할 기준을 세운다.","page":136},{"title":"089 · 밖의 정보와 내면의 이해","text":"멀리 다니며 정보를 늘리는 것만이 이해의 길은 아니다. 가까운 삶과 내면에서 전체의 이치를 읽는 통찰을 강조한다.","page":137},{"title":"090 · 더하기와 덜어내기의 차이","text":"지식을 쌓는 배움과 달리 도를 따르는 과정은 불필요한 작위를 덜어내는 일로 설명된다. 큰 성과를 억지로 만들려는 집착을 줄인다.","page":138}],"practice":["성장의 목표를 완성된 직함 대신 계속 확장할 능력으로 바꾸어 적는다."],"keywords":["대기면성","성장","만족","덜어내기"]},{"id":"tao-12","title":"돌봄과 자기 만남","part":"하편 덕경 · 편집상 묶음","pages":[139,151],"summary":"성인은 백성의 마음을 받아들이며, 도는 만물을 기르되 지배하지 않는다. 자신의 몸과 가까운 관계에서 출발해 더 넓은 세계를 이해하는 방향을 제시한다.","points":[{"title":"091 · 백성의 마음을 자기 마음으로","text":"지도자는 고정된 자기 뜻보다 사람들의 마음에 귀 기울인다. 선악과 신뢰의 구분에 갇히지 않는 선의와 온화함으로 관계를 맺는다.","page":139},{"title":"092 · 과도한 애씀의 위험","text":"살기 위해 바쁘게 움직이면서 오히려 자신을 위험으로 몰아넣을 수 있다. 활동의 양과 삶의 충실함을 같은 것으로 보지 않는다.","page":140},{"title":"093 · 위험에 들어가지 않는 지혜","text":"상처받지 않는 사람의 비유는 위험한 상황에 무턱대고 뛰어들지 않는 태도로 풀이된다. 생명을 이해한다는 것은 위험을 분별하는 일이다.","page":141},{"title":"094 · 외부 인정 없이 귀한 본성","text":"만물은 도에서 생겨나 자기 본질인 덕을 따라 자란다. 그 가치는 권력이나 지위를 부여받아서 생기는 것이 아니다.","page":143},{"title":"095 · 자라게 하되 지배하지 않기","text":"낳고 보살피며 결실을 돕는다고 해서 대상을 소유하거나 종속시키지 않는다. 깊은 덕은 돌봄과 자유를 함께 지킨다.","page":144},{"title":"096 · 결과와 근원을 왕복하기","text":"생겨난 만물을 통해 그 근원을 알고, 근원을 통해 만물을 이해한다. 어느 한쪽의 지식만으로 전체를 다 안다고 여기지 않는다.","page":145},{"title":"097 · 열린 감각과 자기 성찰","text":"외부를 차단하는 삶과 바깥일에만 분주한 삶을 모두 경계한다. 감각을 열면서도 억지의 활동을 줄여 자기 자신과 만난다.","page":146},{"title":"098 · 미세함과 유연함을 알아보기","text":"눈에 잘 보이지 않는 작은 변화를 감지하고 부드러움을 유지하는 것을 밝음과 강함으로 설명한다. 자극적인 것만 좇지 않는다.","page":147},{"title":"099 · 지름길의 대가","text":"지도층의 사치와 백성의 빈곤이 함께 존재하는 질서는 도에서 벗어난 것으로 비판된다. 넓은 바른길을 두고 사익의 지름길을 택하지 않는다.","page":148},{"title":"100 · 몸에서 천하까지 확장하기","text":"자신의 몸과 집, 고향과 나라를 차례로 살펴 더 넓은 관계를 이해한다. 덕의 실천은 가까운 삶에서 시작해 퍼져간다.","page":150}],"practice":["누군가를 지원할 때 필요한 도움과 불필요한 간섭을 각각 적어본다."],"keywords":["돌봄","자기성찰","본질","공동체"]},{"id":"tao-13","title":"말 이전의 앎과 적은 개입","part":"하편 덕경 · 편집상 묶음","pages":[152,167],"summary":"조화로운 삶과 암묵적인 이해를 강조하면서 언어를 실제 앎과 동일시하지 않는다. 통치에서도 과한 규정과 간섭을 줄여 사람들이 제 모습을 찾게 한다.","points":[{"title":"101 · 어린아이의 조화라는 비유","text":"갓난아기의 부드러움과 생기를 덕이 충만한 상태의 이미지로 사용한다. 음양과 정기의 조화는 이 책의 전통적인 생명 설명 방식이다.","page":152},{"title":"102 · 삶을 억지로 몰아붙이지 않기","text":"수명과 건강을 과도하게 움켜쥐려는 태도를 부자연스러운 작위로 경계한다. 강한 기세만 유지하려는 집착을 돌아보게 한다.","page":154},{"title":"103 · 앎과 앎의 설명은 다르다","text":"말로 드러내기 전에 이미 암묵적으로 아는 것이 있다. 언어화는 그 앎의 모형을 만들지만 실제 인식 작용과 같지는 않다.","page":156},{"title":"104 · 언어 의존에서 벗어나기","text":"말로만 생각하면 말 이전의 직접적인 감지가 막힐 수 있다. 대상을 알고 싶을 때는 이름과 설명의 중개를 잠시 내려놓는다.","page":157},{"title":"105 · 날카로움을 낮추는 이해","text":"말의 구분과 지적 과시를 누그러뜨려 서로 얽힌 삶을 이해한다. 친소·이해득실·귀천의 틀에 쉽게 끌려가지 않는 경지를 설명한다.","page":158},{"title":"106 · 규제와 술수의 역효과","text":"금지와 책략, 가혹한 법령을 늘리면 빈곤과 혼란을 키울 수 있다고 본다. 지도자의 고요하고 절제된 행동이 자율적인 변화를 돕는다.","page":160},{"title":"107 · 복과 화를 단정하지 않기","text":"좋음과 나쁨은 서로 바뀔 수 있어 최종 결과를 확정하기 어렵다. 원칙이 있어도 사람을 찌르거나 눈부시게 압박하지 않는다.","page":162},{"title":"108 · 꾸밈 없이 쌓는 신뢰","text":"소박한 태도로 덕 있는 행동을 거듭하면 사람들의 진심 어린 지지가 자란다. 오래가는 힘은 외양보다 깊은 기반에서 나온다.","page":165},{"title":"109 · 자꾸 건드리지 않기","text":"작은 생선을 반복해서 뒤집으면 부서지듯 큰 조직도 잦은 간섭에 손상될 수 있다. 조바심 때문에 불필요한 개입을 늘리지 않는다.","page":166},{"title":"110 · 서로 해치지 않는 질서","text":"만물이 본래 모습을 지키도록 다스릴 때 백성과 지도자가 함께 보호받는다. 덕은 한쪽의 지배가 아니라 상호 이로움으로 돌아온다.","page":167}],"practice":["설명이나 지시를 추가하기 전에 직접 관찰하거나 기다릴 수 있는지 살핀다."],"keywords":["암묵지","언어","개입","조화"]},{"id":"tao-14","title":"낮춤과 작은 시작","part":"하편 덕경 · 편집상 묶음","pages":[168,180],"summary":"큰 존재가 먼저 낮아질 때 신뢰와 협력이 생긴다. 어려운 일은 작을 때 시작하고, 끝까지 처음의 신중함을 유지하되 결과를 억지로 움켜쥐지 않는다.","points":[{"title":"111 · 큰 나라의 낮은 자리","text":"강의 하류가 물을 모으듯 큰 나라는 아래에 머물며 작은 나라의 신뢰를 얻는다. 위세보다 수용하는 위치를 택한다.","page":168},{"title":"112 · 강한 쪽이 먼저 낮추기","text":"서로 필요한 것을 얻으려면 특히 큰 쪽이 먼저 겸손해야 한다. 각자의 자리가 존중될 때 협력이 이어진다.","page":170},{"title":"113 · 사람을 쉽게 버리지 않기","text":"도는 선하다고 여기는 사람과 그렇지 않은 사람 모두에게 있다. 말로 현혹하지 않으며 현재의 평가만으로 한 사람의 가능성을 폐기하지 않는다.","page":172},{"title":"114 · 의식보다 가르침의 계승","text":"화려한 즉위 의식보다 도의 가르침을 받아 실천하는 일이 귀하다. 필요한 것을 찾고 잘못에서 벗어나는 길을 그 안에서 구한다.","page":174},{"title":"115 · 작을 때 다루기","text":"큰 어려움도 사소한 시작에서 자란다. 작은 문제를 가볍게 보지 않고 쉬운 단계에서 대응하며 원한의 확대를 줄인다.","page":175},{"title":"116 · 쉬운 일도 신중하게","text":"큰 성취에 집착하지 않으면서도 쉬운 일을 경솔하게 승낙하지 않는다. 모든 일을 신중히 대하는 태도가 어려움을 예방한다.","page":176},{"title":"117 · 끝까지 처음의 주의로","text":"큰 나무와 건물도 작은 시작에서 자란다. 문제가 커지기 전에 처리하고, 거의 끝났을 때도 처음과 같은 주의를 유지한다.","page":177},{"title":"118 · 결과 집착을 덜기","text":"잘하려는 억지와 성취를 움켜쥐는 마음이 막바지의 실패를 부를 수 있다. 집착을 줄이되 마지막까지 조심스럽게 마무리한다.","page":179},{"title":"119 · 간과한 것에서 배우기","text":"희귀한 재물과 특별한 배움만 좇지 않고 놓친 것들을 돌아본다. 만물의 자연스러운 성장을 돕되 억지로 힘을 더하지 않는다.","page":180}],"practice":["미루고 있는 큰 일을 지금 할 수 있는 작은 행동 하나로 나눈다."],"keywords":["낮춤","협력","작은시작","마무리"]},{"id":"tao-15","title":"세 가지 보물과 다투지 않는 덕","part":"하편 덕경 · 편집상 묶음","pages":[181,193],"summary":"잔꾀와 위선으로 다스리기보다 낮은 자리에서 사람들을 이끈다. 자애·검소·앞서려 하지 않음을 용기와 넉넉함, 오래가는 지도력의 바탕으로 제시한다.","points":[{"title":"120 · 잔꾀 없는 다스림","text":"여기서 어리석음은 백성을 무지하게 만들라는 단순한 뜻보다 지도자가 기교와 위선을 버리는 태도로 풀이된다. 모른다는 마음으로 통치하는 편이 해로운 술수를 줄인다.","page":181},{"title":"121 · 근원으로 돌아가는 깊은 덕","text":"모범이 무엇인지 알고 그 기준을 지키는 덕은 깊고 쉽게 드러나지 않는다. 여러 사물과 함께 순환하며 근원으로 돌아간다.","page":182},{"title":"122 · 아래에서 이끄는 지도력","text":"강과 바다는 낮은 곳에 있어 물을 모은다. 지도자도 말과 행동을 낮추면 사람들에게 부담과 피해를 주지 않고 자발적인 지지를 얻는다.","page":184},{"title":"123 · 남의 기준에 맞추지 않는 도","text":"큰 도는 익숙한 형식과 닮지 않아 낯설게 보일 수 있다. 남의 눈치에 맞추는 것을 삶의 유일한 기준으로 삼지 않는다.","page":186},{"title":"124 · 간직할 세 태도","text":"소중히 지킬 기준으로 자애로운 마음, 검소함, 남보다 먼저 나서려 하지 않는 자세를 든다. 힘과 성취의 토대를 내적 태도에서 찾는다.","page":187},{"title":"125 · 배려가 만드는 용기","text":"자애는 용기를, 욕망의 절제는 넉넉한 나눔을 가능하게 한다. 앞서려는 욕심이 적을수록 더 큰 책임을 감당할 수 있다.","page":189},{"title":"126 · 보물을 버리지 않는 힘","text":"배려 없는 용기, 절제 없는 풍요, 양보 없는 선두 추구는 위태롭다. 자애를 지키는 태도를 견고한 보호의 기반으로 삼는다.","page":190},{"title":"127 · 분노와 과시 없는 능력","text":"뛰어난 장수와 지도자는 용맹을 자랑하거나 분노에 끌려가지 않는다. 정면충돌을 줄이고 자신을 낮추는 데 능하다.","page":191},{"title":"128 · 불가피한 싸움과 겸손","text":"주도권을 과시하며 진격하기보다 방어와 물러남을 고려한다. 상대를 얕보는 오만을 경계하고 싸움을 불가피한 일로 대한다.","page":192}],"practice":["어려운 결정에서 자애·절제·양보를 각각 어떻게 지킬지 적는다."],"keywords":["자애","검소","겸손","불쟁"]},{"id":"tao-16","title":"모름의 자각과 권력의 한계","part":"하편 덕경 · 편집상 묶음","pages":[194,203],"summary":"진짜 가치는 외양과 인정의 크기로 결정되지 않으며, 모름을 아는 일이 지혜의 출발점이다. 폭력과 과도한 수탈이 사람을 다스리는 힘 자체를 무너뜨린다고 경계한다.","points":[{"title":"129 · 평범한 외양 안의 가치","text":"쉬운 말도 그 근본을 알지 못하면 이해하고 실천하기 어렵다. 타인의 인정이 적어도 내면에 간직한 가치가 사라지는 것은 아니다.","page":194},{"title":"130 · 알지 못함을 알아차리기","text":"모르는 부분을 자각하는 것이 가장 나은 앎이다. 자신의 무지를 문제로 인식하지 못할 때 잘못을 고칠 기회도 놓친다.","page":196},{"title":"131 · 위협 없이 얻는 권위","text":"사람들의 거처와 생업을 압박하지 않을 때 지도자에 대한 반감이 줄어든다. 자기 이해와 자존을 과시나 억압으로 바꾸지 않는다.","page":197},{"title":"132 · 행동의 득실을 단정하지 않기","text":"위험을 감수한 행동과 행동하지 않는 용기는 상황에 따라 생명을 해치거나 지킬 수 있다. 자신의 판단만으로 최종적인 이로움을 확정하지 않는다.","page":198},{"title":"133 · 강제 없이 작용하는 질서","text":"하늘의 도는 다투거나 명령하지 않으면서도 넓게 작용하는 질서로 묘사된다. 눈앞의 느슨함을 아무 기준도 없는 상태로 보지 않는다.","page":199},{"title":"134 · 죽음의 위협이 가진 한계","text":"죽음을 두려워하지 않는 사람에게 죽음의 협박은 힘을 잃는다. 처벌로 통제하려는 생각이 무엇에 의존하는지 묻는다.","page":201},{"title":"135 · 살상을 통한 지배의 반작용","text":"생사를 마음대로 결정하며 통치하는 행위는 감당하기 어려운 일을 대신 맡는 것과 같다. 폭력의 피해가 결국 행사한 자에게 돌아올 수 있음을 경계한다.","page":202},{"title":"136 · 지도자의 안위가 낳는 고통","text":"과한 세금과 지도자의 작위, 자기 안위만 챙기는 태도가 백성의 굶주림과 혼란을 만든다. 삶을 지키려는 집착이 다른 삶을 해치지 않도록 한다.","page":203}],"practice":["현재 결정에서 확실히 아는 것과 아직 모르는 것을 구분해 적는다."],"keywords":["무지의자각","권위","폭력","책임"]},{"id":"tao-17","title":"유연함과 나누는 삶","part":"하편 덕경 · 편집상 묶음","pages":[204,215],"summary":"부드러움은 살아 있는 존재의 특징이며 강함만 고집하는 태도보다 오래 작용한다. 부족한 곳에 보태고 원한을 만들지 않으며 가까운 삶의 충분함을 누리는 방향으로 마무리된다.","points":[{"title":"137 · 살아 있음의 유연함","text":"살아 있는 몸과 초목의 부드러움, 죽은 뒤의 굳음을 대비한다. 유연함을 생명력과 연결해 이해한다.","page":204},{"title":"138 · 강함만으로 버틸 수 없다","text":"강한 무기만으로 승리가 보장되지 않고 단단한 나무도 부러질 수 있다. 약하고 부드러워 보이는 성질이 오히려 오래 살아남는 힘이 된다.","page":205},{"title":"139 · 남는 것을 모자란 곳으로","text":"하늘의 도는 과잉을 덜고 부족을 채우는 균형으로 묘사된다. 성인은 나누고 이루어도 공로나 현명함을 자랑하지 않는다.","page":206},{"title":"140 · 알고 있는 유연함을 실천하기","text":"물은 부드럽지만 단단한 것에도 작용한다. 이 역설을 아는 것과 실제 대처에서 유연함을 선택하는 것 사이의 간격을 묻는다.","page":208},{"title":"141 · 지도자가 짊어질 몫","text":"공동체의 수치와 불행을 감당할 수 있어야 그 공동체를 이끌 자격이 있다. 책임을 피하지 않는 태도는 겉의 영광과 반대로 보일 수 있다.","page":209},{"title":"142 · 원한을 남기지 않는 권리 행사","text":"화해 뒤에도 앙금이 남을 수 있으므로 처음부터 원한을 만들지 않는 것이 중요하다. 정당한 요구라도 가혹하게 행사하지 않는다.","page":210},{"title":"143 · 가까운 삶에서 누리는 충분함","text":"작은 공동체에서 안전한 거처, 먹고 입는 즐거움, 평온한 풍속을 누리는 이상을 제시한다. 확장과 이동보다 자기 생활에 만족하는 조건을 중시한다.","page":212},{"title":"144 · 화려한 말과 진실 구별하기","text":"유려하고 장황한 말이 진실과 지혜를 보장하지 않는다. 말의 꾸밈보다 마음과 실제 이해가 일치하는지 살핀다.","page":214},{"title":"145 · 나눔으로 넓어지는 풍요","text":"많이 쌓거나 많이 안다는 사실을 선과 지혜로 동일시하지 않는다. 다른 이를 이롭게 하고 해를 줄이며 다투지 않는 행위에서 풍요를 찾는다.","page":215}],"practice":["내게 남는 자원 하나를 필요한 곳에 보태되 보답을 조건으로 삼지 않는다."],"keywords":["유연함","균형","나눔","소박한삶"]},{"id":"tao-18","title":"해설 · 이 책은 어떻게 노자를 읽는가","part":"해설 · 편집상 묶음","pages":[216,229],"summary":"이 책은 통용본의 단일한 직역이 아니라 여러 판본을 검토한 편자의 초역이다. 백서본을 주요 근거로 삼으며, 존재와 이름이 열린 가능성이라는 관점에서 전체를 해석한다.","points":[{"title":"다섯 해에 걸친 초역","text":"편자는 논어 연구 경험을 바탕으로 노자 번역에 착수했으나 완성까지 약 5년이 걸렸다고 밝힌다. 짧은 원문의 뜻을 현대 독자에게 풀어내는 작업임을 설명한다.","page":216},{"title":"텍스트 선택도 해석의 일부","text":"노자에는 서로 다른 주석본과 필사본이 있어 먼저 어떤 텍스트를 읽을지 결정해야 한다. 책은 하나의 판본과 해석만이 존재한다는 전제를 경계한다.","page":217},{"title":"백서본과 통용본의 차이","text":"해설은 마왕퇴 백서본이 통용본과 순서·구획·글자에서 차이를 보인다고 설명한다. 특히 덕경이 앞에 놓이는 구조와 표현의 차이를 해석상 중요한 근거로 삼는다.","page":218},{"title":"대기만성에서 지속적 성장으로","text":"편자는 백서본의 다른 글자를 근거로 큰 그릇이 완성되지 않는다는 독법을 택한다. 핵심은 성공이 늦다는 위로보다 삶의 가능성을 고정된 틀로 닫지 않는 데 있다.","page":220},{"title":"주요 근거와 선택적 대조","text":"고이게 이치로의 백서 도덕경 교정 연구를 주된 근거로 삼되 모든 결론을 그대로 따르지는 않는다. 텍스트의 누락과 차이 때문에 다른 필사본과의 비교가 필요하다고 밝힌다.","page":221},{"title":"곽점본과 베이징대학 죽간","text":"곽점본의 성격과 계통에는 견해 차이가 있음을 설명한다. 이어 베이징대학 소장 죽간은 이 책 집필 당시 논의가 충분하지 않아 참고 자료로 사용했다고 밝힌다.","page":222},{"title":"제1장을 길게 풀어낸 이유","text":"편자는 첫 장에 책 전체를 읽는 기본 관점을 담기 위해 의도적으로 설명을 늘렸다. 본문의 001–005는 이 확장된 해석의 일부로 읽어야 한다.","page":223},{"title":"통설과 다른 문장 읽기","text":"말로 표현된 도는 영원한 도가 아니라는 일반적 해석과 달리, 편자는 현종 주석의 독법을 지지한다. 도와 이름이 항상 하나로 고정되지 않는 가능성의 상태라는 해석을 제시한다.","page":226},{"title":"존재와 이름의 열린 관계","text":"같은 말도 사용 맥락에 따라 다른 대상을 가리킨다. 편자는 도를 구체적인 존재와 떼어놓지 않고, 변화하는 존재와 변화하는 이름의 관계로 이해한다.","page":228},{"title":"새로운 세계관을 향한 제안","text":"변하지 않는 근원을 현상 뒤에 따로 세우는 해석을 피하고자 한다. 이 관점으로 굳어진 지식 체계를 다시 살펴 현실의 문제에 접근하는 것이 편자가 밝힌 집필 취지다.","page":229}],"practice":["다른 번역을 읽을 때 결론뿐 아니라 어떤 판본과 문장 구분을 택했는지 함께 비교한다."],"keywords":["초역","백서본","판본","해석"]}],"notes":["범위: 표지 1쪽, 서문 2–7쪽, 차례 8–15쪽, 본문 도경·덕경 19–215쪽, 해설 216–229쪽, 출판정보 230쪽을 확인했다. 본문 번호 001–145를 빠짐없이 포함하고, 반복 인용·장식·빈 페이지는 별도 항목으로 중복하지 않았다.","이 사이트의 18개 주제 묶음과 항목별 제목·요약·실천 제안은 편집상 재구성이다. 원서의 큰 구분인 상편 도경과 하편 덕경은 유지했으며, 번호는 원서의 145개 항목 번호다.","모든 페이지 표시는 PDF의 물리적 페이지 순번이다. 본문의 인쇄 쪽수는 대체로 PDF 순번보다 2쪽 크며, 항목이 여러 페이지에 걸치면 그 항목의 시작 페이지를 연결했다.","전체 OCR 텍스트를 읽고 목차·본문 순서를 대조했다. 일부 OCR의 번호 누락과 글자 오류는 앞뒤 항목 및 원본 이미지로 보완했다. 이것은 원문의 교정·전사가 아니라 의미 중심의 요약이다.","저자·편자·역자 표기는 PDF 230쪽 판권을 따랐다: 노자 지음, 야스토미 아유미 엮음, 김현영 옮김, 삼호미디어, 2022년 9월 5일 2판 1쇄.","대기면성, 인·충, 제1장 및 판본에 관한 설명은 이 책 편자의 해석이다. 이를 노자 연구 전체의 유일한 정설이나 다른 번역의 공통 결론으로 제시하지 않는다.","기·혼백·음양·수명과 신체에 관한 표현은 이 고전의 사유와 비유를 요약한 것이며, 현대적인 의학적 효능이나 수명 보장을 뜻하지 않는다.","실천 제안은 오늘의 독서를 돕는 편집자의 응용이며, 원문에 있는 지시나 저자가 작성한 활동 과제가 아니다."]}];

  }
  function sourcesView() {
    return `<div class="eyebrow">SOURCES & READING GUIDE</div><h1 class="page-title">자료와 읽기 안내</h1><p class="page-lede">등록된 ${books.length}개의 PDF를 각각 분석해 핵심 내용을 재서술했습니다. 책의 문장을 그대로 모으기보다, 생각의 구조를 따라 다시 읽도록 구성했습니다.</p><div class="sources-grid">${books.map(b=>`<section class="source-card"><h2>${esc(b.title)}</h2><p>${esc(b.author)}<br>원문 PDF ${b.pages}쪽 · ${b.chapters.length}개 학습 주제로 정리</p><button class="outline-button" data-source="${b.id}" data-page="1">${icon('file')}${pdfUrls.has(b.id)?'연결한 원문 열기':'이 기기의 원문 PDF 연결'}</button><p class="note">${b.notes.map(esc).join('<br>')}</p></section>`).join('')}</div><section class="method"><h2>서재를 읽는 방법</h2><p><strong>출처 페이지</strong>는 PDF 파일의 첫 페이지를 1쪽으로 센 번호입니다. 책에 인쇄된 쪽수와 다를 수 있습니다. 본문의 페이지 표기를 누른 뒤 해당 PDF를 선택하면 원문을 열 수 있습니다. PDF는 외부에 업로드되지 않습니다.</p><p><strong>핵심 요약과 본문</strong>은 첨부 자료의 내용을 주제별로 재구성한 것입니다. <strong>실천 질문과 연결된 지식</strong>은 학습을 돕기 위한 편집 제안입니다. 책에서 소개한 연구 수치, 사례, 철학적 해석은 해당 저자의 관점과 맥락 안에서 읽어 주세요.</p><p><strong>자료의 범위</strong>는 행복한 커플은 어떻게 싸우는가의 갈등 원리와 실천, 5가지 사랑의 언어의 본문·FAQ·검사 안내, 노자의 말의 001–145 항목과 해설입니다. 서재의 학습 목차는 원문의 목차와 일대일로 같지 않을 수 있습니다.</p><p><strong>스캔본 문자 인식</strong>을 거쳐 정리하고 주요 제목과 번호를 확인했습니다. 인식 오류나 요약 과정의 누락 가능성이 있으므로 원문 전체를 대신하는 자료로 보지는 마세요. 출판 정보, 참고문헌, 검사 문항 전문과 사례의 모든 세부는 재수록하지 않았습니다.</p><p><strong>책갈피와 읽기 기록</strong>은 이 브라우저에만 저장됩니다. 다른 기기와 동기화되지 않으며 브라우저 데이터를 삭제하면 기록도 사라집니다. 책장 표지는 탐색을 위한 서재 전용 디자인입니다.</p></section>`;
  }
  function resolveRoute() {
    const hash=location.hash.slice(1) || `book/${books[0].id}`;
    const [type,id]=hash.split('/');
    if (type==='book') {const book=books.find(b=>b.id===id);if(book)return {type,book};}
    if(type==='read') {for(const book of books){const chapter=book.chapters.find(c=>c.id===id);if(chapter)return {type,book,chapter};}}
    if(['home','saved','connections','sources'].includes(type)&&!id)return {type};
    return {type:'missing'};
  }
  function render(focus=false) {
    route=resolveRoute();
    document.documentElement.style.setProperty('--reading-size',`${fontSize}px`);
    navigation();
    const labels={home:'나의 라이브러리',connections:'연결된 지식',saved:'책갈피',sources:'자료와 읽기 안내',missing:'페이지를 찾을 수 없음'};
    const label=route.book?.title || labels[route.type];
    $('breadcrumb').innerHTML=`<a href="#home">나의 라이브러리</a>${route.type!=='home'?`<span>/</span>${esc(label)}`:''}`;
    document.title=`${route.chapter?.title || label} · 사유의 서재`;
    const views={home,connections:connectionsView,saved:savedView,sources:sourcesView,book:()=>bookView(route.book),read:()=>readView(route.book,route.chapter),missing:()=>`<div class="empty-state"><h1 class="page-title">이 생각을 찾을 수 없어요</h1><p>주소가 바뀌었거나 올바르지 않습니다. 책장에서 다시 찾아보세요.</p><a class="primary-button" href="#home">책장으로 돌아가기</a></div>`};
    $('main').innerHTML=views[route.type]();
    if(route.chapter){recent=[route.chapter.id,...recent.filter(x=>x!==route.chapter.id)].slice(0,10);persist('recent',recent);}
    if(focus){window.scrollTo(0,0);$('main').focus({preventScroll:true});}
  }
  function toggleMenu(open, restore=true) {
    $('sidebar').classList.toggle('open',open);$('scrim').hidden=!open;$('menu-toggle').setAttribute('aria-expanded',String(open));
    $('sidebar').inert=window.matchMedia('(max-width:850px)').matches&&!open;
    $('menu-toggle').setAttribute('aria-label',open?'메뉴 닫기':'메뉴 열기');
    document.body.style.overflow=open?'hidden':'';
    document.querySelector('.workspace').inert=open;
    if(open)$('sidebar').querySelector('a').focus();else if(restore)$('menu-toggle').focus();
  }
  function showSearch(query=$('search-input').value) {
    toggleMenu(false,false);
    $('search-input').value=query;
    $('search-panel').hidden=false;
    search(query);
    $('search-input').focus();
  }
  function hideSearch(restore=false) {
    if(restore)$('search-input').focus();
    $('search-panel').hidden=true;
  }
  const normalize=s=>s.toLocaleLowerCase('ko').normalize('NFKC');
  const guideTemplate=document.createElement('template');
  guideTemplate.innerHTML=sourcesView();
  const searchIndex = [
    ...chapters.map(c=>({title:c.title,source:`${c.book.title} · PDF ${c.pages[0]}–${c.pages[1]}쪽`,href:chapterHref(c),text:[c.title,c.book.title,c.book.author,c.part,c.summary,...c.points.map(p=>p.title+' '+p.text),...c.practice,...c.keywords].join(' ')})),
    ...books.map(b=>({title:b.title,source:'자료 소개 · '+b.author,href:bookHref(b),text:[b.title,b.author,b.subtitle,b.description,b.category].filter(Boolean).join(' ')})),
    ...books.map(b=>({title:`${b.title} · 출처 안내`,source:'자료와 읽기 안내',href:'#sources',text:[b.title,b.author,...b.notes].join(' ')})),
    ...connectionThemes.map(t=>({title:t.title,source:'자료 사이의 연결 · 편집 해석',href:'#connections',text:[t.title,t.text,...t.items.flat()].join(' ')})),
    {title:'서재를 읽는 방법',source:'자료와 읽기 안내',href:'#sources',text:guideTemplate.content.querySelector('.method').textContent},
  ].map(entry=>({...entry,normalized:normalize(entry.text)}));
  function highlight(text, query) {
    const escaped=esc(text); if(!query)return escaped;
    const regex=new RegExp(esc(query).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    return escaped.replace(regex,match=>`<mark>${match}</mark>`);
  }
  function search(value) {
    const query=value.trim(),q=normalize(query);
    if(!q){$('search-results').innerHTML='<p class="search-count">어떤 생각을 찾고 있나요?</p><div class="chips">'+['갈등','인정','사랑','무위','회복','언어'].map(k=>`<button class="chip" data-search="${k}">${k}</button>`).join('')+'</div>';return;}
    const results=searchIndex.filter(entry=>entry.normalized.includes(q));
    $('search-results').innerHTML=`<p class="search-count">${results.length}개의 검색 결과${results.length>80?' · 앞의 80개 표시':''}</p>`+(results.length?results.slice(0,80).map(({title,source,href,text,normalized})=>{const index=normalized.indexOf(q),start=Math.max(0,index-35),snippet=(start?'…':'')+text.slice(start,start+150)+(text.length>start+150?'…':'');return `<a class="search-result" href="${href}"><small>${esc(source)}</small><h3>${highlight(title,query)}</h3><p>${highlight(snippet,query)}</p></a>`;}).join(''):'<div class="empty-state"><h2>일치하는 생각이 없어요</h2><p>짧은 단어나 다른 표현으로 찾아보세요.<br>예: 사랑, 대화, 무위</p></div>');
  }
  function showSource(bookId,page) {
    const book=books.find(b=>b.id===bookId); if(!book)return;
    pendingSource={book,page};$('source-error').textContent='';$('pdf-input').value='';
    const connected=pdfUrls.get(bookId);
    $('source-detail').innerHTML=`<strong>${esc(book.title)}</strong><p>PDF ${page}쪽 · 파일의 첫 페이지를 1쪽으로 센 번호</p>${connected?`<p class="muted small">연결된 파일: ${esc(connected.name)}</p><a class="primary-button" href="${connected.url}#page=${page}" target="_blank" rel="noopener">PDF ${page}쪽 열기 ↗</a>`:`<p class="muted">이 기기에 있는 <strong>${esc(book.title)}.pdf</strong>를 선택해 원문과 함께 읽어 보세요.</p>`}`;
    if(!$('source-dialog').open)$('source-dialog').showModal();
  }
  $('pdf-input').addEventListener('change',async event=>{
    const file=event.target.files[0],request=pendingSource;if(!file||!request)return;
    try{
      const bytes=new Uint8Array(await file.slice(0,5).arrayBuffer());
      if(String.fromCharCode(...bytes)!=='%PDF-')throw new Error('PDF 파일을 선택해 주세요.');
      const old=pdfUrls.get(request.book.id);if(old)URL.revokeObjectURL(old.url);
      pdfUrls.set(request.book.id,{url:URL.createObjectURL(file),name:file.name});
      if(pendingSource===request)showSource(request.book.id,request.page);
      toast('PDF가 이 창에 연결되었습니다. 원문 열기를 눌러 주세요.');
    }catch(error){$('source-error').textContent=error.message || '파일을 읽지 못했습니다. 다시 선택해 주세요.';}
  });
  document.addEventListener('click',event=>{
    if(!event.target.closest('#header-search'))hideSearch();
    const target=event.target.closest('button,a');if(!target)return;
    if(target.classList.contains('skip')){event.preventDefault();$('main').focus();return;}
    if(target.dataset.close){$(target.dataset.close).close();return;}
    if(target.dataset.search!==undefined){showSearch(target.dataset.search);return;}
    if(target.dataset.source){showSource(target.dataset.source,Number(target.dataset.page));return;}
    if(target.dataset.save){const id=target.dataset.save,wasSaved=saved.has(id);wasSaved?saved.delete(id):saved.add(id);persist('saved',[...saved]);const scroll=window.scrollY;render();window.scrollTo(0,scroll);const replacement=document.querySelector(`[data-save="${id}"]`);if(replacement)replacement.focus({preventScroll:true});else $('main').focus({preventScroll:true});toast(wasSaved?'책갈피를 해제했습니다.':'책갈피에 생각을 담았습니다.');return;}
    if(target.dataset.finish){const id=target.dataset.finish;finished.has(id)?finished.delete(id):finished.add(id);persist('finished',[...finished]);const scroll=window.scrollY;render();window.scrollTo(0,scroll);document.querySelector(`[data-finish="${id}"]`).focus({preventScroll:true});toast(finished.has(id)?'읽은 주제로 기록했습니다.':'읽음 표시를 해제했습니다.');return;}
    if(target.dataset.font){fontSize=Math.max(15,Math.min(20,fontSize+Number(target.dataset.font)));persist('font',fontSize);document.documentElement.style.setProperty('--reading-size',`${fontSize}px`);document.querySelector('[data-font="-1"]').disabled=fontSize<=15;document.querySelector('[data-font="1"]').disabled=fontSize>=20;return;}
    if(target.hasAttribute('data-print')){window.print();return;}
    if(target.matches('a[href^="#"]')){hideSearch();if($('sidebar').classList.contains('open'))toggleMenu(false,false);if(target.hash===location.hash)$('main').focus();}
  });
  $('menu-toggle').innerHTML=icon('menu');$('search-icon').innerHTML=icon('search');
  $('menu-toggle').addEventListener('click',()=>{hideSearch();toggleMenu(!$('sidebar').classList.contains('open'));});
  $('scrim').addEventListener('click',()=>toggleMenu(false));
  $('search-form').addEventListener('submit',event=>{event.preventDefault();showSearch();});
  $('search-input').addEventListener('focus',()=>{$('search-panel').hidden=false;search($('search-input').value);});
  $('search-input').addEventListener('input',event=>{$('search-panel').hidden=false;search(event.target.value);});
  $('search-input').addEventListener('click',()=>{$('search-panel').hidden=false;search($('search-input').value);});
  $('search-close').addEventListener('click',()=>hideSearch(true));
  $('header-search').addEventListener('focusout',event=>{if(!event.relatedTarget||!$('header-search').contains(event.relatedTarget))hideSearch();});
  window.addEventListener('hashchange',()=>{hideSearch();render(true);});
  document.addEventListener('keydown',event=>{
    if(event.isComposing)return;
    if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('source-dialog').open)showSearch();}
    if(event.key==='Escape'&&!$('search-panel').hidden){event.preventDefault();hideSearch(true);}
    if(event.key==='Escape'&&$('sidebar').classList.contains('open')){event.preventDefault();toggleMenu(false);}
    if(event.key==='Tab'&&$('sidebar').classList.contains('open')){const links=[...$('sidebar').querySelectorAll('a')],first=links[0],last=links.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  window.matchMedia('(min-width:851px)').addEventListener('change',()=>toggleMenu(false,false));
  window.addEventListener('beforeunload',()=>{for(const pdf of pdfUrls.values())URL.revokeObjectURL(pdf.url);});
  render();
  toggleMenu(false,false);
})();
</script></body>
</html>
