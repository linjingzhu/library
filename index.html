<script>window.LIBRARY = [{"order":10,"category":"관계의 기술 · 갈등과 회복","id":"conflict","title":"행복한 커플은 어떻게 싸우는가","author":"존 가트맨 · 줄리 슈워츠 가트맨","subtitle":"갈등 문화부터 대화의 시작·진정·꿈·타협·회복까지, 잘 싸우는 다섯 가지 전환","description":"가트맨 부부는 싸움의 유무보다 싸우는 방식과 갈등 전후의 연결을 살핀다. 이 자료는 책의 8개 장을 주제별로 나누어, 회피형·수긍형·발끈형의 차이, 긍정적 교류, 반복되는 갈등 속의 꿈, 부드러운 시작, 홍수 상태의 진정, 베이글 타협, 싸움 후 5단계 회복을 사례와 함께 정리한 독서 길잡이다. 원문을 길게 옮기지 않고 논지를 풀어 썼으며, 실천 항목은 독자가 적용하기 쉽게 재구성했다.","pages":466,"color":"blue","chapters":[{"id":"conflict-01","title":"싸움을 없애기보다 연결의 기회로 바꾸기","part":"들어가는 글","pages":[8,31],"summary":"갈등의 부재는 관계가 건강하다는 증거가 아니다. 서로 다른 욕구와 꿈을 알아가는 방식으로 갈등을 다루면, 다툼은 거리감을 키우는 사건에서 이해를 깊게 하는 과정으로 달라질 수 있다.","points":[{"title":"개를 둘러싼 싸움의 실제 쟁점","text":"도입부의 부부는 반려견 입양과 돌봄을 놓고 다투지만, 그 아래에는 자유롭게 모험하고 싶은 마음과 가족·동반자의 안정감을 원하는 마음이 대립한다. 합의 없는 입양, 간접적인 불평, 서로의 요청을 거절하는 행동이 쌓이면서 사소한 일까지 존중받지 못한다는 증거로 변했다.","page":9},{"title":"조용한 관계에도 거리감이 생긴다","text":"다른 사례의 부부는 싸움을 피하며 공손하게 지냈지만 상대의 친구, 스트레스, 꿈을 제대로 알지 못했다. 불만을 말하지 않아 유지한 평화는 친밀함을 보장하지 않았다. 저자들이 말하는 좋은 갈등의 목적은 승리가 아니라 서로의 실제 경험을 알게 되는 것이다.","page":17},{"title":"해결과 관리의 구별","text":"책은 커플 갈등의 69%가 성격·가치관·생활방식에 연결된 영속적 문제이며, 이 영속적 싸움 가운데 16%가 교착상태에 있다고 제시한다. 따라서 모든 문제를 없애겠다는 목표보다, 되풀이되는 차이를 덜 상처 주는 대화로 다루겠다는 목표가 필요하다.","page":27},{"title":"다섯 가지 전환","text":"이후 장들은 거친 시작, 공격과 방어, 표면적 논쟁, 승패 경쟁, 미해결된 과거라는 다섯 실패 지점을 다룬다. 각각 부드럽게 시작하기, 진정과 화해, 갈등 속 꿈 탐구, 핵심을 지키는 타협, 싸움 후 감정정리로 연결된다.","page":24}],"practice":["최근 다툼 하나의 표면 주제와 그 아래에서 지키고 싶었던 욕구를 따로 적는다.","다투지 않으려 숨겨온 작은 불만이 있다면, 말할 수 있는 안전한 시간과 구체적인 요청을 준비한다."],"keywords":["갈등의 목적","영속적 문제","연결","다섯 싸움 유형","친밀감"]},{"id":"conflict-02","title":"갈등의 암호: 사건보다 상호작용의 흐름","part":"1장 · 갈등 없는 커플이 더 위험하다","pages":[39,49],"summary":"저자들의 연구는 무엇 때문에 싸우는가보다 한 발언 뒤에 어떤 반응이 이어지는가를 관찰한다. 어조, 표정, 생리적 각성, 화해 시도까지 함께 보아야 대화가 무너지는 경로를 이해할 수 있다.","points":[{"title":"소파에서 잘 것인가의 문제","text":"처가 부모에게 침실을 내주는 결정이 이미 내려졌다는 말에서 시작한 싸움은 곧 과거의 무례, 빈정거림, 방어, 침묵으로 번진다. 실제 쟁점을 검토하기도 전에 상대에게 존중받지 못한다는 감각이 커지면서 두 사람 모두 듣는 능력을 잃는 사례다.","page":41},{"title":"SPAFF와 맥락","text":"책은 특정 정서 기호화 시스템인 SPAFF가 말의 사전적 의미뿐 아니라 강조, 어조, 몸짓과 문화적 맥락을 함께 읽도록 개발되었다고 설명한다. 겉으로 웃거나 목소리가 크다는 단일 신호만으로 교류를 좋고 나쁘게 판정할 수 없다는 뜻이다.","page":46},{"title":"전형적인 격화 과정","text":"작은 불일치에서 출발해 서로의 말을 자르고, 비난·경멸·방어·담쌓기가 나타나며, 몸과 감정이 과각성되는 홍수가 뒤따른다. 긍정적 교류가 사라지고 수습 시도도 줄면 두 사람은 함께 문제를 보는 대신 서로를 문제로 보기 쉽다.","page":48},{"title":"예측은 운명이 아니다","text":"저자들은 사랑실험실의 장기 추적과 미세한 상호작용 분석으로 높은 예측 정확도를 얻었다고 보고한다. 이 자료에서 유용한 점은 특정 커플의 운명을 판정하는 데 있지 않고, 대화가 나빠지는 관찰 가능한 순간을 개입 지점으로 삼는 데 있다.","page":45}],"practice":["최근 대화를 발단→나의 반응→상대 반응→몸의 변화→수습 시도 순으로 짧게 그려본다.","말의 내용과 별도로 어조·끼어들기·시선 회피가 대화에 미친 영향을 살핀다."],"keywords":["SPAFF","사랑실험실","상호작용","갈등 격화","4가지 독"]},{"id":"conflict-03","title":"차이와 생활 스트레스가 관계 안으로 들어올 때","part":"1장 · 갈등 없는 커플이 더 위험하다","pages":[50,54],"summary":"처음에는 매력적이던 차이가 함께 살면서 마찰이 될 수 있다. 출산, 이사, 돌봄, 노동의 피로 같은 외부 조건도 커플의 대화 능력에 영향을 준다.","points":[{"title":"매력과 마찰은 같은 특성에서 생길 수 있다","text":"즉흥성은 재미로 느껴지다가 계획을 지키지 않는 태도로, 사교성은 활력으로 느껴지다가 함께 있을 시간의 부족으로 해석될 수 있다. 상대를 나와 같은 사람으로 고치려는 시도보다 그 특성의 장점과 비용을 함께 인정해야 한다.","page":52},{"title":"비슷해 보이는 커플도 욕구가 다르다","text":"책의 예술가 커플은 창작이라는 공통 관심사를 지니지만 한 사람은 교류에서, 다른 사람은 고독에서 에너지를 얻는다. 취향이나 직업이 비슷하다는 사실만으로 휴식·자율성·관계의 방식까지 같다고 가정할 수 없다.","page":53},{"title":"인생 전환은 기존 균형을 바꾼다","text":"부모가 되기, 부모님을 모시기, 이직, 이사, 경제상황 변화는 시간과 역할의 배치를 다시 요구한다. 저자들은 자신들의 신혼부부 연구에서 출산 후 3년 무렵 67%의 부부가 행복도 저하와 적대감 증가를 보였다고 제시하며, 전환기에 갈등 관리가 특히 필요하다고 설명한다.","page":53},{"title":"그날의 잔재","text":"경찰관과 배우자를 관찰한 연구를 인용하며, 스트레스가 높은 날에는 생리적 각성과 부정적 감정이 늘고 긍정적 교류가 줄었다고 설명한다. 파트너에게 향하는 날 선 반응 중에는 관계 밖에서 소진된 여력이 섞여 있을 수 있다.","page":54}],"practice":["다툼 직전의 수면·업무·돌봄·몸 상태를 함께 기록한다.","서로에게 끌렸던 차이 하나와 현재 그 차이 때문에 생기는 불편을 같이 적어 양면을 본다."],"keywords":["성격 차이","생활 전환","출산","외부 스트레스","피로"]},{"id":"conflict-04","title":"분노는 정보이며, 표현 방식이 문제다","part":"1장 · 갈등 없는 커플이 더 위험하다","pages":[55,64],"summary":"책은 분노 자체를 관계 파탄의 징후로 보지 않는다. 자신의 불만과 막힌 목표를 알아차리되, 그것을 인격 공격으로 전달하지 않는 것이 중요하다.","points":[{"title":"초기의 불만 표현이 관계에 도움이 될 수 있다","text":"저자들은 신혼부부 추적에서 여성이 문제를 꺼낼 수 있었던 일부 관계가 장기적으로 더 튼튼해졌다고 설명한다. 겉으로 갈등이 적어 보여도 버림받거나 싸움이 커질까 두려워 욕구를 억누르는 상태라면 다른 의미를 가진다. 특정 표본의 관찰을 모든 성별 관계의 역할 규칙으로 바꿔서는 안 된다.","page":56},{"title":"분노와 네 가지 독을 분리하기","text":"분노는 좌절된 목표나 충족되지 않은 필요를 드러낸다. 관계에 타격을 주는 것은 그 감정을 비난·경멸·방어·담쌓기로 처리하는 패턴이다. 감정을 없애는 것과 감정을 해롭게 표현하지 않는 것은 다른 과제다.","page":58},{"title":"접근 감정이라는 관점","text":"책은 분노가 단절만을 뜻하지 않고 무언가에 관여하고 영향을 주려는 방향도 갖는다고 설명한다. 그래서 분노를 숨기거나 부끄러워하기보다 어떤 요구가 좌절되었는지 살피고 호기심으로 전달할 수 있다.","page":59},{"title":"나와 우리 사이의 긴장","text":"커플은 두 사람의 정체성·선호·판단을 공동생활의 협력과 계속 조정한다. 자율성과 결속이 모두 필요하므로 충돌 자체는 이상 현상이 아니다. 잘 싸운다는 것은 상대를 없애는 합의가 아니라 두 사람의 차이를 다룰 언어를 갖추는 일이다.","page":62}],"practice":["화가 난 일에서 '상대의 결함' 대신 '막힌 나의 목표'를 찾아 한 문장으로 쓴다.","분노를 표현하면서도 쓰지 않을 인격 평가 표현을 서로 정한다."],"keywords":["분노","접근 감정","자율성","정체성","비난"]},{"id":"conflict-05","title":"회피형·수긍형·발끈형의 세 갈등 스타일","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[65,74],"summary":"세 스타일은 좋고 나쁜 사람을 나누는 진단이 아니라 갈등을 다루는 경향의 스펙트럼이다. 각 스타일은 장점과 취약점을 함께 지니며, 긍정적 연결을 지키는 방식으로 모두 건강하게 기능할 수 있다.","points":[{"title":"회피형의 두 모습","text":"한 유형은 차이가 보이면 논의를 그만두고 서로의 영역을 분리한다. 다른 유형은 감정과 관심은 나누지만 크게 다른 입장은 더 설득하지 않고 견딘다. 두 경우 모두 안정적으로 지낼 수 있으나, 다뤄야 할 문제까지 덮어두면 고립감이나 위기에 취약해질 수 있다.","page":69},{"title":"수긍형의 장점과 과잉 양보","text":"수긍형은 감정을 절제하고 상대의 관점을 되짚으며 해결과 타협을 시도한다. 다만 분위기를 진정시키려는 마음이 너무 앞서면 자기 입장을 지나치게 포기하거나 깊은 감정을 충분히 살피기 전에 합의를 서두를 수 있다.","page":72},{"title":"발끈형의 강도와 유대","text":"발끈형은 감정을 활발히 드러내고 의견 충돌에 바로 뛰어든다. 책의 '윈저 공작 부부' 사례처럼 열띤 논쟁 속에서도 유머와 애정, 수습이 유지되면 만족스러운 관계를 이어갈 수 있다. 큰 목소리만으로 적대적 관계라고 판단하지 않는다.","page":73},{"title":"고정된 꼬리표가 아니다","text":"한 사람에게 여러 스타일이 섞일 수 있고 상대·상황에 따라 기울기도 한다. 분류의 목적은 자신의 반응이 상대에게 어떻게 읽히는지 알아차리고 대응 범위를 넓히는 데 있다.","page":68}],"practice":["갈등 직후 자신이 대화를 피했는지, 서둘러 타협했는지, 즉시 설득했는지 관찰한다.","각자 가장 편안한 감정 표현 강도와 부담스러운 강도를 설명한다."],"keywords":["회피형","수긍형","발끈형","갈등 스타일","성급한 타협"]},{"id":"conflict-06","title":"5:1의 의미와 스타일별 긍정성","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[75,87],"summary":"저자들은 갈등 스타일보다 긍정적 교류와 부정적 교류의 비율을 핵심적인 구별점으로 제시한다. 수를 세는 기술이 아니라 갈등 중에도 존중·관심·애정이 살아 있는지 점검하는 관점이다.","points":[{"title":"갈등 중 5:1, 평상시 20:1","text":"책에서 제시하는 비율은 갈등 중 긍정적 교류가 부정적 교류보다 약 5배, 갈등 밖에서는 약 20배라는 것이다. 부정적 교류의 영향이 더 크다는 설명이 따라온다. 이는 연구의 관찰 틀이지 부정적인 말 한 번을 칭찬 다섯 번으로 자동 상쇄하는 거래 규칙이 아니다.","page":80},{"title":"긍정성은 반대 의견을 숨기는 일이 아니다","text":"사과, 이해를 나타내는 끄덕임, 상대 말의 타당한 부분 인정, 자신의 책임 수용, 따뜻한 유머도 긍정적 교류다. 문제에 화가 나 있어도 상대가 내 말을 들으려 하고 함께 해결하려는지 느낄 수 있어야 한다.","page":81},{"title":"회피형과 수긍형의 주의점","text":"회피형의 높은 긍정 비율은 중요한 불만을 전혀 다루지 않아서 생길 수도 있다. 수긍형은 합의의 세부사항에 집중하다 애정과 유머를 놓칠 수 있다. 각각 차이를 말할 용기와 해결 과정의 온기를 보완해야 한다.","page":83},{"title":"발끈형의 유머와 냉소는 다르다","text":"열띤 대화를 즐기는 커플도 웃음과 공감이 사라지면 서로 공격 수위를 높이는 경쟁으로 흘러간다. 상대를 낮추고 비웃는 말은 유머의 외양을 지녀도 경멸이므로 긍정성에 포함할 수 없다.","page":87}],"practice":["다음 갈등에서 상대의 타당한 지점 한 가지를 구체적으로 인정해 본다.","대화 중 수치를 기록하기보다, 이해받는 순간과 무시당하는 순간이 있었는지 대화 후 돌아본다."],"keywords":["5:1","20:1","긍정적 교류","유머","경멸"]},{"id":"conflict-07","title":"적대형과 적대적 무심형: 강한 감정과 구별하기","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[88,94],"summary":"건강한 발끈형과 적대적 관계는 다르다. 적대형에서는 상대를 이해하려는 관심과 화해가 사라지고, 적대적 무심형에서는 관계에 관여할 열의까지 소진된다.","points":[{"title":"적대형의 핵심은 긍정성과 협력의 결핍","text":"비난과 방어를 반복하고 상대의 말에서 배울 부분을 찾지 않는다. 목소리가 조용하더라도 자신의 관점만 되풀이하고 상대를 업신여긴다면 협력적인 수긍형과 다르다. 겉의 감정 강도보다 대화가 서로를 향해 열려 있는지가 관건이다.","page":88},{"title":"사례: 공격의 증거를 모으는 관계","text":"땅콩 선물과 격분 장면을 녹화하는 사례는 선물의 물건 자체보다 상대를 자기중심적이거나 나쁜 사람으로 입증하려는 싸움이 굳어진 모습을 보여준다. 다른 사례에서는 성적 친밀감의 욕구 차이가 서로를 모욕하는 언어로 바뀌어 고통을 키운다.","page":89},{"title":"적대적 무심형의 침묵","text":"두 사람은 불만을 툭 던지지만 더 알아보거나 고치려는 힘을 거의 쓰지 않는다. 조용하다는 이유로 평화롭다고 보기 어려우며, 각자의 외로움에 갇혀 상대의 외로움에도 공감하지 못한다.","page":93},{"title":"새 관계를 다시 세우는 수준의 작업","text":"책은 지속적 적대감이 굳어진 경우 기술 몇 개만 익히기보다 신뢰·헌신·우정을 다시 쌓는 깊은 개입이 필요할 수 있다고 설명한다. 사례 중 일부는 회복되고 일부는 헤어지며, 모든 관계가 유지되어야 한다고 주장하지 않는다.","page":94}],"practice":["우리 대화에서 실제로 상대를 이해하려는 질문과 수습 시도가 남아 있는지 살핀다.","반복되는 멸시와 단절이 일상 전체를 지배한다면 도움의 범위를 단순한 대화 연습 이상으로 생각한다."],"keywords":["적대형","적대적 무심형","단절","우정","신뢰"]},{"id":"conflict-08","title":"초감정의 부조화와 서로 다른 감정 언어","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[95,105],"summary":"초감정은 감정을 어떻게 바라보고 다뤄야 한다고 생각하는지에 대한 감정과 신념이다. 같은 행동도 한쪽에게는 관심과 참여, 다른 쪽에게는 위협이나 거절로 읽힐 수 있다.","points":[{"title":"표현과 회피의 뜻이 엇갈릴 때","text":"타일러는 적극적인 감정 표현을 연결로 여기지만 노아는 갈등을 위험으로 느껴 물러난다. 그 후퇴가 타일러에게는 무관심으로, 타일러의 추궁은 노아에게는 공격으로 해석되어 서로 원치 않던 반응을 부른다.","page":95},{"title":"회피형–수긍형","text":"교사 면담 사례에서 회피형 남편은 갈등이 폭발할까 두려워하고, 아내는 혼자 대면해야 한다는 불안을 느낀다. 어린 시절의 경험과 구체적인 지지 요청을 나눈 뒤 남편이 동행하기로 하면서, 성향을 완전히 바꾸지 않고도 협력할 수 있었다.","page":97},{"title":"수긍형–발끈형","text":"아이가 뱀에 물린 사례에서 논리적인 확률과 해결책은 격한 걱정을 충분히 인정하지 못했다. 아내가 먼저 원한 것은 위험 평가보다 자신의 공포를 함께 알아주는 반응이었다. 상대를 빨리 진정시키는 것과 상대를 타당화하는 것은 다르다.","page":101},{"title":"발끈형–회피형의 큰 간격","text":"장난스러운 도발로 반응을 끌어내려는 행동이 회피형에게는 모욕과 위협으로 느껴질 수 있다. 저자들은 이 조합의 어려움을 강조하지만 스타일 불일치를 자동적인 실패 판정으로 삼지는 않는다. 상대가 편안하게 참여할 수 있는 방식부터 협의해야 한다.","page":104}],"practice":["상대가 말이 없을 때 내가 붙이는 의미와, 상대가 실제로 경험하는 의미를 비교한다.","걱정을 들었을 때 해결책을 제시하기 전에 상대가 가장 두려워하는 점을 확인한다."],"keywords":["초감정","감정 언어","부조화","타당화","성장배경"]},{"id":"conflict-09","title":"싸움의 3단계와 성급한 설득","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[106,112],"summary":"책은 전형적인 싸움을 문제 꺼내기, 설득, 타협 시도의 세 단계로 설명한다. 대부분의 커플은 서로를 충분히 이해하기 전에 설득으로 넘어가며, 회피형은 설득 자체를 건너뛰기도 한다.","points":[{"title":"의도와 영향은 일치하지 않는다","text":"연구 참여자들이 자신의 싸움 영상을 평가했을 때, 상처를 준 순간의 의도와 상대가 받은 영향이 일치하지 않았다고 저자들은 보고한다. 자신은 이해받고 싶었더라도 상대에게는 공격으로 닿을 수 있으므로 선한 의도만으로 결과를 설명할 수 없다.","page":106},{"title":"스타일마다 다른 지름길","text":"회피형은 설득을 소모적이라고 보고 차이를 인정한 채 종료하려 한다. 발끈형은 문제 설명보다 반박과 설득부터 시작한다. 수긍형은 단계적으로 접근하지만 해결을 빨리 찾으려다 내면 탐색을 짧게 끝내기 쉽다.","page":107},{"title":"돈에 대한 이야기 속에 놓친 정보","text":"저축을 원하는 사람에게는 불안정했던 가정경제가, 현재의 경험을 즐기려는 사람에게는 돈만 모으다 세상을 떠난 친척의 기억이 중요하다. 월별 예산을 합의하더라도 이런 의미를 서로 알지 못하면 합의가 지켜지지 않아 같은 논쟁으로 돌아갈 수 있다.","page":108},{"title":"이해를 먼저 놓기","text":"설득 전 단계는 상대의 논리를 반박할 재료를 모으는 시간이 아니다. 그 입장이 어떤 감정·경험·꿈과 연결되는지 알아보고, 상대가 충분히 이해받았다고 느끼는지 확인하는 시간이다.","page":112}],"practice":["반복되는 논쟁에서 우리가 이해에서 설득으로 급히 넘어가는 문장을 찾아본다.","서로의 입장을 정확히 요약할 수 있을 때까지 대안을 내놓는 일을 잠시 미룬다."],"keywords":["싸움의 3단계","설득","타협","의도와 영향","이해"]},{"id":"conflict-10","title":"갈등 문화는 배웠으며, 반응 범위는 넓힐 수 있다","part":"2장 · 왜 우리는 비슷한 패턴으로 싸울까?","pages":[113,121],"summary":"같은 가족 경험도 사람마다 다르게 남아 서로 다른 싸움의 규칙이 된다. 목적은 성격을 다른 사람처럼 바꾸는 것이 아니라, 익숙한 반응 외에 관계를 돕는 선택을 더 만드는 것이다.","points":[{"title":"서로 다른 규칙의 게임","text":"타일러에게 큰 감정은 금방 지나가는 일상이었지만 노아에게는 부모의 심한 싸움과 예고 없는 부재로 연결되었다. 두 사람은 똑같은 관계 안에서 갈등에 대한 다른 규칙을 적용하고 있었다. 배경을 알아야 행동을 덜 악의적으로 해석할 수 있다.","page":113},{"title":"배경은 운명 공식이 아니다","text":"소리를 지르는 부모 밑에서 자란 사람이 그대로 발끈형이 될 수도, 반대로 갈등을 회피할 수도 있다. 신경계와 경험의 조합이 개인마다 다르므로 상대의 가족사를 알았다는 이유로 성향을 단정할 수 없다.","page":114},{"title":"반응 전의 작은 간격","text":"책은 발끈하는 사람에게 숨을 고르고 표현의 영향을 생각하는 연습을 제안한다. 새로운 방식이 반복되면 기존 스타일에 유연성이 생기지만 스트레스가 높을 때는 익숙한 반응으로 돌아가기 쉬우므로 지속적인 연습이 필요하다.","page":115},{"title":"저자 부부의 사례가 보여주는 연민","text":"가족 방문 후 줄리가 비난을 쏟아냈을 때, 존은 과장된 유머로 공격–방어의 연쇄를 끊은 적이 있다. 사례의 핵심은 특정 농담을 복제하는 데 있지 않고 현재 반응에 과거 상처와 하루의 잔재가 섞일 수 있음을 이해하며 수습할 틈을 만드는 것이다.","page":118}],"practice":["어릴 때 화난 사람에게 어떻게 반응해야 안전했는지, 그 규칙이 현재도 필요한지 각자 적는다.","과열될 때 쓸 나만의 멈춤 행동과 상대가 받아들이기 쉬운 다시 시작 문장을 정한다."],"keywords":["갈등 문화","학습","반응 습관","유연성","연민"]},{"id":"conflict-11","title":"사소한 연결 시도와 정서통장","part":"3장 · 도대체 무슨 일로 싸우는 걸까?","pages":[123,135],"summary":"피자, 식물, 와인 같은 표면 주제 밑에는 인정·안정·수용의 문제가 있을 수 있다. 평소 서로의 작은 연결 시도에 어떻게 응답했는지가 갈등 때 쓸 수 있는 호의와 신뢰를 만든다.","points":[{"title":"싸움의 소재와 의미","text":"식은 피자는 돌봄 노동을 알아주길 바라는 마음, 식물의 위치는 새 집과 책임에 대한 불안, 와인 고르기는 가족에게 파트너를 인정받을지 모른다는 두려움을 드러내는 사례로 제시된다. 같은 물건도 각자의 맥락에 따라 다른 의미를 갖는다.","page":126},{"title":"세 가지 응답","text":"연결 시도는 재미있는 것을 보여주기, 혼잣말, 한숨처럼 작을 수 있다. 응답은 관심을 주며 다가가기, 무시하며 떨어지기, 짜증이나 공격으로 원수가 되는 반응으로 나뉜다. 바쁜 하루에는 악의 없이 놓치는 시도가 누적되기도 한다.","page":130},{"title":"86%와 33%의 맥락","text":"저자들은 아파트형 실험실 참가 커플을 6년 후 추적했을 때 안정적이고 행복한 커플은 연결 시도의 86%에 다가가는 반응을 보였고, 어려움을 겪은 커플은 33%였다고 설명한다. 작은 반응의 축적을 '정서통장'에 비유하며, 갈등 때 선의로 해석할 자원이 된다고 본다.","page":132},{"title":"의도적으로 확보하는 관심","text":"서로 함께 있을 시간을 기대하는지, 상대의 이번 주 스트레스와 기쁨을 아는지, 고마움을 느끼는지가 잔고를 살피는 단서다. 연결 가능한 순간이 저절로 겹치기를 기다리기보다 전화기를 내려놓고 짧은 신호에 반응하는 노력이 필요하다.","page":133}],"practice":["오늘 상대가 보낸 작은 연결 시도와 나의 응답 한 가지를 저녁에 되돌아본다.","상대의 이번 주 걱정과 기쁜 일을 각각 하나씩 새로 알아본다."],"keywords":["연결 시도","다가가기","정서통장","인정","일상적 관심"]},{"id":"conflict-12","title":"해결 가능한 문제·영속적 문제·교착상태","part":"3장 · 도대체 무슨 일로 싸우는 걸까?","pages":[136,147],"summary":"문제의 소재만으로 해결 가능성을 구별할 수 없다. 차이가 어디에 뿌리내렸는지, 같은 대화를 반복할 때 관계가 어떻게 변하는지를 보아야 한다.","points":[{"title":"같은 소재도 다른 유형이 된다","text":"차를 사거나 설거지를 정리하는 문제는 실행 방법을 정하면 끝나는 상황일 수도, 주도권·계층 배경·인정·생활철학을 건드리는 영속적 문제일 수도 있다. 유형을 구별하면 일회성 해결책을 찾을지 장기적인 관리와 이해를 목표로 삼을지 분명해진다.","page":138},{"title":"감정의 무시가 격화를 만든다","text":"상대가 속상하다고 말할 때 별일 아니라며 축소하면 감정을 더 크게 표현해야 관심을 얻을 수 있는 흐름이 생긴다. 그 뒤 홍수와 네 가지 독이 나타나기 쉬워진다. 어느 유형의 문제이든 감정을 듣고 존중하는 과정이 필요하다.","page":140},{"title":"교착상태의 표지","text":"같은 쟁점을 논의해도 진전이 없고, 대화 뒤에 더 상처받으며, 조금 양보하면 모든 것을 빼앗길 것처럼 느껴진다. 애정과 유머도 줄어든다. 이는 특정 문제의 막힘이며, 모든 교류를 지배하는 적대적 스타일과 구별된다.","page":142},{"title":"이직·이사 사례의 두 꿈","text":"연봉과 생활비 계산으로 다투던 부부에게 한쪽의 핵심은 돌봄 이후 자신의 공동체와 삶을 되찾는 일, 다른 쪽은 능력을 인정받고 성장하는 일이다. 돈만 논의해서는 이 갈등을 이해할 수 없다. 두 꿈이 드러나야 이사 여부와 별개로 가능한 방식을 찾을 수 있다.","page":144}],"practice":["반복 주제를 적고 '이 일을 정하면 끝나는가, 나의 정체성이나 삶의 방식과 계속 연결되는가'를 묻는다.","지난 세 번의 대화 후 이해와 상처 중 무엇이 늘었는지 점검한다."],"keywords":["해결 가능","영속적 갈등","교착상태","꿈","감정 무시"]},{"id":"conflict-13","title":"관계 유지의 한계와 세 가지 관계의 폭탄","part":"3장 · 도대체 무슨 일로 싸우는 걸까?","pages":[148,153],"summary":"이 책의 목표는 모든 관계를 무조건 유지시키는 것이 아니다. 저자들은 폭력적 지배, 중독 문제를 다루려는 의지의 부재, 양립할 수 없는 출산 의향처럼 일반적인 타협으로 처리할 수 없는 경계를 설명한다.","points":[{"title":"꿈을 이해한 뒤 이별할 수도 있다","text":"한 사람은 부모가 되길 간절히 바라고 다른 사람은 아이 없는 삶을 원한다면, 상대를 충분히 이해해도 두 꿈을 동시에 실현할 수 없는 경우가 있다. 존의 첫 결혼 사례는 이를 누구의 결함이나 사랑의 부족으로만 설명할 수 없음을 보여준다.","page":149},{"title":"폭력의 구별과 도움의 필요","text":"책은 갈등이 통제 불능으로 커지며 일어나는 상황적 폭력과, 한쪽이 상대를 지배·고립시키고 책임을 피해자에게 전가하는 인격적 폭력을 구분한다. 전자의 개선 사례도 전문적인 훈련·지원 연구에서 나온 것이다. 이 구별을 폭력을 사소하게 여기거나 혼자 참아야 한다는 뜻으로 읽어서는 안 된다.","page":150},{"title":"지배·학대를 협상 문제로 바꾸지 않기","text":"저자들은 소유욕과 고립을 동반하거나 예측 불가능한 폭력으로 상대를 지배하는 관계에 대해 일반적인 커플 갈등 기술의 범위를 벗어난다고 경고하며 도움을 통해 벗어날 것을 권한다. 상대의 감정을 이해하는 일은 학대의 책임을 나누는 일이 아니다.","page":151},{"title":"중독 자체와 치료 거부는 다르다","text":"책은 중독을 도덕적 실패로 취급하지 않고 회복과 파트너 지원이 가능하다고 본다. 다만 문제가 관계를 해치는데도 인정하거나 도움을 구하려 하지 않으면 진전이 어려워진다. 회복 중에는 예전의 연결 방식이 재발과 연관될 수 있어 새로운 함께하기도 필요하다고 설명한다.","page":152}],"practice":["내가 고민하는 것이 의견 차이인지, 안전·지배·치료 거부의 문제인지 구분한다.","출산처럼 양분할 수 없는 결정은 상대를 설득할 전략보다 각자의 실제 의향을 명확히 듣는 시간부터 갖는다."],"keywords":["관계의 폭탄","학대","상황적 폭력","중독","출산 의향","관계의 한계"]},{"id":"conflict-14","title":"갈등에 관한 열 가지 오해 바로잡기","part":"3장 · 도대체 무슨 일로 싸우는 걸까?","pages":[154,163],"summary":"갈등은 모두 해결되어야 하고, 한 사람이 옳으며, 감정 없이 논리적으로 말해야 한다는 생각이 오히려 대화를 막을 수 있다. 욕구를 인정하면서 그것을 분명히 표현하고, 서로가 상처를 줄 수 있다는 책임을 받아들이는 것이 출발점이다.","points":[{"title":"오해 1~3: 한 번 해결하면 끝·갈등은 부적합·모든 갈등은 해결 대상","text":"책은 이 세 믿음을 영속적 차이라는 관점으로 교정한다. 특정 싸움 하나의 해법을 찾는 것만으로 모든 충돌이 끝나지 않으며, 갈등이 있다고 함께할 수 없는 것도 아니다. 많은 문제에는 지속적인 대화와 관리가 필요하다.","page":155},{"title":"오해 4~6: 한 사람만 맞다·남성은 이성/여성은 감정·논리만이 최선","text":"두 사람의 경험은 서로 다르면서도 각각 이해할 만한 근거를 가진다. 감정을 성별로 배분하거나 논리의 방해물로 취급하면 필요한 정보를 놓친다. 책은 감정과 생각을 모두 듣는 과정이 문제 이해에 유용하다고 강조한다.","page":156},{"title":"오해 7~8: 부정적 감정은 나쁘다·상처는 본인이 허락한 것","text":"분노는 생길 수 있지만 표현에 책임이 따른다. 상대가 받은 상처를 그 사람의 선택이나 과민함으로 돌리면 내 말의 영향을 회피하게 된다. 가까운 사람끼리도 상처를 줄 수 있다는 현실을 인정해야 회복을 시작할 수 있다.","page":157},{"title":"오해 9~10: 완벽한 자기 사랑부터·욕구는 정당화해야만 인정","text":"자기회의와 오래된 취약성이 남아 있어도 사랑하는 관계를 맺을 수 있다. 욕구를 느끼기 위해 상대가 얼마나 잘못했는지 입증할 필요도 없다. 다만 파트너가 마음을 읽어주길 기대하지 말고 자신의 필요를 알아차려 표현할 책임이 있다.","page":159}],"practice":["내가 믿는 갈등 규칙 하나가 어떤 오해와 닮았는지 표시한다.","욕구를 말할 때 앞부분의 상대 잘못 목록을 지우고 감정·상황·부탁만 남겨 본다."],"keywords":["갈등 오해","논리와 감정","욕구","책임","자기 사랑"]},{"id":"conflict-15","title":"폭탄 던지기: 첫 3분과 거친 시작의 세 특징","part":"4장 · 갑자기 거칠게 시작하기","pages":[167,186],"summary":"대화의 첫머리는 이후의 궤적에 큰 영향을 준다. 화가 난 상황을 말하는 대신 상대의 성격을 공격하고, 쌓아둔 불만을 한꺼번에 던질 때 방어적인 반응이 커진다.","points":[{"title":"하이킹 사례: 모험과 안전","text":"절벽에서 계속 가려는 아내와 돌아가려는 남편은 각각 모험에 함께해 줄 동반자와 생명·가족의 안전을 중요하게 여긴다. 그러나 겁쟁이·무모한 사람이라는 식으로 상대를 규정하면서, 두 가치에 관해 이야기할 기회를 잃고 이혼까지 들먹이는 싸움에 이른다.","page":168},{"title":"첫 3분은 개입할 기회","text":"저자들은 관찰한 갈등 대화에서 첫 3분의 긍정·부정 패턴이 이후 흐름과 장기 관계 결과를 강하게 예측했다고 설명한다. 본문은 96%를 제시하고 속성 가이드는 97%로 적고 있어 여기서는 숫자를 확정적인 예후로 사용하지 않는다. 핵심은 시작하는 방식을 바꿀 수 있다는 점이다.","page":172},{"title":"세 가지 거친 시작","text":"첫째는 구체적 행동의 불편 대신 인격을 비난하는 것, 둘째는 내 감정 대신 상대가 늘 또는 한 번도 무엇을 하지 않는다고 평가하는 것, 셋째는 한 쟁점에 오래 묵힌 다른 문제까지 몰아넣는 것이다. 이 '설거지감 몰아넣기'는 요구를 분명하게 만들지 않고 부담만 키운다.","page":177},{"title":"왜 폭탄이 터지는가","text":"과도한 스트레스, 표현하지 않아 쌓인 원망, 이전 요청이 외면된 경험, 다른 말하기 방식을 배우지 못한 점이 거친 시작을 부추긴다. 이런 배경을 이해하되 폭발을 유일한 표현 방식으로 유지하지 말고 작은 불만일 때 한 가지씩 다루어야 한다.","page":180}],"practice":["최근 거친 첫마디에서 인격 평가, '항상/한 번도', 다른 문제 끌어오기를 각각 표시한다.","다음 대화에서 다룰 문제 하나와 나중에 따로 다룰 문제를 분리한다."],"keywords":["첫 3분","거칠게 시작하기","폭탄 던지기","설거지감 몰아넣기","원망"]},{"id":"conflict-16","title":"부드럽게 시작하기와 듣는 사람의 역할","part":"4장 · 갑자기 거칠게 시작하기","pages":[186,201],"summary":"부드러운 시작은 불만을 축소하는 일이 아니라 내 감정과 구체적 필요를 더 정확하게 말하는 일이다. 듣는 사람도 반박을 미루고 상대의 경험을 확인해 주는 역할을 맡는다.","points":[{"title":"감정·상황·긍정적 욕구","text":"기본 구조는 지금 느끼는 감정, 그 감정과 연결된 구체적 상황, 상대가 해줄 수 있는 긍정적인 행동을 밝히는 것이다. 상대가 하지 말아야 할 잘못을 나열하기보다 도움이 될 행동을 요청한다. 한 번의 대화에서는 한 상황에 집중한다.","page":186},{"title":"사례의 다시 시작","text":"크리스틴은 남편을 겁쟁이로 부르는 대신 함께 전망을 보고 모험을 나누고 싶어 실망했다고 표현하는 연습을 한다. 스티브에게도 자신의 두려움과 책임감이 있다. 두 사람의 차이는 남지만, 인격 비난이 줄면서 상대의 사연에 호기심을 가질 공간이 열린다.","page":190},{"title":"듣기–질문–요약–타당화","text":"듣는 사람은 자신의 관점을 잠시 미루고, 이해를 위한 질문을 하며, 감정·문제·욕구를 상대가 맞다고 할 만큼 요약한다. 마지막에는 그 입장에서 왜 그렇게 느꼈는지 인정한다. 타당화는 모든 사실 판단이나 해결책에 동의한다는 뜻이 아니다.","page":192},{"title":"역할을 바꾸고 실수를 수습하기","text":"먼저 말한 사람이 충분히 이해받았다고 확인하면 역할을 바꾼다. 말이 다시 날카로워지면 잘못 표현했다는 점을 인정하고 다시 말할 기회를 청한다. 상대도 방어적으로 반격하는 대신 어떤 표현이 부담스러운지 알려주어 대화를 되돌릴 수 있다.","page":197},{"title":"호감과 존중을 다시 구체화하기","text":"책의 연습에서는 상대에게서 좋게 보는 특성 세 가지를 골라 전달한다. 차이 때문에 싸우면서도 바로 그 차이가 사랑하게 된 이유였음을 상기하는 과정이다. 칭찬을 믿기 어려운 사람은 상대의 거짓말이라고 단정하기보다 자신이 왜 그 말을 받아들이기 어려운지 설명한다.","page":195}],"practice":["'이 상황에서 나는 ___을 느낀다. 도움이 되려면 ___을 해주면 좋겠다' 형태로 실제 불만 하나를 다시 쓴다.","말하는 사람과 듣는 사람을 정하고, 상대가 요약을 확인한 뒤에만 역할을 바꿔본다."],"keywords":["부드럽게 시작하기","긍정적 욕구","경청","타당화","요약"]},{"id":"conflict-17","title":"스타일에 맞춰 부드러운 첫마디 연습하기","part":"4장 · 갑자기 거칠게 시작하기","pages":[202,209],"summary":"세 스타일 모두 같은 기본 원칙을 사용하지만 표현 강도와 흔한 실수는 다르다. 솔직함을 유지하면서도 상대를 평가하지 않는 말하기를 여러 상황에서 연습할 수 있다.","points":[{"title":"발끈형의 과제","text":"강한 감정 자체를 없애기보다 무책임한 사람이라는 식의 총체적 비난을 빼야 한다. 공과금이 늦어 답답하다면 처리 시점과 방법을 구체적으로 요청한다. 상대가 감정 강도에 민감하다면 말의 내용과 전달 강도 모두 살핀다.","page":202},{"title":"회피형의 과제","text":"눈치만 주거나 속으로 걱정하면서 넘어가지 말고 자신의 감정과 필요한 행동을 실제로 말한다. 부드러운 시작이란 아무 요구도 하지 않는 것이 아니다. 불편함을 인정하면서도 상대가 응답할 수 있을 만큼 분명하게 부탁한다.","page":202},{"title":"수긍형의 과제","text":"겉으로 차분해도 결과를 상대 탓으로 단정하면 비난이 된다. 문제의 영향을 설명하고 이전 합의를 확인하되, 곧장 상대를 고치거나 해결책을 강요하는 대신 함께 조정할 여지를 둔다.","page":203},{"title":"감정 어휘와 욕구 어휘","text":"책은 감정과 욕구를 구별해 고르는 표를 제공한다. 외로움·걱정·상처 같은 감정과, 귀 기울여 듣기·다정한 인사·휴식 시간·분담 같은 행동 요청은 서로 다르다. 표현이 막힐 때 표나 메모를 참고해도 되며, '그냥 솔직한 성격'이라는 말이 경멸의 면허가 되지는 않는다.","page":204}],"practice":["차 손상, 자녀 숙제, 직장 스트레스처럼 책의 연습과 비슷한 일상 상황 하나를 정해 거친 문장과 부드러운 문장을 비교한다.","내가 자주 느끼는 감정 세 개와 상대에게 부탁할 수 있는 구체적 행동 세 개를 따로 적는다."],"keywords":["스타일별 연습","감정 어휘","욕구 표현","솔직함","구체적 요청"]},{"id":"conflict-18","title":"홍수: 몸이 대화를 압도하는 순간","part":"5장 · 공격과 방어","pages":[211,229],"summary":"홍수는 단순히 화가 난 상태를 넘어 몸·감정·인지가 과각성되어 듣고 판단하기 어려워진 상태다. 부드럽게 시작했더라도 대화 중 언제든 나타날 수 있어 자신의 조기 신호를 알아야 한다.","points":[{"title":"싸우기·도망치기·얼어붙기","text":"심장이 빨라지고 몸이 긴장하며 상대의 말이 잘 들어오지 않는 가운데 공격, 방어 또는 담쌓기로 반응할 수 있다. 밖으로 소리치는 모습과 안으로 입을 닫는 모습 모두 홍수일 수 있어 겉의 침착함만으로 판단하지 않는다.","page":213},{"title":"기술을 못 쓰는 상태","text":"저자들은 홍수 때 정보 처리와 공감이 어려워져 배운 갈등 기술을 활용하기 힘들다고 설명한다. 계속 논쟁하면 해법이 나오는 대신 후회할 말과 행동이 늘 수 있다. 누가 더 의지가 강한지 겨루는 문제가 아니라 대화를 잠시 멈춰야 할 신호다.","page":226},{"title":"심각한 배신과 사소한 일 모두에서","text":"외도 후 신뢰를 잃은 스탠·수전과, 아픈 날 아이의 등교 분담으로 다툰 노라·로비는 문제의 규모가 다르지만 비난→방어→홍수→수습 실패의 비슷한 흐름을 보인다. 상대의 사과가 잠깐 나와도 과열된 상태에서는 이를 받아들이기 어렵다.","page":216},{"title":"개인별 생리 알람","text":"턱을 악물기, 호흡이 짧아지기, 얼굴이 달아오르기, 배의 울렁거림, 근육 긴장, 사고가 흐려짐 같은 신호를 살핀다. 책은 심박 상승도 단서로 제시하지만 한 숫자로 모든 사람의 상태를 진단하려는 것이 아니다. 각자가 반복적으로 경험하는 신호를 미리 알아두는 편이 유용하다.","page":227}],"practice":["가장 최근 과열된 대화에서 처음 나타난 신체 신호 세 가지를 적는다.","큰 목소리, 침묵, 눈물 가운데 무엇이 나에게 홍수와 연결되는지 파트너에게 알려준다."],"keywords":["홍수","과각성","생리적 신호","공격과 방어","담쌓기"]},{"id":"conflict-19","title":"진정의 휴식: 멈추고, 떨어지고, 다시 돌아오기","part":"5장 · 공격과 방어","pages":[230,237],"summary":"휴식은 대화를 버리는 행동이 아니라 더 상처 주지 않고 돌아오기 위한 조치다. 멈추는 이유와 복귀 시점을 밝히고, 쉬는 동안 반박을 준비하지 않는 것이 핵심이다.","points":[{"title":"떠나기 전에 알리기","text":"감정을 감당하기 어려워 잠시 쉬어야 한다고 설명하고 어디에 갈지, 언제 돌아와 이야기할지 알려준다. 파트너가 홍수에 빠졌다고 진단하듯 지적하기보다 두 사람이 쉬었다가 이어가자고 제안한다. 한쪽에게 필요하다면 다른 쪽도 휴식을 존중한다.","page":230},{"title":"최소 20분과 복귀 약속","text":"책은 자기진정에 최소 20분을 확보하고, 일반적인 갈등 휴식을 24시간 넘겨 무기한 미루지 말라고 권한다. 시간이 되어도 진정되지 않았다면 돌아와 상태를 알리고 재개 시간을 다시 정한다. 이 수치는 책의 실천 지침이며 안전이 위협받는 상황에서 복귀를 강요하는 규칙은 아니다.","page":231},{"title":"몸뿐 아니라 생각도 잠시 떼기","text":"혼자 산책하거나 음악을 듣고, 호흡·명상·취미·단순한 일을 하며 각성을 낮춘다. 억울함을 반복해서 곱씹거나 결정타가 될 반박을 설계하면 신체적으로 떨어져 있어도 싸움은 계속된다. 휴식 직전 마지막 공격을 던지는 것도 피한다.","page":231},{"title":"목표를 지금의 대화로 좁히기","text":"돌아온 뒤의 목표는 영속적 문제를 단번에 없애거나 이기는 일이 아니다. 이번 대화를 충분히 긍정적이고 협력적으로 만들고 서로의 경험을 듣는 것이다. 문제 전체의 해결 부담을 내려놓으면 작은 진전을 알아볼 수 있다.","page":235}],"practice":["서로 기억하기 쉬운 휴식 문장 또는 수신호와 기본 복귀 절차를 정한다.","진정에 실제로 도움이 되는 활동 두 개와 오히려 흥분을 유지하는 행동 두 개를 기록한다."],"keywords":["자기진정","20분","휴식","복귀 약속","지금 이 순간"]},{"id":"conflict-20","title":"욕구를 명시하고 몸의 느낌으로 감정을 찾기","part":"5장 · 공격과 방어","pages":[238,245],"summary":"상대가 나를 오래 알아왔더라도 표현하지 않은 욕구까지 읽을 수는 없다. 감정과 욕구가 막연할 때는 어휘나 카드, 몸의 반응을 단서로 자신의 경험을 더 정확히 찾는다.","points":[{"title":"마음을 읽으라는 기대","text":"내가 필요한 것을 말하지 않았는데도 상대가 알고 일부러 외면한다고 여기면 원망이 쌓인다. 부탁은 거절될 가능성을 드러내어 취약하지만, 침묵한 채 기대하는 방식은 상대에게 협력할 정보를 주지 못한다.","page":238},{"title":"뮤지션 부부의 전환","text":"어린 시절부터 알고 지낸 아내가 자신의 필요를 알아야 한다고 믿던 남편은 따뜻한 귀가 인사, 성적 목적이 아닌 애정의 접촉, 둘만의 낭만적 시간을 원했다. 구체적인 문구를 골라 말하자 아내도 그것을 원한다고 답하며 '나만 배려한다'는 싸움의 틀이 달라졌다.","page":240},{"title":"행동 요청의 크기는 다양하다","text":"잠들기 전 포옹처럼 작고 명확한 욕구도, 함께 모험하거나 변화한 자신에 대해 이야기하고 싶은 더 넓은 욕구도 있다. 중요한 것은 상대의 잘못을 입증하는 일과 욕구를 밝히는 일을 분리하고, 무엇을 바라는지 말로 공유하는 것이다.","page":242},{"title":"포커싱에 바탕을 둔 감정 확인 연습","text":"책은 좋아하는 대상을 싫어한다고 말해 본 뒤 진짜 마음을 말하며 몸의 긴장과 이완 차이를 느끼는 연습을 소개한다. 목적은 거짓말 탐지가 아니라 자기 경험에 맞는 단어를 찾는 데 몸의 느낌을 활용하는 것이다. 슬픔·외로움·불안·답답함 중 어느 표현이 더 맞는지 천천히 확인한다.","page":243}],"practice":["'상대가 알아야 한다'고 여기는 욕구 한 가지를 실제 행동 요청으로 바꾼다.","감정 단어 몇 개를 차례로 생각하며 몸에서 어떤 반응이 생기는지 관찰하고, 가장 맞는 표현을 고른다."],"keywords":["욕구 표현","독심술 기대","포커싱","신체 감각","취약성"]},{"id":"conflict-21","title":"싸우는 중의 화해 시도와 여섯 가지 표현 범주","part":"5장 · 공격과 방어","pages":[246,263],"summary":"화해는 싸움이 다 끝난 뒤에만 하는 일이 아니다. 대화의 부정성을 낮추는 말이나 행동을 보내고 받아들이는 과정이며, 효과는 평소의 우정과 연결에도 달려 있다.","points":[{"title":"여러 형태의 수습","text":"직접 사과, 다르게 말해 보기, 상대의 타당한 점 인정, 함께 웃을 수 있는 익살, 안심을 주는 손길처럼 대화가 더 나빠지는 것을 막는 행동이 화해 시도가 된다. 정해진 문구의 유창함보다 상대가 이를 실제 연결 시도로 받아들일 수 있는지가 중요하다.","page":246},{"title":"보내기와 받기는 한 쌍","text":"자신은 사과했다고 생각해도 상대가 듣지 못하거나 믿을 수 없으면 수습이 이어지지 않는다. 책은 평소 연결 시도에 응답하며 서로를 잘 알아온 커플이 서툰 화해도 받아들이기 쉽다고 설명한다. 거친 불평 속에 숨은 함께 있고 싶다는 요청도 알아볼 수 있다.","page":247},{"title":"여섯 가지 범주","text":"체크리스트는 현재 느낌 알리기, 사과하기, 상대 말에 호응하기, 진정의 도움 요청하기, 행동을 멈추기, 상대와 관계를 인정하기로 나뉜다. 각 범주의 목적을 이해하면 긴 문장 목록을 외우지 않고도 지금 필요한 수습을 선택할 수 있다.","page":256},{"title":"도구를 보고 말해도 된다","text":"양육으로 다투던 커플은 체크리스트를 보며 방어적인 느낌을 알리고 표현을 바꿔 달라고 요청했다. 이후 냉장고에 붙여 두어 멈춤과 재개 장소로 사용했다. 즉석에서 완벽한 말을 떠올려야 한다는 부담을 줄이는 사례다.","page":257},{"title":"의견 불일치 속의 같은 편","text":"외도 사례에서도 한 번의 대화가 배신을 해결하지는 못하지만, 방어 대신 고통을 들어주고 신뢰 회복에 시간이 필요하다고 인정하는 변화가 생긴다. 상대에게 동의하는 것과 관계의 편에 서는 것은 동일하지 않다.","page":251}],"practice":["여섯 범주마다 나에게 자연스러운 짧은 문장을 하나씩 만든다.","상대가 잘 받아들이는 수습과 싫어하는 수습을 미리 나눈다. 특히 접촉이나 농담은 상대의 경험을 확인한다."],"keywords":["화해 시도","수습","체크리스트","우정","호응","인정"]},{"id":"conflict-22","title":"수박 겉핥기: 더 깊이 들어가야 한다는 신호","part":"6장 · 피상적인 문제를 반복하기","pages":[265,275],"summary":"실행 가능한 약속을 해도 같은 싸움으로 돌아온다면, 표면 문제 아래 중요한 의미가 남아 있을 수 있다. 교착상태를 알아차리고 해결을 잠시 멈추는 것이 탐구의 출발점이다.","points":[{"title":"선물의 가격만 정해서는 풀리지 않는 문제","text":"마뉴엘과 샤나에는 선물할 날과 가격 한도를 정했지만 믹서기 선물을 둘러싸고 다시 상처받는다. 한쪽은 사랑받는 표시를 원하고 다른 쪽은 재정적 책임을 다했다고 여긴다. 행동 규칙을 정하기 전 '선물이 의미하는 것'을 알아볼 필요가 있었다.","page":266},{"title":"영속적 문제와 교착은 같지 않다","text":"영속적 차이는 평생 다시 논의할 수 있지만 존중과 온정이 유지될 수도 있다. 교착에서는 대화 후 더 기분이 나빠지고, 거절당한 느낌이 들며, 어떤 해결이나 타협도 진전되지 않는다. 반복 여부만이 아니라 반복의 정서적 결과가 중요하다.","page":271},{"title":"부정적 감정의 밀물","text":"갈등이 쌓이면 중립적인 말이나 행동도 의도적인 무시로 읽는다. 상대가 답하지 않은 이유를 못 들었기 때문이라고 생각하지 못하고 늘 나를 무시한다고 해석하는 식이다. 이런 상태에서 표면적인 해결만 계속 밀어붙이면 고착을 더한다.","page":272},{"title":"다른 탐구 신호","text":"사소한 일에 뜻밖의 큰 반응이 나오기, 합의가 반복해서 무너지기, 다른 주제에 같은 문제가 끼어들기, 반대로 특정 문제를 철저히 피하기도 단서다. 배관공 비용을 물은 사례에서는 귀가 인사 없이 할 일을 확인한 말이 과거의 비난 경험을 건드렸다.","page":273}],"practice":["잘 지켜지지 않았던 합의 한 가지를 골라 실행 의지뿐 아니라 그 합의가 놓친 의미를 묻는다.","과한 반응이라고 단정하기 전에 이 상황의 어떤 부분이 특히 중요한지 천천히 확인한다."],"keywords":["수박 겉핥기","교착상태","부정적 감정의 밀물","표면 문제","숨은 의미"]},{"id":"conflict-23","title":"갈등 속의 꿈을 듣는 여섯 가지 질문","part":"6장 · 피상적인 문제를 반복하기","pages":[275,284],"summary":"꿈 대화는 상대를 설득하지 않고 신념·과거·감정·이상·목적을 알아보는 구조화된 대화다. 한 사람이 충분히 말할 수 있게 듣는 역할을 분리한 뒤 교대한다.","points":[{"title":"통나무집 갈등의 두 내력","text":"줄리에게 숲은 어린 시절의 비난과 불안에서 벗어나 자신을 회복하던 공간이었다. 존에게 재산을 늘리는 일은 난민이었던 부모가 모든 것을 두고 떠난 기억과 충돌했다. 집을 살지 말지만 다투던 두 사람은 이 사연을 나누면서 서로의 입장을 연민으로 보게 되었다.","page":276},{"title":"꿈을 알아낸 뒤 열린 선택","text":"부부는 집을 구입하되 일정 시간이 지난 뒤 유지 여부를 다시 검토하는 방식 등을 합의한다. 핵심은 원래 원하던 행동을 그대로 관철하는 것이 아니라 서로에게 그 행동이 왜 중요한지를 먼저 이해했다는 점이다.","page":279},{"title":"여섯 탐구 축","text":"듣는 사람은 쟁점과 연결된 신념·가치, 어린 시절이나 배경, 그 입장이 중요한 이유, 현재 감정, 제약이 없다면 바라는 이상적 모습, 더 깊은 목표나 목적을 차례로 묻는다. 질문의 표현보다 이 여섯 영역을 충분히 탐색하는 목적이 중요하다.","page":282},{"title":"화자와 청자의 역할","text":"화자는 상대의 결함을 설명하지 말고 자기 입장과 욕구의 의미를 솔직히 말한다. 청자는 판단·반박·해결을 미루고 친구처럼 듣는다. 한 질문에 충분한 답이 나오기 전에 서두르지 않으며, 모두 마친 뒤 역할을 바꾼다.","page":282},{"title":"배경으로 답을 추정하지 않기","text":"비슷한 문화나 어린 시절을 가진 두 사람도 전혀 다른 신념을 만들 수 있다. 상대의 경험을 이미 알고 있다고 생각해 질문을 건너뛰지 않는다. 이 대화의 목표는 문제의 즉시 해결이 아니라 교착에서 대화로 옮겨가는 것이다.","page":284}],"practice":["반복 갈등 하나를 정하고 여섯 탐구 축을 메모한 뒤 한 사람씩 충분히 말한다.","듣는 동안 반박 대신 상대의 표현을 기록하고, 빠진 의미가 있는지 확인한다."],"keywords":["갈등 속의 꿈","여섯 질문","화자","청자","가치관","내력"]},{"id":"conflict-24","title":"선물 사례: 비슷한 상처에서 다른 사랑의 의미로","part":"6장 · 피상적인 문제를 반복하기","pages":[285,292],"summary":"어려운 성장환경이 같다고 사랑을 주고받는 방식까지 같아지는 것은 아니다. 꿈 대화는 차이를 없애지 않더라도 상대의 행동을 해석하는 틀과 다음 싸움의 결과를 바꾼다.","points":[{"title":"샤나에에게 선물은 소중함의 증거","text":"친척집에서 자랄 때 다른 아이들은 풍성한 선물을 받고 자신은 생활 필수품만 받던 경험이 남았다. 선물을 받고 싶은 바람은 단순한 소비 욕구보다 누군가에게 특별하고 중요한 존재임을 확인하려는 마음과 연결되어 있었다.","page":285},{"title":"마뉴엘에게 선물은 통제의 위험","text":"의지하던 어른과의 관계 단절, 대가를 요구하는 또래의 경험은 누군가 주는 물건을 조종의 신호로 의심하게 했다. 아내의 요구도 이용당할 위험처럼 느껴졌으며, 재정 책임에 대한 걱정과 이 경계심이 뒤섞였다.","page":286},{"title":"충분히 들은 뒤 달라진 재발","text":"후속 대화에서도 선물과 돈을 둘러싼 불만은 다시 나타난다. 그러나 두 사람은 과거 경험이 지금 감정을 건드린다는 것을 말할 수 있고, 작은 초콜릿처럼 사랑의 표시와 재정 부담을 함께 고려하는 합의에 도달한다. 문제의 재등장은 곧 실패가 아니다.","page":287},{"title":"깊은 갈등이 친밀함의 계기가 되는 이유","text":"책은 꿈을 탐구하는 질문이 87%의 경우 교착의 돌파구가 되었다고 보고하며, 뒤의 주에서는 워크숍 후 커플 설문조사에서 얻은 수치라고 밝힌다. 이는 개별 관계의 회복 보장이 아니라 저자들의 참가자 조사 결과다. 갈등은 삶에서 의미·존중·안전이 걸린 지점을 드러내므로 그 의미를 들으면 서로를 더 깊이 알 수 있다.","page":291}],"practice":["상대가 원하는 행동을 '사치·통제·무관심'으로 해석하기 전에 그 행동의 개인적 의미를 묻는다.","핵심 의미를 지키면서 부담은 낮추는 작은 실험을 하나 합의한다."],"keywords":["선물","사랑의 의미","통제","유년기","작은 타협"]},{"id":"conflict-25","title":"잃어버린 꿈을 찾는 기억 탐색과 대화 연습","part":"6장 · 피상적인 문제를 반복하기","pages":[293,309],"summary":"자신에게 중요한 이유를 당장 설명하지 못할 수도 있다. 기억을 탐색할 시간을 갖고, 해결을 서두르지 않으며, 각자의 속도로 이야기를 이어가는 것이 중요하다.","points":[{"title":"모른다는 답도 탐구의 출발","text":"과거의 사진·일기, 이전 관계, 양육자와 또래 관계, 가족의 반복 패턴을 돌아보면 현재의 입장과 이어지는 실마리를 찾을 수 있다. 답을 완성한 뒤 돌아와야 하는 것이 아니라 새로 떠오른 단서를 파트너와 함께 탐색하면 된다.","page":293},{"title":"사례: 퇴직 통보에서 삶의 꿈으로","text":"조지의 갑작스러운 퇴직은 재정 위험과 상의 없는 결정을 낳았지만, 부부는 출장 중심의 생활을 반복하고 싶지 않다는 꿈을 대화의 중심에 놓는다. 가족의 협력으로 새로운 일을 시도한 사례는 갈등 뒤의 삶의 방향을 듣는 중요성을 보여주며, 일방적인 결정을 일반적인 해법으로 권하는 것은 아니다.","page":296},{"title":"영속적 문제의 폭","text":"정리정돈, 자녀 교육, 성적 친밀감, 친인척 거리, 저축과 소비, 가사, 사교, 충실함, 모험, 직업적 야심, 종교, 독립성과 핵심 가치가 모두 탐구 주제가 될 수 있다. 어떤 분야가 정답이라는 목록은 없으며 두 사람의 반복 쟁점에서 시작한다.","page":301},{"title":"스타일별 듣기의 보완","text":"회피형에게는 판단받지 않는 안전감이 필요하고, 수긍형은 해결책을 성급히 내놓지 않도록 주의해야 한다. 발끈형은 질문 중간에 끼어들어 자신의 입장을 제시하려는 충동을 참는 연습이 필요하다. 메모는 듣는 내용에 주의를 묶어두는 도구가 된다.","page":306},{"title":"다른 꿈도 함께 존중할 수 있다","text":"등반과 탐험을 꿈꾸는 줄리와 실내에서 독서·연구를 즐기는 존처럼 인생의 꿈이 반드시 같아야 하는 것은 아니다. 서로의 꿈을 모두 알아본 뒤 실현 방식과 지원 방법을 논의한다. 양립이 어려운 핵심이 드러날 때도 그 사실을 존중한다.","page":308}],"practice":["답이 막히면 시간을 요청하고, 관련된 오래된 경험 한 가지를 떠올려 다시 대화한다.","이번 대화에서 해결안을 내놓고 싶은 충동이 올라오면 메모만 하고 상대의 탐구를 먼저 마친다."],"keywords":["기억 탐색","잃어버린 꿈","영속적 문제","경청 연습","자기성찰"]},{"id":"conflict-26","title":"제로섬: 한 사람이 이기면 관계는 무엇을 잃는가","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[311,324],"summary":"갈등을 승점 경쟁으로 이해하면 한쪽의 만족이 다른 쪽의 손해가 된다. 협력적 관계는 두 사람의 욕구를 함께 결과에 포함하며, 영향력을 주고받을 수 있어야 한다.","points":[{"title":"의견 차이를 승패로 바꾸는 사고","text":"설거지, 캠프 비용, 이사처럼 조정할 수 있는 문제도 누가 양보했는지 점수로만 계산하면 경쟁이 된다. 자신은 논리적이고 상대는 깨우쳐줘야 한다고 생각할수록 상대의 의미 있는 이유를 들을 여지가 좁아진다.","page":312},{"title":"빈스와 제니의 은퇴 꿈","text":"빈스는 배를 타고 세계를 돌고 싶고 제니는 조상의 농장에서 살고 싶어 한다. 오랜 헌신 끝에 이제는 자기 꿈을 지켜야 한다는 마음이 강해 누구도 물러설 수 없다고 느낀다. 두 꿈의 구체적인 모습이 대립한다는 사실만으로 둘 중 하나를 완전히 포기해야 한다고 결론낸 것이 막힘을 키웠다.","page":314},{"title":"연구의 관찰과 해석 구분","text":"책은 20년 추적 연구에서 제로섬 커플의 남편 사망 비율 58%, 협력적 커플의 남편 20%를 제시하고 생리적 스트레스와 연결해 해석한다. 여기서 다루는 것은 저자의 표본 관찰과 설명이며, 갈등 방식 하나가 사망을 직접 일으킨다는 개인별 인과 판정은 아니다.","page":321},{"title":"영향력을 받아들이는 양보","text":"저자들이 말하는 양보는 무조건 굴복하거나 핵심 욕구를 포기하는 것이 아니다. 상대의 감정과 관점을 실제 정보로 받아들여 내 판단을 수정할 여지를 만드는 일이다. 서로에게 영향받을 수 있을수록 둘 다 의사결정에 참여할 수 있다.","page":323}],"practice":["최근 합의를 누가 이겼는지로만 기억하고 있다면 두 사람이 각각 얻고 잃은 것을 함께 적는다.","상대의 설명을 듣고 내 생각을 수정할 수 있는 작은 부분을 찾아 말한다."],"keywords":["제로섬","승패","협력적 이득","영향력","양보"]},{"id":"conflict-27","title":"영향력 공유, 성역할, 보호와 지배의 차이","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[325,333],"summary":"영향력은 관계 바깥의 문화와 권력관계로부터도 영향을 받는다. 상대를 보호한다는 명분이 상대의 목소리를 대신하거나 선택권을 막는 방식이 되지 않도록 살펴야 한다.","points":[{"title":"역할 분담만으로 평등을 다 설명할 수 없다","text":"가사와 육아를 반씩 하더라도 상대의 의견을 듣고 결정권을 공유하는 데 저항할 수 있다. 책은 이성애 관계에서 남성이 영향력을 수용하기 어렵게 만드는 사회화에 특히 주목한다. 집단 연구의 경향을 개인의 본성으로 단정하는 대신 자신의 실제 반응을 살피는 데 활용한다.","page":326},{"title":"보호는 인간성과 꿈을 지켜주는 일","text":"상대에게 무엇을 해야 한다고 지시하는 것보다 어떤 사람이 되고 싶고 어떤 장벽을 겪는지 묻는 것이 보호의 의미에 가깝다. 저자는 인터뷰에서 아내의 전문성이 무시될 때 그 답변을 다시 인정해 준 사례로 존중의 구체적인 형태를 설명한다.","page":329},{"title":"꿈 지원에는 일상 노동도 포함된다","text":"줄리가 등반에 나설 수 있도록 존이 딸의 돌봄과 머리 땋기를 맡고, 사위가 배우자의 휴식을 위해 야간 수유를 맡은 사례가 나온다. 응원한다는 말뿐 아니라 꿈과 건강을 가능하게 하는 시간과 노동을 나누는 행동이 중요하다.","page":331},{"title":"막는 바위가 되면 영향력도 잃는다","text":"제안마다 거절하고 수정 가능성을 닫으면 상대는 함께 의논하기보다 우회하는 방법을 찾게 된다. 영향력을 유지하려면 상대의 생각을 묻고 배울 점을 찾으며, 때로는 상대의 방식도 시험해 보아야 한다.","page":332}],"practice":["최근 공동결정에서 누가 정보를 내고 누가 최종결정을 했는지 살핀다.","상대의 꿈을 지지하기 위해 내가 맡을 수 있는 실제 시간·돌봄·가사 하나를 정한다."],"keywords":["영향력 공유","성역할","보호","지배","의사결정","꿈 지원"]},{"id":"conflict-28","title":"무인도 생존 게임: 정답보다 협력 과정을 관찰하기","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[334,342],"summary":"저자들은 가상의 생존 과제를 통해 상대의 영향력을 받아들이는 모습을 안전하게 연습하게 한다. 서로 다른 해결책 가운데 어느 쪽이 옳은지를 가리는 것보다 두 사람이 어떻게 한 팀으로 결정하는지가 관찰 대상이다.","points":[{"title":"혼자 고른 뒤 함께 고른다","text":"배가 난파되고 구조 시점을 알 수 없는 상황을 가정해, 제시된 24개 물품 가운데 필요한 10개를 각자 선정하고 우선순위를 매긴다. 그다음 서로의 선택 이유를 듣고 공동 목록을 만든다. 생존 지식 시험이 아니라 선택이 다를 때 협상하는 모습을 드러내는 과제다.","page":334},{"title":"결과보다 대화의 질을 평가한다","text":"누가 영향을 주고받았는지, 경쟁하거나 지배하려 했는지, 거절당할 때 삐치거나 말을 닫았는지, 짜증과 즐거움은 어땠는지 돌아본다. 두 사람의 의견이 반영되었는지와 팀처럼 일했는지를 따로 살피므로, 동일한 목록에 도달해도 과정은 다르게 평가될 수 있다.","page":338},{"title":"협력하면 여러 해법이 가능할 수 있다","text":"카약이 바위에 걸렸을 때 저자 부부는 서로 다른 탈출법을 고집하다가 움직이지 못한다. 이 사례의 핵심은 한 사람의 기술이 반드시 정답이었다는 것이 아니라, 방향을 맞췄다면 어느 한 방식도 시도할 수 있었다는 점이다. 상대의 제안을 잠시 따라보는 것은 무능력이나 패배의 표시가 아니다.","page":340}],"practice":["가벼운 공동 과제를 각자 먼저 계획한 뒤 한 가지 공동안으로 합쳐 본다.","과제가 끝난 뒤 결정 내용과 별도로, 내 의견이 바뀐 순간과 상대의 기여를 인정한 순간을 각각 기록한다."],"keywords":["무인도 게임","협력","공동결정","영향력 수용","카약 사례"]},{"id":"conflict-29","title":"베이글 타협법: 작은 핵심과 넓은 유연성","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[343,348],"summary":"타협은 자신에게 가장 중요한 것을 없애는 작업이 아니다. 저자들의 베이글 그림은 지켜야 할 핵심과 조정 가능한 실행 조건을 분리해, 둘의 꿈이 들어갈 공간을 찾게 한다.","points":[{"title":"핵심은 작고 정확하게 적는다","text":"안쪽의 작은 원에는 포기하면 자신의 정체성이나 중요한 가치가 훼손될 최소한의 욕구를 쓴다. 원하는 해결책의 모든 조건을 핵심으로 지정하면 논의할 공간이 사라진다. 바깥쪽의 더 넓은 영역에는 시기·장소·방식·횟수·기간·비용처럼 유연하게 바꿀 수 있는 조건을 적는다.","page":343},{"title":"요구의 배경을 먼저 인정한다","text":"빈스와 제니의 은퇴 갈등은 바다와 농장 중 하나를 고르는 문제처럼 보인다. 그러나 그 밑에는 경제적 부양과 보이지 않는 가사·돌봄의 기여가 인정받지 못했다는 감정이 있다. 기여와 꿈을 이해하지 않은 채 비용과 일정만 절충하면 자신이 또 희생했다는 느낌이 남을 수 있다.","page":344},{"title":"같이 살고 싶은 꿈을 세부 조건으로 확장한다","text":"두 사람 모두 자신의 꿈속에 배우자를 포함하고 있었다. 제니에게는 가족의 뿌리와 농장 생활이, 빈스에게는 모험과 자유가 중요했다. 집을 팔지 빌려줄지, 무엇을 먼저 할지, 여행을 언제 얼마나 할지 등을 바깥 영역으로 옮기면서 양쪽이 살아 있는 선택지가 늘어났다.","page":346},{"title":"완벽한 최종안보다 가능한 첫 안을 만든다","text":"두 사람은 먼저 농장에서 지내는 동안 빈스가 항해를 배우고, 이후 배를 마련해 여행하는 방향을 찾는다. 모든 실무 조건이 즉시 해결된 것은 아니지만 상대의 꿈이 존중된다는 감각과 다음 단계가 생겼다. 타협은 대체로 일부를 얻고 일부를 조정하며, 이후 경험에 따라 다시 살펴볼 수 있다.","page":347}],"practice":["각자 두 원을 그리고 안쪽에는 최소한의 핵심 욕구를, 바깥쪽에는 바꿀 수 있는 조건을 적는다.","서로의 핵심이 왜 중요한지 설명한 뒤 순서·기간·비용 중 바꿔볼 조건을 찾아 임시 합의안을 만든다."],"keywords":["베이글 타협법","핵심 욕구","유연성","은퇴 갈등","가치","임시 합의"]},{"id":"conflict-30","title":"타협 사례와 한계: 같은 장소·같은 방식만이 답은 아니다","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[349,355],"summary":"사립학교 선택과 두 나라 사이의 가족생활 사례는 핵심 욕구를 알면 실행 형태를 다양하게 설계할 수 있음을 보여준다. 동시에 아이를 가질지처럼 양쪽의 핵심이 실제로 양립하기 어려운 문제도 인정한다.","points":[{"title":"학교 선택에서 교육과 공동체를 함께 지킨다","text":"아버지는 자신이 가르치는 학교의 교육 기회를 아들에게 주고 싶어 하고, 어머니는 공교육과 이웃 공동체의 가치를 중시한다. 아들의 의사도 듣고 학교 선택과 방과 후 지역 활동을 조합하며 일정 기간 뒤 재검토하는 안을 만든다. 하나의 제도 선택에 모든 가치를 묶지 않은 점이 중요하다.","page":349},{"title":"두 나라의 책임을 기존 틀 밖에서 조정한다","text":"나이지리아의 가족에 대한 책임과 제네바에서 자폐가 있는 자녀에게 필요한 교육이 충돌한 부부는, 한 나라에만 영구 거주한다는 전제를 바꾼다. 교육 지원과 이동 기간을 설계해 두 지역을 오가는 생활을 찾는다. 이 사례는 비용이나 돌봄 여건이 다른 모든 가족에게 같은 해법을 권하는 것이 아니라, 핵심을 보존하며 구조를 바꾸는 사고를 보여준다.","page":351},{"title":"양립할 수 없는 핵심도 있다","text":"부모가 되고 싶은 사람과 원하지 않는 사람처럼 어느 쪽도 포기할 수 없는 욕구가 충돌할 수 있다. 그런 차이가 확인되면 관계를 끝내는 선택이 반드시 실패나 의지 부족은 아니다. 모든 갈등을 억지로 중간값으로 만들 수 있다는 기대를 내려놓아야 한다.","page":354},{"title":"자발적인 희생과 지속적인 자기 소거를 구분한다","text":"상대의 학업이나 꿈을 위해 기회를 미루는 선택 자체가 잘못은 아니다. 자신의 의사와 가치에 따라 선택하고 관계 안에서 돌봄이 돌아오는지가 중요하다. 한 사람만 계속 핵심을 포기하도록 요구하는 구조를 타협이라 부르면 안 된다.","page":355}],"practice":["현재의 양자택일에서 분리해 설계할 수 있는 요소가 무엇인지 적는다.","시험 기간과 재검토 날짜를 정하되, 어느 쪽의 핵심이 실제로 사라지는 합의인지 먼저 확인한다."],"keywords":["학교 선택","문화 간 관계","가족 책임","양립 불가능","희생","재검토"]},{"id":"conflict-31","title":"타협을 받쳐주는 신뢰와 헌신","part":"7장 · 서로 이기려고 벼랑 끝까지 가기","pages":[356,361],"summary":"협상 기술이 있어도 상대가 자신의 이익을 고려하지 않는다고 느끼면 양보는 위험하게 보인다. 신뢰와 헌신은 영향력을 주고받는 토대이며, 관계 바깥의 이상적인 대안과 비교하는 습관도 이 토대를 약하게 할 수 있다.","points":[{"title":"상대가 내 이익도 고려한다는 믿음","text":"신뢰는 상대가 자신의 이익만 추구하는지, 내 관점과 욕구도 같은 무게로 다루는지를 통해 형성된다. 상대의 꿈에 관심을 보이고 제안을 듣고 때로는 행동을 바꾸는 경험이 쌓일 때 타협은 안전한 공동작업이 된다.","page":356},{"title":"현재 관계를 낮추고 대안을 이상화하는 흐름","text":"책은 불만을 파트너와 다루기보다 다른 사람에게만 이야기하고, 현재 관계의 장점은 깎아내리면서 다른 사람이나 다른 삶을 완벽하게 상상하는 흐름을 경계한다. 외부 도움을 받는 행위 자체가 잘못이라는 뜻이 아니라, 관계 안에서 문제를 다룰 의지가 약해지는 양상을 살피라는 것이다.","page":358},{"title":"원 그림에서 실행 가능한 합의로","text":"각자의 핵심과 유연한 부분을 나눈 뒤, 공통 감정과 목표를 확인하고 서로 받아들일 수 있는 임시안을 만든다. 실행 조건을 적고 추후 조정할 수 있도록 하면 대화의 성과가 막연한 다짐으로 끝나는 것을 줄일 수 있다. 상대에게서 영향을 받을 준비는 이 전 과정에 필요하다.","page":360}],"practice":["최근 상대가 나의 이익을 고려해 준 행동과 내가 상대에게 그렇게 한 행동을 하나씩 찾는다.","합의문에 각자의 핵심 욕구, 이번에 시도할 행동, 다시 이야기할 시점을 함께 적는다."],"keywords":["신뢰","헌신","대안 이상화","협상","공동 목표"]},{"id":"conflict-32","title":"끝난 싸움이 계속되는 이유: 실무 해결과 상처 회복","part":"8장 · 예전 일을 끊임없이 들춰내기","pages":[363,377],"summary":"일정이나 분담을 바꾸고 사과했다고 해서 싸움에서 받은 상처까지 정리되는 것은 아니다. 해결되지 않은 감정은 같은 싸움을 다시 불러오거나 전혀 다른 문제에 과도한 반응으로 나타날 수 있다.","points":[{"title":"부모 역할과 일의 가치가 동시에 다친 사례","text":"몰리와 셀레나는 팬데믹 중 재택근무와 자녀 돌봄을 나누다가 충돌한다. 한 사람은 자신의 프리랜서 일이 덜 중요한 것으로 취급받았고, 다른 사람은 출산하지 않았다는 이유로 부모로서의 사랑을 부정당했다고 느꼈다. 시간표를 고치고 짧게 사과한 뒤에도 깊은 의미의 상처가 남아 다음 갈등을 키웠다.","page":364},{"title":"싸움에 관한 싸움이 시작된다","text":"누가 먼저 무엇을 말했는지 따지는 동안 원래의 문제보다 상대가 자신을 어떻게 대했는지가 더 중요한 쟁점이 된다. 대화할수록 더 나빠지고, 그 주제를 피하며 친밀감이 줄거나, 다른 문제에서도 감정이 과도하게 커지는 현상은 회복이 미완료되었다는 신호일 수 있다.","page":370},{"title":"미완료 경험과 기억의 성격","text":"저자는 끝내지 못한 과제가 오래 남는 현상을 설명하는 자이가르닉 효과를 관계의 미해결 싸움과 연결한다. 또한 감정과 관점에 따라 기억이 다르게 구성될 수 있다고 설명한다. 이 설명은 어느 쪽도 정확히 기억할 수 없으니 책임을 묻지 말라는 뜻이 아니라, 기억 대결만으로 상처를 다루기 어렵다는 취지로 읽어야 한다.","page":373},{"title":"덮어두기와 수습하기는 다르다","text":"좋은 일이 생기거나 시간이 흐른다고 모든 상처가 자동으로 사라지지는 않는다. 싸움 당시 각자가 무엇을 경험하고 무엇에 반응했는지 차분하게 다시 다루어야 한다. 수습의 목표는 당시의 승자를 정하는 것이 아니라, 그 사건이 관계에 남긴 의미를 이해하고 다음 대응을 바꾸는 것이다.","page":376}],"practice":["계속 떠오르는 싸움 하나를 골라 실무상 해결된 부분과 아직 아픈 부분을 따로 적는다.","최근 사소한 문제에 반응이 커졌다면, 그 문제와 연결된 이전 상처가 남아 있는지 살펴본다."],"keywords":["싸움 후 회복","미해결 감정","자이가르닉 효과","기억","부모 정체성","일의 가치"]},{"id":"conflict-33","title":"두 개의 현실과 촉발제: 의도를 단정하지 않고 듣기","part":"8장 · 예전 일을 끊임없이 들춰내기","pages":[378,383],"summary":"같은 사건이라도 각자의 감각·해석·과거 경험에 따라 다른 현실로 남는다. 지속적인 취약성이 자극된 순간을 이해하면 상대의 반응을 나쁜 성격으로만 설명하던 시각을 넓힐 수 있다.","points":[{"title":"관점의 타당화는 사실 판정의 포기가 아니다","text":"자신이 무엇을 보고 듣고 어떻게 받아들였는지 말하고, 상대가 왜 그렇게 경험했을지 이해한다. 서로의 경험이 이해될 수 있다는 말과 모든 해석이 객관적으로 참이라는 말은 다르다. 모욕이나 해로운 행동에 대한 구체적인 책임을 지우지 않으면서 두 관점을 들을 수 있다.","page":378},{"title":"상대 마음 대신 내 지각을 설명한다","text":"상대가 일부러 무시했거나 화를 냈다고 단정하면 반박과 방어가 시작된다. 자신에게 그렇게 보였고 그 때문에 어떤 감정이 생겼다고 말하면 상대가 자기 경험을 보탤 공간이 생긴다. 표현을 바꾸는 목적은 비난을 공손하게 포장하는 것이 아니라, 모르는 의도를 아는 것처럼 취급하지 않는 데 있다.","page":379},{"title":"촉발제는 현재보다 오래된 취약성과 닿아 있다","text":"책은 과거 가족 경험이나 이전 관계에서 형성된 상처가 현재 대화에서 다시 자극되는 현상을 다룬다. 줄리의 꿈과 어머니와의 경험이 부부의 갈등으로 번진 일화도 과거의 정서가 현재 파트너에게 투사될 수 있음을 보여준다. 배경을 이해하는 것은 현재 행동에 대한 면책과 다르다.","page":380},{"title":"사과를 앞당기기보다 무엇이 아팠는지 알아본다","text":"충분히 이해하기 전에 서둘러 사과하면 상대는 대화를 끝내려는 말로 들을 수 있다. 감정, 각자의 현실, 촉발제, 자신의 책임, 다음번 계획의 순서로 사건을 다룰 때 사과의 대상과 의미가 구체화된다.","page":382}],"practice":["한 사건을 '내가 본 것·들은 것·생각한 것·느낀 것'으로 나누어 적는다.","상대의 설명에서 동의 여부와 별개로 이해할 수 있는 부분을 한 문장으로 되짚는다."],"keywords":["주관적 현실","타당화","촉발제","지속적인 취약성","의도 추정","사과"]},{"id":"conflict-34","title":"싸움 수습의 다섯 단계: 감정에서 다음 행동까지","part":"8장 · 예전 일을 끊임없이 들춰내기","pages":[384,403],"summary":"저자 부부가 대학생 딸에 대한 걱정으로 크게 다툰 사례는 회복 절차의 각 단계를 보여준다. 진정한 뒤 한 사건을 차례대로 돌아보며 이해와 책임, 실행 계획을 연결한다.","points":[{"title":"준비: 무대에 다시 들어가지 않고 관객처럼 돌아본다","text":"둘 다 진정한 상태에서 사건을 어느 정도 거리를 두고 살펴볼 수 있어야 한다. 싸움을 그대로 재연하거나 당장 끝내야 한다는 압박 속에서 시작하면 같은 반응을 반복하기 쉽다. 저자들은 딸의 건강과 사회생활을 두고 싸운 일을 다음날 차분히 돌아보며 이 절차를 사용한다.","page":384},{"title":"1단계: 감정의 이름부터 말한다","text":"당시 느낀 외로움·불안·모욕감·방어적인 마음 등을 말하되, 이 단계에서는 상대의 잘못을 설명하는 논증을 붙이지 않는다. '느꼈다'는 형식을 취하더라도 상대의 성격이나 의도를 규정하면 감정 표현이 아니라 비난이 된다.","page":387},{"title":"2단계: 각자의 현실을 듣고 요약한다","text":"한 사람이 자신이 경험한 사건을 설명하면 다른 사람은 들은 뜻을 짧게 되짚고 이해할 수 있는 부분을 인정한다. 곧바로 자기 이야기를 덧붙이거나 반박하지 않으며, 충분히 이해받았는지 확인하고 역할을 바꾼다. 둘 다 이해받았다는 느낌을 얻은 뒤 다음으로 간다.","page":389},{"title":"3단계: 촉발된 오래된 경험을 연결한다","text":"줄리는 어린 시절 아플 때 돌봄을 받지 못했던 기억 때문에 딸의 건강을 걱정했고, 존은 따돌림 뒤 대학에서 소속감을 얻은 기억 때문에 딸의 새로운 사회생활을 지키려 했다. 같은 딸을 돌보려는 마음이 서로 다른 위험에 반응했던 것이다. 과거 이야기는 현재 반응이 강했던 이유를 설명하는 자료가 된다.","page":393},{"title":"4단계: 내 기여를 구체적으로 인정한다","text":"그날의 스트레스나 외로움 같은 배경을 살피되 그것을 잘못의 변명으로 삼지 않는다. 말을 듣지 않은 부분, 상대를 낮춰 말한 부분, 필요한 것을 표현하지 않고 쌓아둔 부분처럼 자신이 한 행동을 인정하고 구체적으로 사과한다. 두 사람의 책임을 억지로 같은 비율로 맞추는 과정은 아니다.","page":398},{"title":"5단계: 다음에 다르게 할 행동을 정한다","text":"각자 자신과 상대가 다음번 대화에서 할 수 있는 변화를 제안한다. 걱정을 말할 때 듣기를 원하는지 해결을 원하는지 알려주거나, 성급히 판단하기 전에 질문하는 식으로 실제 행동을 정한다. 원래 문제를 완전히 해결하는 것보다 같은 문제를 더 안전하게 이야기할 방법을 만드는 데 초점을 둔다.","page":401}],"practice":["진정한 뒤 한 사건만 골라 감정→현실→촉발제→책임→계획의 순서로 번갈아 이야기한다.","마지막에는 내가 할 행동 하나와 상대에게 요청할 행동 하나를 구체적으로 적는다."],"keywords":["5단계 수습","감정 명명","상호 이해","책임 인정","구체적 사과","건설적 계획"]},{"id":"conflict-35","title":"회복 대화의 주의점과 자기학습의 범위","part":"8장 · 예전 일을 끊임없이 들춰내기","pages":[404,414],"summary":"수습 절차는 빠른 화해를 강요하는 도구가 아니다. 순서를 지키고 충분히 들으며, 심한 신뢰 손상이나 반복적 배신에는 한 번의 대화보다 더 넓은 도움이 필요함을 구분한다.","points":[{"title":"오래된 싸움도 의미를 새로 이해할 수 있다","text":"몰리와 셀레나는 뒤늦게 사건을 돌아보며 경력 포기에 대한 가족 기억과, 사랑을 증명하라는 이유로 직업을 포기하도록 요구받았던 이전 관계의 경험을 공유한다. 이런 배경을 들은 뒤에야 상대의 상처가 선명해지고 사과도 구체화된다. 시간이 지났다는 이유만으로 다루지 못할 사건이 되는 것은 아니다.","page":404},{"title":"흥분이 돌아오면 멈추고 절차를 지킨다","text":"사건을 관찰할 거리가 없어지고 다시 싸우기 시작하면 진정하는 시간이 필요하다. 감정을 빨리 정리하라고 압박하거나 단계 일부를 건너뛰면 충분히 이해받지 못한 채 사과와 해결로 밀려갈 수 있다. 한 번에 여러 사건을 꺼내는 것 역시 초점을 흐린다.","page":408},{"title":"촉발제 설명을 다른 고발로 바꾸지 않는다","text":"이 절차에서 촉발제는 주로 현재 관계 이전의 취약한 경험을 탐색하는 단계다. 현재 파트너가 전에 했던 잘못을 줄줄이 열거하는 단계로 바꾸면 새로운 싸움이 된다. 현재 관계의 다른 미해결 사건은 따로 시간을 정해 다루는 편이 절차의 목적에 맞는다.","page":410},{"title":"사과의 수용과 용서를 강요하지 않는다","text":"사과를 아직 받아들이기 어렵다면 무엇이 더 이해되거나 다뤄져야 하는지 설명할 수 있다. 사과했다는 이유만으로 상대에게 즉시 감정을 바꾸라고 요구해서는 안 된다. 타당화는 동의가 아니라 경험을 이해하는 일이라는 원칙도 계속 적용된다.","page":411},{"title":"신뢰의 큰 손상은 별도의 작업이 필요하다","text":"매우 필요했던 순간에 상대가 없었던 애착 손상, 반복되는 외도나 숨겨진 재정 문제 등은 한 사건을 되짚는 연습만으로 충분하지 않을 수 있다. 책은 이런 경우 전문적 지원과 더 넓은 신뢰 회복의 필요성을 구분한다. 기본 수습 절차를 모든 상황의 완결된 치료로 제시하지 않는다.","page":412}],"practice":["수습을 시작하기 전 지금 한 사건을 차분히 다룰 수 있는지 확인하고, 어려우면 돌아올 시점을 정한다.","사과가 충분하지 않을 때는 즉시 용서하겠다고 약속하기보다 아직 이해받지 못한 부분을 구체적으로 말한다."],"keywords":["회복 대화","늦은 수습","사과 수용","애착 손상","반복적 배신","전문적 지원"]},{"id":"conflict-36","title":"결론과 속성 가이드: 다섯 전환을 일상에서 연결하기","part":"결론 · 건강한 갈등 관리를 위한 속성 가이드","pages":[415,450],"summary":"메건과 압둘의 사례는 오랫동안 함께 살았어도 서로의 삶과 상처를 새로 배울 수 있음을 보여준다. 마지막 가이드는 부드러운 시작, 진정과 수습, 꿈 탐색, 타협, 싸움 후 회복을 상황에 맞게 다시 꺼내 쓰도록 정리한다.","points":[{"title":"표면의 일과 그 밑의 삶을 함께 본다","text":"케냐에서 만나 미국으로 이주한 메건과 압둘에게 서류 업무나 집안일의 갈등은 경력의 상실, 인종차별 경험, 문화적 성역할, 연결받고 싶은 욕구와 얽혀 있었다. 오랫동안 함께 지냈어도 상대가 겪은 일을 다 알고 있지는 않았다. 두 사람은 반복되는 사건의 의미를 더 오래 듣고 서로에게 질문하면서 대화의 방향을 바꾼다.","page":415},{"title":"변화는 직선으로 진행되지 않는다","text":"한 번 잘 이야기했다고 오래된 패턴이 사라지는 것은 아니다. 자녀 돌봄이나 피로 때문에 대화가 끊기면 다시 돌아오고, 격해지면 진정하고, 막히면 꿈을 묻는 과정을 반복한다. 파트너도 시간이 지나며 바뀌므로 과거에 얻은 이해를 최신 정보로 여기지 말고 계속 알아가는 태도가 필요하다.","page":421},{"title":"다섯 가지 전환을 현재 막힌 지점에 적용한다","text":"시작부터 공격적이라면 자신이 느끼는 감정과 필요한 행동을 분명히 말한다. 대화 중 감정의 홍수에 빠지면 진정과 작은 수습을 우선한다. 같은 문제만 맴돌면 꿈과 가치의 의미를 묻고, 이기고 지는 대결이 되면 핵심과 유연한 조건을 나눠 타협한다. 끝난 싸움의 상처가 남았다면 다섯 단계 수습으로 되돌아간다.","page":423},{"title":"유사성 가정으로 자신과 상대의 이중 기준을 줄인다","text":"속성 가이드는 자신에게 이성적임이나 선의 같은 장점을 부여할 때 상대에게도 그 성질이 있는 부분을 찾고, 상대에게 고집 같은 단점을 붙일 때 자신에게도 그런 부분이 있는지 보라고 권한다. 이는 차이를 지우는 것이 아니라 자신에게는 상황을, 상대에게는 나쁜 성격을 적용하는 습관을 완화하는 연습이다.","page":434},{"title":"가이드는 생략용이 아니라 재사용용이다","text":"끝부분은 긍정적 욕구를 담은 시작, 휴식과 복귀, 꿈을 묻는 질문, 베이글 도식, 감정·현실·촉발제·책임·계획의 수습 절차를 다시 제시한다. 실제로 막힌 단계에서 본문의 설명과 사례로 돌아가 볼 수 있다. 완벽한 타협이나 영구적인 무갈등 상태보다 이해와 존중을 반복해서 회복하는 것이 책의 실천 방향이다.","page":426}],"practice":["이번 갈등에서 막힌 지점이 시작·홍수·반복·승패·잔여 상처 중 어디인지 먼저 정하고 해당 도구 하나를 사용한다.","오늘 상대에게 붙인 성격 평가 하나를 골라 나에게도 그런 면이 있는지, 상대에게도 내가 인정하는 장점이 있는지 각각 찾아본다."],"keywords":["다섯 전환","문화 차이","인종차별","지속적인 탐색","유사성 가정","속성 가이드"]}],"notes":["페이지는 책에 인쇄된 쪽수가 아니라 PDF의 1부터 시작하는 물리적 페이지다. 본문의 인쇄 쪽수는 대체로 이 값에 2를 더하면 된다.","원문을 대체하는 전재가 아닌 주제별 의역·해설이다. 실천 항목은 원문의 개입법을 바탕으로 편집한 적용 과제이며, 사례 대화와 긴 체크리스트는 그대로 복제하지 않았다.","연구 수치와 인과 설명은 저자들이 책에서 제시한 주장으로 구분했다. 표본·관찰 조건에 따른 결과를 개별 커플의 예후나 보편 법칙으로 단정하지 않는다.","스캔 OCR의 오탈자, 필기·밑줄 겹침과 표의 읽기 순서 오류가 있어 문맥으로 확실한 내용만 정리했다. 학대·반복적 배신에 관한 부분에는 책이 제시한 자기학습의 한계도 포함했다.","표지·감수의 글·본문·결론·속성 가이드·감사의 글·주·판권을 포함해 PDF 1–466쪽을 검토했다. 감사의 글(451–458쪽)과 참고문헌·판권(459–466쪽)은 독립 실천 장으로 부풀리지 않고 출처 확인에 활용했다.","본문과 속성 가이드의 대화 시작 예측 수치가 각각 96%와 97%로 달라 관련 항목에서 차이를 밝혔다. 제6장 87% 수치는 464쪽 주에서 워크숍 후 커플 설문조사 값으로 설명된다. 원논문의 방법론·재현성·현재 학계 평가는 별도로 검증하지 않았다."]},{"order":20,"category":"사랑의 표현 · 이해와 돌봄","id":"love","title":"5가지 사랑의 언어","author":"게리 채프먼","subtitle":"상대가 사랑을 알아듣는 방식으로 표현하기","description":"사랑하는 마음이 있어도 상대가 사랑받는다고 느끼지 못하는 이유를 다섯 가지 표현 방식으로 살펴본다. 인정하는 말, 함께하는 시간, 선물, 봉사, 스킨십의 구체적 차이와 발견 방법을 배우고, 연애 감정 이후의 선택·갈등·관계 회복·부록의 검사까지 연결한다. 이 정리는 제공된 한국어판 전체를 토대로 상담 사례의 교훈을 재서술했으며, 저자의 기독교적 해석과 효과에 대한 주장을 구분해 읽도록 구성했다.","pages":256,"color":"rose","chapters":[{"id":"love-01","title":"책의 출발점과 읽는 관점","part":"서문과 전체 지도","pages":[2,16],"summary":"이 책은 결혼 생활에서 사랑을 지속하는 구체적인 표현 기술을 제안한다. 장기간의 상담 경험과 기독교적 사랑의 이해를 바탕으로 쓰였으며, 핵심 분류는 관계를 관찰하고 대화하기 위한 틀로 읽을 수 있다.","points":[{"title":"감정만으로 함께 사는 기술이 완성되지는 않는다","text":"역자 서문은 좋은 사람들이 사랑해서 결혼하더라도 함께 사는 데에는 별도의 기술이 필요하다고 설명한다. 무조건 더 열심히 애쓰는 대신 어떤 행동이 상대에게 사랑으로 전달되는지 알아보는 것이 책 전체의 과제다."},{"title":"세 가지 기본 전제","text":"서문은 연애의 강렬한 감정이 일시적이라는 점, 사람마다 사랑을 경험하는 방식이 다르다는 점, 상대가 이해하는 방식으로 사랑을 표현해야 한다는 점을 중심 전제로 제시한다. 이후의 다섯 언어와 실천법은 이 전제 위에 놓여 있다."},{"title":"다섯 언어와 그 안의 다양한 표현","text":"분류는 인정하는 말, 함께하는 시간, 선물, 봉사, 스킨십이다. 하나의 언어 안에도 선호하는 구체적 표현이 여럿 있으므로 같은 범주를 골랐다고 서로의 필요가 같다고 단정하지 않는다."},{"title":"저술의 근거와 종교적 배경","text":"저자는 오랜 부부 상담에서 얻은 통찰과 사례를 소개한다. 앞부분의 성경 인용과 후반부의 신앙적 실천은 장식이 아니라 그의 사랑관을 이루는 토대다. 사례의 성공담이나 판매 성과를 모든 부부에게 효과를 보장하는 실험적 증명으로 바꾸어 읽지는 않는다."},{"title":"전체의 흐름","text":"먼저 결혼 후 사랑이 식는 경험과 정서적 필요를 설명하고, 다음으로 다섯 언어와 자기 발견을 다룬다. 이어 사랑을 선택하는 문제와 어려운 관계의 회복을 검토하고, FAQ와 부부용 설문·비교표로 마무리한다."}],"practice":["편집 적용: 현재 관계에서 바꾸고 싶은 상황을 하나 정하고, 자신의 의도와 상대의 실제 반응을 따로 적어 본다.","편집 적용: 다섯 범주를 성격의 고정된 이름표보다 대화를 시작할 가설로 사용한다."],"keywords":["서문","표현 기술","다섯 언어","상담 경험","기독교적 사랑"]},{"id":"love-02","title":"결혼 후 사랑이 사라진다는 질문","part":"1부 · 사랑의 정서적 기반","pages":[19,26],"summary":"사랑을 표현하는 사람과 사랑을 느끼는 사람이 엇갈릴 수 있다. 저자는 이 엇갈림을 서로 다른 모국어를 사용하는 상황에 빗대어 설명한다.","points":[{"title":"반복되는 관계 문제의 질문","text":"비행기에서 만난 남성은 여러 번의 결혼에서 애정이 줄어든 과정을 이야기한다. 저자는 그 사례를 통해 연애 때의 확신이나 사회적 능력만으로 결혼 후 친밀함이 유지되지는 않는다는 질문을 연다."},{"title":"표현의 진실성과 전달의 효과","text":"진심으로 칭찬하고 사랑한다고 말해도 상대는 집안일을 나누는 행동을 기다리고 있을 수 있다. 보내는 사람이 충분히 표현했다고 느끼는 사실과 받는 사람이 사랑을 느끼는 사실은 다르다는 것이 핵심이다."},{"title":"모국어의 비유","text":"자신에게 익숙한 방식은 자연스럽게 나오지만 상대에게 낯선 방식일 수 있다. 외국어를 배우듯 상대의 표현 체계를 배우려면 관찰과 연습이 필요하며, 자신에게 편한 방식만 반복하는 것으로는 부족하다고 설명한다."},{"title":"제1의 사랑의 언어","text":"책에서 제1의 언어는 특히 깊이 사랑받는 느낌을 주는 방식이다. 저자는 부부의 주된 언어가 서로 다른 경우를 자주 보았다고 말하며, 그 차이를 알아차리는 일이 갈등의 의미를 새롭게 해석하도록 돕는다고 본다."},{"title":"방법 목록보다 수신자의 반응","text":"많은 사랑 표현 아이디어를 알아도 자신이 좋아하는 몇 가지만 선택하면 상대에게 닿지 않을 수 있다. 다섯 범주는 수많은 구체적 행동을 정리하는 틀이며, 실제로 어떤 행동이 의미 있는지는 상대에게 확인해야 한다."}],"practice":["편집 적용: 최근 자신이 사랑이라고 생각해 한 행동 세 가지와 상대가 실제로 기뻐한 행동 세 가지를 비교한다.","편집 적용: 상대의 불만을 반박하기 전에 그 말이 가리키는 구체적인 필요를 질문한다."],"keywords":["결혼 후 사랑","모국어","전달","진심","제1의 언어"]},{"id":"love-03","title":"사랑의 탱크와 정서적 필요","part":"1부 · 사랑의 정서적 기반","pages":[27,34],"summary":"사랑의 탱크는 사랑받고 소중히 여겨진다는 내적 감각을 설명하는 비유다. 저자는 이 정서적 필요가 성인과 결혼 생활에서도 계속되며 물질적 풍요만으로 충족되지 않는다고 본다.","points":[{"title":"사랑이라는 말의 범위 좁히기","text":"사랑이라는 말은 취향, 애정, 희생, 때로는 해로운 행동의 정당화에까지 쓰인다. 이 책은 그 모든 뜻을 정의하기보다 관계 속에서 소속감과 소중함을 느끼게 하는 정서적 사랑에 초점을 맞춘다."},{"title":"탱크는 측정 장치가 아닌 비유","text":"저자는 로스 캠벨의 정서 탱크 비유를 받아들인다. 충분한 애정을 경험하면 정서적 여유가 생기고 결핍을 느끼면 고통이 커진다는 설명이다. 이후 0부터 10까지 점검하는 방법도 주관적 경험을 대화로 표현하는 도구이지 객관적 진단 수치가 아니다."},{"title":"주는 것과 느끼는 것의 차이","text":"부모나 배우자가 물질적 필요를 충실히 채워도 상대는 정서적으로 외로울 수 있다. 책의 청소년 사례 역시 공급자가 사랑한다고 믿는 사실만으로 수신자의 사랑 경험을 확인할 수 없다는 교훈을 전한다."},{"title":"성인이 되어도 남는 친밀함의 욕구","text":"집이나 자동차, 안정된 생활은 배우자에게 중요한 존재라는 느낌을 자동으로 대신하지 못한다. 저자는 결혼의 친밀함을 각자의 정체성을 없애는 융합보다 서로의 삶에 깊이 참여하는 관계로 설명한다."},{"title":"갈등을 다룰 수 있는 분위기","text":"책의 가설은 정서적으로 사랑받는 느낌이 부부가 차이를 논의하는 데 도움이 된다는 것이다. 거친 말이나 탈선을 모두 단일한 사랑 결핍으로 환원하기보다 저자가 사례를 해석하는 핵심 틀임을 구분할 필요가 있다."}],"practice":["편집 적용: 생활에 필요한 지원과 정서적으로 힘이 되었던 순간을 별도 목록으로 적는다.","편집 적용: 오늘 관계에서 느낀 충족감을 숫자로 표현한 뒤 그 숫자를 정한 구체적 경험을 함께 설명한다."],"keywords":["사랑의 탱크","정서적 욕구","소속감","친밀함","안정"]},{"id":"love-04","title":"사랑에 빠진 감정 이후의 사랑","part":"1부 · 사랑의 정서적 기반","pages":[35,46],"summary":"강렬한 연애 감정은 상대의 결점을 보지 못하게 하고 그것이 영원하리라는 기대를 만들 수 있다. 저자는 그 감정이 잦아든 뒤 이성과 의지로 상대의 유익을 선택하는 사랑을 제안한다.","points":[{"title":"몰입과 이상화","text":"사랑에 빠지면 상대를 중심으로 생각하고 서로의 차이나 현실적 어려움을 작게 느끼기 쉽다. 책은 짧은 만남 뒤 결혼을 확신하는 사례를 통해 감정의 강도가 상대를 충분히 알았다는 증거와 같지는 않음을 보여 준다."},{"title":"영원한 황홀감이라는 기대","text":"연애 중에는 갈등이 생겨도 사랑으로 쉽게 해결하리라 믿지만 결혼 뒤 생활 습관과 욕구의 차이가 드러난다. 저자는 특정 연구를 인용해 몰입 기간을 평균 약 2년으로 설명한다. 이는 책의 설명이며 모든 관계의 고정된 기한으로 삼을 수는 없다."},{"title":"감정이 줄었다고 끝난 것은 아니다","text":"저자는 불행을 그대로 견디거나 새 상대를 찾는 두 선택 외에 제3의 길을 제시한다. 감정이 고조된 시기를 한 단계로 이해하고, 서로 다른 두 사람이 함께 살아가는 법을 의식적으로 배우는 길이다."},{"title":"이성과 감정의 결합","text":"성숙한 사랑은 감정을 버리는 것이 아니라 상대의 유익을 위해 노력하기로 선택하고 그에 맞는 행동을 하는 것이다. 훈련과 인내를 통해 상대가 사랑받는 경험을 하면 정서적 친밀함도 다시 자랄 수 있다고 저자는 주장한다."},{"title":"편안한 충동과 의지적 행동","text":"자연스럽게 하고 싶은 친절과 불편하더라도 가치 때문에 선택하는 친절은 다르다. 책은 후자를 지속 가능한 사랑의 중심으로 삼으며, 앞으로의 다섯 언어를 그 선택을 구체화하는 방법으로 연결한다."}],"practice":["편집 적용: 연애 초기에 보이지 않았던 차이 하나를 적고, 누가 옳은지보다 현재 필요한 협의를 정한다.","편집 적용: 좋은 감정이 생기기를 기다리는 대신 오늘 자발적으로 할 수 있는 작은 배려를 선택한다."],"keywords":["연애 감정","이상화","의지적 사랑","선택","현실"]},{"id":"love-05","title":"인정하는 말: 칭찬과 격려","part":"2부 · 다섯 사랑의 언어","pages":[51,58],"summary":"상대의 수고와 강점을 구체적으로 알아주는 말은 사랑을 전하는 한 방식이다. 격려는 내가 원하는 모습으로 상대를 몰아가는 것이 아니라 상대가 소중히 여기는 가능성을 지지하는 일이다.","points":[{"title":"구체적인 인정","text":"칭찬과 감사는 대단한 업적만을 대상으로 하지 않는다. 매일의 돌봄이나 작은 책임 이행을 알아보고 무엇이 고마웠는지 말하면 상대는 자신의 기여가 보이고 존중받는다고 느낄 수 있다."},{"title":"잔소리를 늘리기보다 이미 하는 일 보기","text":"미뤄 둔 페인트칠을 둘러싼 사례에서 저자는 반복되는 비난을 멈추고 다른 실제 기여를 인정하도록 제안한다. 사례의 요점은 칭찬을 이용해 원하는 일을 시키라는 것이 아니라 상대의 수고 전체를 부정하는 관계 패턴을 바꾸는 데 있다."},{"title":"격려는 용기를 돕는 말","text":"도전하고 싶어도 실패 경험 때문에 주저하는 사람에게 믿음과 지지를 말해 줄 수 있다. 글쓰기를 다시 시작한 배우자의 사례는 능력을 구체적으로 인정받는 경험이 행동의 계기가 될 수 있음을 보여 준다."},{"title":"상대의 소원과 나의 요구 구분","text":"내가 원하는 승진이나 활동을 하라고 압박하는 것은 상대에게 비판으로 들릴 수 있다. 격려하려면 먼저 그가 무엇을 하고 싶어 하는지 듣고 그 선택에 어떤 도움이 필요한지 확인해야 한다."},{"title":"말하기도 배우는 기술","text":"비판적 환경에서 성장한 사람에게 긍정적인 표현은 낯설 수 있다. 책은 다른 사람의 좋은 표현을 관찰하고 기록해 자신의 진심과 상황에 맞게 연습하는 방법을 제안한다."}],"practice":["편집 적용: 상대가 실제로 한 일을 하나 고르고 그 행동이 자신에게 준 도움을 한 문장으로 전한다.","편집 적용: 상대가 시도하고 싶은 일을 듣고 격려가 필요한지, 정보나 실제 도움이 필요한지 확인한다."],"keywords":["인정하는 말","칭찬","감사","격려","잠재력"]},{"id":"love-06","title":"인정하는 말: 어조·용서·부탁","part":"2부 · 다섯 사랑의 언어","pages":[58,71],"summary":"같은 말도 어조와 관계의 맥락에 따라 다르게 전달된다. 저자는 부드럽고 정직하게 감정을 말하고, 명령 대신 선택의 여지가 있는 부탁을 하며, 잘못을 인정하고 용서를 구하는 태도를 강조한다.","points":[{"title":"내용과 어조를 함께 살핀다","text":"애정 표현도 냉소적으로 말하면 반대 의미로 들릴 수 있다. 온유한 말은 불편한 감정을 숨기는 것이 아니라 상처나 실망을 상대를 모욕하지 않는 방식으로 전달하는 것이다."},{"title":"이해가 논쟁의 승리보다 먼저","text":"상대가 화가 났을 때는 왜 그렇게 느끼는지 들은 뒤 자신의 동기를 설명한다. 잘못한 부분이 있다면 인정하고 사과하며, 자신의 사건 해석이 절대적으로 옳다는 점만 증명하려 하지 않는 것이 책의 방향이다."},{"title":"과거의 상처와 용서","text":"저자는 용서를 과거를 없던 일로 만드는 감정보다 보복을 반복하지 않기로 하는 의지적 선택으로 설명한다. 잘못의 고백, 사과, 앞으로의 변화가 함께 언급되므로 용서라는 말만으로 상처가 사라졌다고 간주하지 않는다."},{"title":"부탁에는 거절할 자유가 있다","text":"부부는 부모와 아이가 아니라 동등한 성인이다. 원하는 행동을 구체적으로 부탁하면 사랑을 표현할 방향을 알려 주지만, 협박이나 죄책감으로 행동을 강제하면 그 행동을 자발적 사랑이라고 할 수 없다."},{"title":"여러 통로의 인정","text":"직접 말하는 것 외에 편지, 쪽지, 타인 앞에서의 진실한 칭찬, 상대가 없는 자리에서의 존중도 제안된다. 기록된 말은 다시 읽을 수 있으므로 일회성 말과 다른 의미를 가질 수 있다."},{"title":"빌과 베티 조의 엇갈린 반응","text":"부부가 서로의 장점을 기록하고 칭찬하자 남편은 크게 힘을 얻었지만 아내의 외로움은 충분히 줄지 않았다. 이 사례는 인정하는 말이 가치 있어도 모든 사람의 주된 필요를 대신하지는 못한다는 다음 장의 연결점이다."}],"practice":["편집 적용: 최근의 비난 문장을 관찰한 사실, 자신의 감정, 실행 가능한 부탁으로 다시 적는다.","편집 적용: 한 주 동안 감사할 점을 기록하되 칭찬을 받은 즉시 의무적으로 맞칭찬해야 한다고 여기지 않는다."],"keywords":["온유한 말","어조","용서","부탁","명령","동등한 관계"]},{"id":"love-07","title":"함께하는 시간: 집중과 공동 활동","part":"2부 · 다섯 사랑의 언어","pages":[73,80],"summary":"함께하는 시간은 같은 공간에 머무르는 시간보다 서로에게 온전히 관심을 주는 경험이다. 바쁜 일상에서도 관계를 위해 시간을 배정하고 상대가 의미를 느끼는 활동을 함께하는 것이 중요하다.","points":[{"title":"물리적 근접과 정서적 참여","text":"옆에 앉아 각자 화면만 보거나 대화 중 다른 일을 계속하면 같은 방에 있어도 상대는 함께한다고 느끼지 못할 수 있다. 이 언어의 핵심은 관심이 실제로 상대에게 향해 있다는 경험이다."},{"title":"시간을 준다는 의미","text":"저자는 짧더라도 방해받지 않고 서로에게 집중하는 시간을 되돌릴 수 없는 삶의 일부를 나누는 행위로 본다. 오래 함께 있는 양만큼 그 시간에 어떻게 참여하는지가 중요하다."},{"title":"성공을 함께 누릴 관계도 돌본다","text":"빌은 가족을 위해 일하지만 베티 조는 남편의 관심이 일에만 있다고 느꼈다. 상담의 전환은 일의 목표를 버리는 데 있지 않고 그 목표를 함께 누릴 사람과의 현재 시간을 계획하는 데 있었다."},{"title":"함께하고 싶은 일의 구체화","text":"막연하게 시간을 내라고 요구하기보다 산책, 식사, 공연, 하루의 일 나누기처럼 원하는 활동을 목록으로 만든다. 책은 이미 반복해서 말했던 소원 안에서 실행 가능한 약속을 찾는 방법을 보여 준다."},{"title":"활동은 관계를 위한 매개","text":"공놀이든 테니스든 핵심은 활동 성과가 아니라 서로의 참여다. 함께 무언가를 한다고 해서 반드시 눈을 계속 마주 봐야 하는 것은 아니며, 공동의 경험 안에서 관심과 배려가 전달되어야 한다."}],"practice":["편집 적용: 다음 주에 방해를 줄일 수 있는 짧은 시간을 서로 합의해 달력에 적는다.","편집 적용: 함께하고 싶은 활동을 각자 세 가지씩 적고 이번에 할 수 있는 하나를 고른다."],"keywords":["함께하는 시간","집중","관심","공동 활동","시간 계획"]},{"id":"love-08","title":"함께하는 시간: 듣기와 자기 표현","part":"2부 · 다섯 사랑의 언어","pages":[80,95],"summary":"진정한 대화는 문제를 즉시 해결하려는 충고보다 상대의 경험과 감정을 이해하는 데서 시작한다. 듣는 연습과 함께 자신의 감정을 말하는 연습을 해야 서로가 알려지는 관계가 된다.","points":[{"title":"공감과 해결책의 차이","text":"패트릭의 사례에서 아내는 직장 문제에 대한 처방만이 아니라 이해와 지지를 원했다. 상대가 어려움을 이야기할 때 무엇을 고쳐야 하는지만 생각하면 정작 함께 있어 달라는 필요를 놓칠 수 있다."},{"title":"듣기의 구체적 습관","text":"상대에게 시선을 두고 다른 일을 멈추며, 말과 표정·몸짓에 나타나는 감정을 살핀다. 추측한 감정은 맞는지 확인하고 말을 가로막지 않는다. 당장 집중하기 어렵다면 막연히 미루지 말고 다시 들을 수 있는 시간을 분명히 말한다."},{"title":"충고의 시점","text":"대화의 목적은 먼저 상대의 생각·감정·바람을 알아가는 것이다. 해결책이 필요한지 확인한 후 조언할 수 있지만, 자신의 방법을 따르지 않았다고 대화를 거부하면 이해의 통로가 닫힌다."},{"title":"생각과 감정을 구별해 말하기","text":"무엇이 옳고 그른지 평가하는 말만으로는 내면의 경험이 충분히 전달되지 않는다. 저자는 하루의 사건과 그때 느낀 감정을 기록해 보는 연습을 권하며, 감정 자체와 그 감정에 따라 선택한 행동을 구별한다."},{"title":"말수의 차이를 다루기","text":"저자는 잘 말하지 않는 성향을 사해, 생각과 경험을 곧바로 말하는 성향을 시냇물에 비유한다. 이는 책의 설명용 비유이며, 한쪽은 자기 표현을, 다른 쪽은 경청을 배워 서로 조정할 수 있다는 점이 중요하다."},{"title":"공동 활동의 세 조건과 기억","text":"활동은 적어도 한 사람이 원하고, 다른 사람도 자발적으로 참여하며, 둘 다 함께함으로 애정을 나눈다는 목적을 알아야 한다. 상대의 취미를 그대로 자신의 취미로 만들 필요는 없다. 이런 경험은 이후 함께 떠올릴 수 있는 추억이 된다."},{"title":"시간과 자원의 현실적 조율","text":"책은 짧은 일상 대화, 과거 경험을 나누는 시간, 산책, 둘만의 나들이 등을 제안한다. 중요한 것은 비싼 일정이 아니라 두 사람의 관심·경제적 형편·돌봄 책임을 고려해 반복 가능한 시간을 만드는 일이다."}],"practice":["편집 적용: 하루의 사건 하나를 말할 때 사실, 감정, 바라는 도움을 구분해 전한다.","편집 적용: 상대가 이야기를 끝낸 뒤 이해한 내용을 요약하고 공감이 필요한지 해결책이 필요한지 확인한다.","편집 적용: 서로 다른 취미 하나를 짧게 함께 경험한 뒤 좋았던 점과 부담스러웠던 점을 나눈다."],"keywords":["진정한 대화","경청","자기 표현","감정 기록","사해형","시냇물형","추억"]},{"id":"love-09","title":"선물: 기억하고 있다는 가시적 표현","part":"2부 · 다섯 사랑의 언어","pages":[97,115],"summary":"선물은 상대를 생각한 마음이 물건이나 준비 과정으로 드러난 상징이다. 비용보다 상대를 기억하고 선택했다는 의미가 중요하며, 필요한 순간 함께 있어 주는 존재 자체도 선물이 될 수 있다.","points":[{"title":"물건에 담기는 관계의 기억","text":"저자가 여행 중 받은 나뭇가지의 사례는 금전적 가치가 낮아도 관계를 기억하게 하는 물건이 소중할 수 있음을 보여 준다. 선물의 의미는 생각만 했다는 주장보다 실제로 고르고 건넨 행위에서 생긴다."},{"title":"가격과 상징을 구분하기","text":"선물은 구입하거나 만들거나 발견한 것이어도 된다. 책은 형편에 맞는 작은 선물도 가능하다고 설명한다. 누구에게나 같은 물건이 통하는 것은 아니므로 상대의 취향과 과거에 기뻐했던 반응을 살펴야 한다."},{"title":"선물하기를 배우는 방법","text":"잘 골랐던 선물의 목록, 상대가 관심을 보인 것의 기록, 가까운 사람의 조언이 출발점이다. 특별한 기념일만 기다리지 않고 일상에서도 표현할 수 있으며, 손으로 만든 물건이나 마음을 담은 카드도 제안된다."},{"title":"돈에 대한 태도","text":"절약을 통해 안정감을 얻는 사람은 선물을 불필요한 지출로 느낄 수 있다. 저자는 상대의 정서적 필요에도 자원을 배정하는 관점으로 재검토하라고 한다. 이것은 상대의 반응을 사는 거래나 형편을 넘는 소비를 뜻하지 않는다."},{"title":"존재의 선물","text":"출산이나 사별처럼 상대에게 중요한 순간에는 물건보다 곁에 머무르는 것이 크게 전달될 수 있다. 내가 해야 할 일을 끝냈다는 판단과 상대가 필요로 하는 동행의 길이는 다를 수 있으므로 함께 있어 달라는 요청을 진지하게 듣는다."},{"title":"작고 지속적인 변화의 사례","text":"더그와 케이트의 사례에서 규칙적이고 작은 선물은 잊힌 존재가 아니라 기억되는 사람이라는 느낌을 회복시키는 역할을 한다. 저자는 매일 혹은 매주 정해진 횟수를 모두에게 의무로 삼지는 않으며 사랑의 의미가 담기는지를 강조한다."},{"title":"확장 가능한 형태","text":"책은 상대의 관심사를 담은 책, 함께 읽고 나눌 기회, 식물, 상대가 중요하게 여기는 곳에 대한 기부 등을 예로 든다. 핵심 질문은 내가 주고 싶은 물건보다 상대가 어떤 의미를 읽을 수 있는가이다."}],"practice":["편집 적용: 상대가 좋아한다고 말한 것을 기록하고 현재 형편에서 가능한 작은 선물 하나를 준비한다.","편집 적용: 다가오는 중요한 날에 물건, 실제 도움, 곁에 있는 시간 중 무엇을 가장 원하는지 확인한다."],"keywords":["선물","상징","기억","취향","존재의 선물","금전적 가치"]},{"id":"love-10","title":"봉사: 실제 필요를 덜어 주는 행동","part":"2부 · 다섯 사랑의 언어","pages":[117,135],"summary":"봉사는 상대가 필요로 하는 일을 자발적으로 해 주는 표현이다. 같은 봉사를 중요하게 여겨도 원하는 일이 다를 수 있으며, 강요와 성 역할의 고정관념을 점검해야 한다.","points":[{"title":"시간과 수고가 담긴 사랑","text":"요리, 청소, 돌봄, 수리, 심부름처럼 실제 부담을 덜어 주는 일은 생각과 계획과 에너지를 요구한다. 무엇이 사랑으로 전달되는지는 내가 애쓴 양만이 아니라 상대에게 도움이 된 구체적 내용으로 확인한다."},{"title":"같은 언어 안에도 다른 방언","text":"마크와 메리는 둘 다 봉사를 중요하게 여기지만 원하는 집안일은 달랐다. 막연히 서로 돕고 있다고 주장하는 대신 각자 의미 있게 여기는 몇 가지 행동을 적자 협의할 대상이 분명해졌다."},{"title":"연애 때와 결혼 후의 역할 기대","text":"결혼 전에는 기꺼이 하던 일을 결혼 후 부모에게서 본 역할대로 중단할 수 있다. 저자는 남편이나 아내가 당연히 해야 할 일이라는 고정관념보다 현재 두 사람의 필요와 합의를 살피라고 제안한다."},{"title":"명령에서 부탁으로","text":"비판은 상대가 중요하게 여기는 일을 알려 줄 단서가 될 수 있지만 강요 자체가 사랑을 만들어 내지는 않는다. 실행 가능한 요청 목록을 만들고 서로 자발적으로 할 수 있는지 확인해야 한다. 목록을 끝없이 늘리는 대신 조정의 속도도 협의한다."},{"title":"봉사와 이용당함의 구별","text":"책은 두려움이나 죄책감으로 상대를 시중드는 상태를 사랑과 구별한다. 상대를 물건처럼 취급하거나 위협으로 행동을 얻는 것은 사랑의 언어가 아니며, 비인간적인 대우를 허용하지 않는 경계를 말하는 것도 관계를 존중하는 행위로 설명한다."},{"title":"낯선 일을 배우는 과정","text":"집안일을 처음 배우는 사람은 시행착오를 겪을 수 있다. 사례에서 중요한 변화는 완벽하게 시작했다는 점보다 기존 역할을 고집하지 않고 실제 기술을 익혔다는 점이다. 필요하면 형편 안에서 외부 도움을 마련하는 방식도 가능하다."},{"title":"일상 속 반복 가능한 실행","text":"저자는 최근 요청받은 일, 오래 미룬 일, 상대가 우선순위를 매긴 일을 출발점으로 삼는다. 큰 깜짝 이벤트뿐 아니라 작지만 규칙적인 행동이 상대의 수고를 덜어 주는지를 살피는 것이 중요하다."}],"practice":["편집 적용: 서로 도움이 되는 일 세 가지를 적고 중요도와 실제 부담을 비교해 이번 주의 분담을 합의한다.","편집 적용: 집안일의 준비·기억·실행 중 어디에서 부담이 생기는지 함께 말하고 구체적으로 맡을 범위를 정한다."],"keywords":["봉사","자발성","역할 기대","부탁","경계","구체적 필요"]},{"id":"love-11","title":"스킨십: 상대가 편안하게 받는 접촉","part":"2부 · 다섯 사랑의 언어","pages":[137,150],"summary":"손잡기와 포옹 등 신체 접촉은 어떤 사람에게 애정을 강하게 전달한다. 접촉의 의미와 편안함은 사람과 상황마다 다르므로 상대의 반응과 선호가 기준이 되어야 한다.","points":[{"title":"여러 형태의 신체적 애정","text":"스킨십은 성관계에 한정되지 않는다. 손을 잡거나 어깨에 손을 얹고 포옹하는 작은 일상적 접촉, 시간을 들이는 마사지 등 다양한 방식이 포함된다."},{"title":"가장 좋은 안내자는 상대","text":"내가 좋아하는 접촉을 상대도 좋아한다고 추측하면 안 된다. 어떤 접촉은 사랑스럽지만 어떤 접촉은 불편하거나 귀찮을 수 있으며, 원하지 않는 방식을 계속하면 관심이 없다는 메시지를 줄 수 있다. 상대가 좋아하는지 확인하고 거절을 존중하는 것이 핵심이다."},{"title":"일상적 접촉과 집중하는 접촉","text":"짧게 손을 잡는 일과 시간을 들여 몸을 어루만지는 일은 필요한 시간과 주의가 다르다. 자신의 생활과 두 사람의 편안함에 맞춰 표현을 찾되 친근한 접촉이 반드시 성관계로 이어져야 한다고 여기지 않는다."},{"title":"학대와 친밀함은 다르다","text":"책은 몸을 접촉할 수 있다는 사실이 학대할 수 있다는 뜻은 아니라고 명시한다. 친밀한 관계라는 이유만으로 상대의 신체적 경계를 무시할 수 없으며, 접촉은 사랑과 거부 모두를 강하게 전달할 수 있다."},{"title":"위기의 순간과 동행","text":"사별이나 질병, 좌절 같은 때 상대가 원하는 포옹은 말로 설명하기 어려운 지지를 전할 수 있다. 저자는 이런 순간의 따뜻한 접촉이나 그 부재가 오래 기억될 수 있다고 설명한다."},{"title":"먼저 표현하기와 오해 풀기","text":"피트와 패시의 사례에서 한 사람은 접촉을, 다른 사람은 함께하는 시간을 원했지만 서로의 행동을 거절로 해석했다. 상대가 먼저 해 주기를 기다리기만 하기보다 원하는 애정 표현을 대화로 알리는 일이 관계 이해의 출발점이 된다."},{"title":"독점적 결혼관의 맥락","text":"혼외 성관계와 개방적 결혼에 관한 부분은 성적 독점과 평생 헌신을 강조하는 저자의 도덕적·종교적 관점에서 서술된다. 배신으로 경험되는 사건의 고통에 대한 설명과 모든 관계 형태에 관한 보편적 판단을 구분해 읽는다."}],"practice":["편집 적용: 편안한 접촉, 상황에 따라 다른 접촉, 원하지 않는 접촉을 서로 말해 본다.","편집 적용: 둘 다 원하는 인사 방식 하나를 정하고 접촉을 다른 행동의 대가나 의무로 만들지 않는다."],"keywords":["스킨십","접촉","포옹","선호","신체적 경계","위기"]},{"id":"love-12","title":"나의 언어 발견과 탱크 점검","part":"2부 · 발견과 적용","pages":[153,163],"summary":"자신의 언어를 찾으려면 자주 원하는 것, 특히 상처받는 것, 자연스럽게 주는 표현을 함께 관찰한다. 검사와 탱크 점검은 추측을 상대와의 대화 및 실제 경험으로 확인하는 도구다.","points":[{"title":"성적 욕구와 애정의 언어 구별","text":"마커스의 사례에서 성관계를 중요하게 생각한다는 사실만으로 스킨십이 제1의 언어라고 결론낼 수 없었다. 그는 칭찬과 존중이 없는 관계에서는 사랑받는다고 느끼지 못했다. 원문에 등장하는 남녀의 욕구 차이에 대한 일반화는 개인을 판별하는 규칙으로 사용하지 않는다."},{"title":"깊이 아픈 지점을 살핀다","text":"비난, 무관심, 도와주지 않음 등 무엇이 특히 상처가 되는지 살펴보면 중요하게 여기는 필요를 짐작할 수 있다. 다만 상처받는 모든 행동이 언어 하나를 증명하는 것은 아니므로 다른 단서와 함께 본다."},{"title":"반복하는 요청을 모은다","text":"그동안 가장 자주 부탁한 일을 돌아보면 자신이 바라는 애정의 형태가 드러날 수 있다. 함께 걷기나 대화, 도움, 작은 선물처럼 반복된 소원을 구체적으로 적으면 추상적인 분류보다 이해하기 쉽다."},{"title":"주는 방식은 단서이지 확정이 아니다","text":"사람은 자신이 받고 싶은 방식으로 주기도 하지만 부모에게 배운 습관을 그대로 따르기도 한다. 그러므로 선물을 많이 주는 사람이라고 반드시 선물을 가장 받고 싶어 한다고 단정할 수 없다."},{"title":"알기 어려운 경우와 두 언어","text":"오랫동안 여러 표현을 충분히 받았거나 반대로 너무 오래 애정이 부족했던 사람은 무엇이 중요한지 고르기 어려울 수 있다. 연애 초기의 기억이나 이상적인 배우자상을 살피고, 두 가지가 비슷하게 중요하면 둘 다 의미 있는 것으로 받아들인다."},{"title":"서로의 예상 비교","text":"자신의 다섯 언어 우선순위와 추측한 배우자의 우선순위를 각각 적어 비교한다. 이 과정은 상대를 맞히는 시험이 아니라 자기 설명을 듣고 잘못된 가정을 수정하는 대화다."},{"title":"탱크 점검의 실제 순서","text":"현재 사랑받는 느낌을 0부터 10까지 표현하고, 오늘 무엇을 하면 조금 더 충족될지 한 가지를 말한다. 서로 역할을 바꾸어 같은 질문을 한다. 본문은 약 3주 동안 주 3회 실천을 제안하며, 다음 적용란에서는 한 달 동안 이어 보도록 권한다."}],"practice":["편집 적용: 상처, 반복 요청, 평소 표현을 각각 세 가지 적고 공통되는 필요를 찾는다.","편집 적용: 이번 주 세 번 점검 대화를 해 보고 숫자 자체보다 변화의 이유와 실행 가능한 요청을 기록한다."],"keywords":["자기 발견","우선순위","성적 욕구","반복 요청","탱크 점검","이중 언어"]},{"id":"love-13","title":"사랑은 선택이다","part":"3부 · 선택과 관계의 변화","pages":[167,176],"summary":"과거의 잘못이 미래의 행동까지 결정하지는 않는다는 것이 이 장의 출발점이다. 저자는 감정이 따르지 않는 때에도 자발적으로 상대의 유익을 택하는 행동에서 관계 변화가 시작될 수 있다고 말한다.","points":[{"title":"과거를 인정하고 다른 행동 선택하기","text":"상처를 주는 말을 했다는 사실을 인정하고 사과한 뒤 새로운 표현을 실천할 수 있다. 사랑의 행동이 과거를 지우는 것은 아니지만 앞으로 무엇을 할 것인지는 달라질 수 있다는 관점이다."},{"title":"다른 사랑을 찾는 순환","text":"브렌트와 베카의 사례는 결혼의 정서적 공허함과 새로운 연애의 몰입을 대비한다. 저자는 새로운 상대와의 황홀감도 지속을 보장하지 않으며, 그 감정에서 두 사람이 동시에 벗어나는 것도 아니라고 설명한다."},{"title":"회복에는 다른 문제도 다룰 일이 남는다","text":"사례의 부부는 사랑의 언어뿐 아니라 그동안 해결하지 못한 여러 문제를 상담에서 다뤘다. 따라서 언어를 알아내는 순간 모든 갈등이 사라지는 이야기로 축약하지 않고 지속적 상담과 행동 변화가 함께 있었다는 점을 읽어야 한다."},{"title":"자연스럽지 않음과 불가능함은 다르다","text":"저자는 자신에게 청소가 즐거운 일이 아니어도 아내에게 중요한 봉사이기에 선택한다고 설명한다. 익숙하지 않은 표현은 작게 연습할 수 있고, 어색하다는 이유만으로 상대의 필요를 무시하지 않는 것이 요점이다."},{"title":"상대의 반응을 통제하는 기술은 아니다","text":"책은 서로의 욕구를 채우는 행동이 호응으로 이어질 수 있다고 기대한다. 그러나 내가 선택할 수 있는 것은 내 행동이며 상대의 선택까지 강제할 수는 없다는 원칙이 뒤의 어려운 관계 장에서도 반복된다."}],"practice":["편집 적용: 반복해서 후회하는 행동 하나와 그 자리를 대신할 구체적인 표현 하나를 적는다.","편집 적용: 어색하지만 자발적으로 해 볼 수 있는 행동을 작게 정하고, 실행 뒤 상대가 어떻게 받았는지 듣는다."],"keywords":["선택","사과","행동 변화","감정","연습","회복"]},{"id":"love-14","title":"사랑이 만드는 안전한 대화의 조건","part":"3부 · 선택과 관계의 변화","pages":[177,185],"summary":"저자는 사랑받는 느낌이 안정감·자긍심·삶의 의미와 연결된다고 설명한다. 관계의 정서적 분위기가 달라지면 차이를 위협보다 함께 논의할 문제로 대할 여지가 생긴다.","points":[{"title":"안정감","text":"배우자가 자신의 행복을 배려한다고 느끼면 관계 안에서 편안함을 경험할 수 있다. 저자는 그 안정이 직장과 다른 생활의 어려움을 감당하는 데에도 영향을 미친다고 본다."},{"title":"자긍심과 의미","text":"누군가 자신을 알고도 사랑하고 시간과 수고를 들인다는 경험은 자신이 소중한 존재라는 느낌을 도울 수 있다. 이 장의 인간 가치와 영적 세계에 대한 설명에는 저자의 신앙적 인간관이 함께 담겨 있다."},{"title":"모든 문제의 해답이라는 뜻은 아니다","text":"원문은 사랑이 모든 문제를 대신 해결하지는 않는다고 말한다. 다만 비난과 방어가 줄어든 분위기에서 서로 다른 생각을 논의하고 해결 방법을 찾을 수 있다는 주장이다."},{"title":"싸우지 않아도 외로울 수 있다","text":"존과 수잔은 경제적으로 안정되고 다툼도 적었지만 아내는 한집의 동거인처럼 느꼈다. 갈등의 적음이나 생활의 효율만으로 정서적 친밀함을 판단할 수 없다는 점을 보여 준다."},{"title":"많은 봉사가 대화를 대신하지 못한 사례","text":"존은 수많은 집안일로 애정을 표현했지만 수잔이 원한 것은 함께 앉아 서로의 삶을 이야기하는 시간이었다. 반대로 존 자신은 봉사에서 애정을 느꼈다. 서로의 구체적 필요를 말한 뒤 행동을 조정한 것이 변화의 전환점으로 제시된다."}],"practice":["편집 적용: 우리 관계가 효율적으로 운영되는 부분과 친밀하게 느껴지는 부분을 따로 평가한다.","편집 적용: 최근 상대를 중요한 사람으로 느끼게 한 행동과 자신이 그렇게 느낀 행동을 하나씩 나눈다."],"keywords":["안정감","자긍심","의미","룸메이트","정서적 분위기"]},{"id":"love-15","title":"미운 사람 사랑하기: 제안과 한계","part":"3부 · 선택과 관계의 변화","pages":[187,204],"summary":"이 장은 상처와 미움이 남아 있는 관계에서 사랑의 행동을 선택할 수 있는지 묻는다. 저자는 신앙을 중요하게 여긴 앤의 상담 사례와 6개월 실험을 제시하지만, 상대의 변화는 보장할 수 없다고 명시한다.","points":[{"title":"서로 노력하는 경우와 한쪽만 노력하는 경우","text":"저자 부부는 함께 배우려 했지만 앤의 남편은 상담과 관계 개선을 거부했다. 따라서 이 사례의 질문은 단순한 표현 차이를 넘어 반복적인 비난 속에서 한 사람이 무엇을 선택할 수 있는가에 있다."},{"title":"기독교적 근거","text":"저자는 앤의 깊은 신앙을 바탕으로 원수를 사랑하고 자신이 바라는 대로 다른 사람을 대하라는 예수의 가르침을 적용한다. 이 제안은 앤의 종교적 신념과 결혼관 안에서 나온 상담 접근이며 모든 독자에게 같은 종교적 의무를 부과하는 원리로 바꿔 읽지 않는다."},{"title":"목표와 가설을 먼저 적는다","text":"앤은 대화와 함께하는 시간, 존중, 따뜻한 감정의 회복을 원했다. 상담은 원하는 변화를 구체적으로 적고 상대의 언어로 꾸준히 표현하면 호응이 생길 수 있다는 가설 아래 진행되었다. 저자도 개인의 반응을 확실히 예언할 수 없다고 설명한다."},{"title":"6개월 실험의 구조","text":"더 좋은 배우자가 되기 위해 무엇이 필요한지 묻고, 추정한 언어로 표현하며, 매달 피드백을 듣는다. 긍정적인 반응이 나타난 뒤에는 자신의 언어에 맞는 작고 분명한 요청을 한다. 앤은 이 과정에서 정기적으로 상담자를 만나 불만과 좌절을 기록하고 다뤘다."},{"title":"없는 감정을 꾸미는 것과 자발적 행동","text":"저자는 따뜻한 감정이 없는데 있다고 말하는 것과 상대의 유익을 위해 행동을 선택하는 일을 구별한다. 다만 원문에는 이용당한다고 느끼는 앤에게 성관계를 먼저 시도하도록 권한 내용도 있다. 이는 저자의 특정 사례 권고로 정리하며, 원치 않는 성관계나 모욕을 참을 일반적 의무로 제시하지 않는다."},{"title":"반응을 보장할 수 없는 이유","text":"상대에게는 사랑에 호응하지 않을 자유도 있기 때문에 노력의 양이 결과를 보장하지 않는다. 책이 보고하는 앤의 관계 변화는 하나의 상담 사례다. 변화가 없다는 이유로 노력한 사람에게 상대의 행동 책임까지 돌릴 수는 없다."},{"title":"경계에 관한 앞 장과 함께 읽기","text":"봉사 장은 위협과 죄책감으로 조종당하는 상태를 사랑과 구별했고 스킨십 장은 학대를 인정하지 않았다. 어려운 사랑의 실험도 이런 구별을 없애는 허가로 읽지 않는다. 적용 여부와 범위에는 당사자의 자발성과 경계가 포함되어야 한다."}],"practice":["편집 적용: 원하는 관계 변화, 자신이 자발적으로 할 수 있는 일, 받아들일 수 없는 행동을 각각 구분해 적는다.","편집 적용: 관계 회복의 성공을 상대의 기분뿐 아니라 존중·약속 이행·자신의 경계가 지켜지는지로도 살핀다."],"keywords":["미움","6개월 실험","신앙","원수 사랑","자발성","회복의 한계"]},{"id":"love-16","title":"맺는 말: 이해에서 생활로","part":"맺는 말","pages":[205,208],"summary":"책의 결론은 서로의 차이를 없애기보다 사랑을 느끼는 방식과 구체적인 생활 습관을 조정하라는 초대다. 저자는 이 책을 학술 이론보다 실제 부부의 생활을 돕는 책으로 규정한다.","points":[{"title":"개념보다 실행에서 확인","text":"언어를 알아냈다는 사실만으로 관계가 바뀌지는 않는다. 저자는 일상의 작은 표현을 실제로 해 보고 상대가 어떻게 느끼는지 경험하는 것을 강조한다."},{"title":"차이는 남아 있을 수 있다","text":"부부는 다른 성격, 과거 경험, 기대, 삶의 우선순위를 지닌 채 결혼한다. 모든 생각을 일치시킬 필요는 없지만 차이가 거리를 벌리지 않도록 함께 다루는 방법은 필요하다."},{"title":"작은 구체성이 갖는 의미","text":"커피를 준비하거나 상대에게 중요한 말을 건네는 일처럼 일상적인 행동도 정확한 필요와 연결되면 의미가 커진다. 상대가 원하지 않는 큰 수고를 늘리기보다 어떤 행동을 사랑으로 읽는지 배우는 것이 반복되는 메시지다."},{"title":"저자의 영적 동력","text":"저자는 상대가 호응하지 않을 때 사랑할 힘을 기독교 신앙에서 얻었다고 고백한다. 이것은 그의 개인적 경험과 신앙적 해석이며, 책의 실천 원리와 독자가 같은 신념을 가져야 한다는 요구는 구분된다."},{"title":"부부와 자녀에게 기대하는 변화","text":"저자는 정서적으로 충족된 부부가 서로의 잠재력을 지지하고 자녀에게도 사랑과 안전을 경험하게 하기를 바란다. 결론은 독자가 관계에서 실천하고 그 경험을 다른 사람과 나누기를 권하는 방식으로 끝난다."}],"practice":["편집 적용: 이번 독서에서 유지할 일상 습관 하나와 줄일 관계 습관 하나를 정한다.","편집 적용: 두 주 뒤 실행 결과를 함께 돌아볼 날짜를 잡고 도움이 된 점과 수정할 점을 나눈다."],"keywords":["실천","차이","생활 습관","영적 동력","가정"]},{"id":"love-17","title":"FAQ: 발견·변화·자녀·낯선 표현","part":"부록 · FAQ 1–6","pages":[213,220],"summary":"FAQ 앞부분은 언어가 분명하지 않을 때의 관찰법과 생애 단계별 표현 조정을 다룬다. 저자는 주된 언어가 지속된다고 보면서도 상황과 나이에 따라 필요한 표현 방식은 달라질 수 있다고 설명한다.","points":[{"title":"동점이 많을 때의 추가 질문","text":"주로 주는 표현, 반복하는 불평, 자주 하는 부탁을 살펴본다. 여러 가지가 비슷하면 하나를 포기해야 할 경우 무엇이 가장 아쉬운지 비교하는 방법도 나온다. 단순히 설문 최고점 하나만으로 결론내리지 않고 생활 경험을 덧붙인다."},{"title":"배우자가 자신의 언어를 모를 때","text":"평소 표현과 불만과 요청을 관찰하되 불평을 곧바로 반박하지 않는다. 무엇을 하면 좋을지 구체화하는 질문이 단서를 얻는 데 도움이 된다. 책을 읽기 원하지 않는 사람에게도 대화와 관찰을 시도할 수 있다."},{"title":"5주 동안 표현을 달리해 보기","text":"책은 매주 한 언어를 선택해 월요일부터 금요일까지 표현하고 주말은 쉬면서 다섯 주 동안 반응을 관찰하는 실험을 제안한다. 반응을 조용히 해석하는 데만 머물지 않고 당사자에게 어떤 점이 의미 있었는지 확인하면 추측을 보완할 수 있다."},{"title":"나이와 상황의 영향","text":"저자는 제1의 언어가 평생 지속되는 편이라고 생각하지만, 어린 자녀를 돌보는 시기의 실제 도움이나 사별 때의 포옹처럼 다른 표현이 특별히 중요해질 수 있다고 말한다. 지속성은 저자의 견해이며 현재의 필요를 무시하는 이유가 되지 않는다."},{"title":"아이에게는 다섯 표현 모두","text":"저자는 자녀의 주된 언어를 관찰하되 나머지 네 가지도 경험하게 하라고 제안한다. 한 유형의 아이로 고정시키기보다 다양한 방식으로 사랑을 주고받는 법을 배우게 한다는 취지다."},{"title":"십대의 자율성과 표현의 변화","text":"어릴 때의 방식이 십대에게 유치하게 느껴질 수 있으므로 나이와 상황에 맞게 표현을 바꾼다. 책은 자유와 책임을 함께 늘리는 일도 강조한다. 편집 적용에서는 자녀의 거절을 무시하지 않고 편안한 표현을 직접 확인하는 방식으로 이 취지를 사용한다."},{"title":"어려운 언어는 작은 연습부터","text":"가정에서 경험하지 못한 표현은 낯설 수 있다. 짧은 애정 표현이나 칭찬 문장 하나처럼 작은 단위로 연습하고 점차 익숙해지는 것이 저자의 제안이다. 관계 안에서 서로 편안하게 받아들일 수 있는 방식인지도 함께 확인한다."}],"practice":["편집 적용: 한 주 동안 표현 하나를 시도하고 무엇이 좋았는지 직접 물어본다.","편집 적용: 자녀나 배우자에게 예전에는 좋았지만 지금은 부담스러운 표현이 있는지 확인한다."],"keywords":["FAQ","5주 실험","동점","나이","자녀","십대","자율성"]},{"id":"love-18","title":"FAQ: 성별·기원·문화·싱글","part":"부록 · FAQ 7–10, 15","pages":[220,231],"summary":"저자는 다섯 언어를 상담 기록의 반복되는 요구에서 발견했다고 설명한다. 성별이나 문화만으로 개인의 언어를 정하지 않으며, 부부 밖의 관계에도 표현 차이를 이해하는 관점으로 적용한다.","points":[{"title":"성별로 단정하지 않는다","text":"FAQ에서 저자는 남녀의 언어 차이를 직접 연구하지 않았으며 자신의 인상이 정확한지 모른다고 말한다. 다섯 언어 어느 것이든 남성과 여성 모두에게 중요할 수 있으므로 상대 개인의 제1·제2 언어를 찾는 것이 핵심이다."},{"title":"분류가 생긴 과정","text":"저자는 상담에서 사랑받지 못한다고 말하는 사람들의 요구를 관찰하고 12년 동안의 상담 노트를 다시 읽으면서 다섯 범주를 정리했다고 설명한다. 이어 워크숍과 소그룹에서 이를 소개하고 참가자들의 반응을 확인했다고 회고한다."},{"title":"발견의 방식과 증거의 범위","text":"이 설명은 상담 경험에서 패턴을 도출한 과정이다. 따라서 다섯 범주만이 가능한 유일한 분류라는 결론이나 모든 사람이 반드시 한 가지 주된 언어를 가진다는 엄밀한 검증과는 구분해 이해한다."},{"title":"문화에 따른 표현 조정","text":"저자는 여러 나라에서 번역과 호응이 이어진 경험을 근거로 이 개념의 폭넓은 적용 가능성을 믿게 되었다고 말한다. 동시에 허용되는 접촉과 봉사의 구체적 형태는 문화마다 다르므로 상황에 맞게 사용해야 한다고 덧붙인다."},{"title":"책의 성공에 대한 저자의 해석","text":"저자는 사랑받고 싶은 필요, 이해하기 쉬운 설명, 실제 관계에서 변화를 경험한 독자들의 추천을 인기의 이유로 든다. 이러한 자기 설명과 판매 성과는 독자들의 호응을 보여 주지만 개인별 효과를 보장하는 근거로 삼지는 않는다."},{"title":"싱글과 가족·직장·데이트","text":"싱글 독자에게도 사람마다 애정이나 존중을 표현하는 방식이 다르다는 관점이 도움이 될 수 있다고 말한다. 수감자가 어머니의 돌봄을 봉사로 이해하게 된 사례는 자신이 원하던 표현이 아니었어도 상대가 보여 준 마음을 새롭게 읽을 수 있다는 교훈을 준다."}],"practice":["편집 적용: 성별이나 관계 역할에서 추측했던 기대를 한 가지 적고 당사자의 실제 선호와 비교한다.","편집 적용: 가족이나 동료가 평소 보내는 도움과 인정의 표현을 살피되 관계에 맞는 경계를 지킨다."],"keywords":["FAQ","성별","상담 기록","문화","싱글","표현의 차이"]},{"id":"love-19","title":"FAQ: 무반응·배신·오랜 거리감","part":"부록 · FAQ 11–14","pages":[223,230],"summary":"노력에 호응이 없을 때 저자는 언어의 추정과 관계의 맥락을 다시 살피라고 한다. 배신이나 오래된 거리감의 회복에는 표현법뿐 아니라 책임 인정과 지속적인 변화가 필요하다.","points":[{"title":"다른 언어를 사용했을 가능성","text":"자신이 진지하게 노력했더라도 상대에게 가장 중요한 필요와 어긋났을 수 있다. 특히 성관계에 대한 관심만으로 스킨십을 주된 언어라고 전제하는 오류를 다시 지적하며, 비판이 남아 있는지와 실제로 어떤 표현을 원하는지 확인한다."},{"title":"불신과 다른 관계의 영향","text":"저자는 배우자가 이미 다른 사람에게 몰입했거나 새 행동을 일시적인 조종으로 의심하는 경우를 제시한다. 이는 책이 든 가능성이지 무반응만으로 외도나 동기를 단정할 근거는 아니다."},{"title":"지속하라는 권고의 한계","text":"저자는 6개월에서 1년 정도 반응에 흔들리지 않고 사랑의 표현을 계속하라고 권한다. 이 권고는 결과를 보장하지 않으며, 상대의 책임이나 당사자의 자발적 선택을 대신하지 않는다. 앞 장에서 구분한 조종·강요·학대의 문제도 그대로 남는다."},{"title":"성적 부정 이후의 책임","text":"회복을 원한다면 잘못한 당사자가 혼외 관계를 끝내고 자신의 신념·태도·생활 방식을 검토하며 실제 행동을 바꾸어야 한다고 설명한다. 두 사람의 관계 습관을 살피는 일과 잘못한 행동의 책임을 흐리는 일은 다르다. 책은 이 과정에 개인 상담과 부부 상담이 필요할 수 있다고 말한다."},{"title":"알지만 표현하지 못하는 경우","text":"긍정적인 말을 듣고 자란 경험이 없거나 작은 변화를 칭찬하면 더 이상 발전하지 않을까 걱정하는 사람이 있을 수 있다. 책은 강요보다 연습과 구체적인 부탁, 탱크 점검을 통해 표현을 배우도록 돕는 방향을 제안한다."},{"title":"오랜 결혼 뒤에도 시도할 수 있다는 희망","text":"30년 결혼한 부부의 사례는 오랜 무감각을 곧 변화 불가능으로 단정하지 않는 메시지다. 서로 읽고 대화한 뒤 주기적으로 원하는 표현을 시도한 경험이 소개되며, 이는 개별 사례의 가능성을 보여 주는 이야기로 읽는다."}],"practice":["편집 적용: 상대가 반응하지 않을 때 의도와 원인을 단정하기 전에 실제로 원하는 행동이 무엇인지 다시 확인한다.","편집 적용: 회복을 말할 때 애정 표현과 별도로 책임 인정, 신뢰를 회복할 행동, 경계의 존중을 구체화한다."],"keywords":["FAQ","무반응","불신","성적 부정","책임","장기 관계","상담"]},{"id":"love-20","title":"사랑의 언어 검사와 부부 비교표","part":"부록 · 검사와 해석","pages":[233,249],"summary":"부록은 남편용과 아내용 각 30문항의 양자택일 설문으로 현재 선호를 비교하도록 구성되어 있다. 점수의 목적은 사람을 평가하거나 사랑의 양을 재는 것이 아니라 서로가 원하는 표현을 설명하고 논의하는 데 있다.","points":[{"title":"실시 방법","text":"각 문항에는 두 진술이 있으며 자신이 바라는 모습을 더 잘 나타내는 하나를 고른다. 두 선택이 모두 좋아도 원문 방식에서는 하나만 선택한다. 남편용 안내는 편안한 상태에서 서두르지 않고 약 15–30분을 사용하도록 설명한다."},{"title":"부부용 두 양식의 구조","text":"남편용은 아내로부터 받는 표현, 아내용은 남편으로부터 받는 표현을 묻는다. 두 양식은 편지와 포옹, 함께하는 시간과 도움, 선물과 인정 등 다섯 표현 사이의 상대적 선호를 비교하도록 구성되며, 이 정리에서는 원문의 전체 문항을 복제하지 않는다."},{"title":"글자와 언어의 대응","text":"선택한 진술 옆 글자를 합산한다. A는 인정하는 말, B는 함께하는 시간, C는 선물, D는 봉사, E는 스킨십이다. 각 범주의 가능한 최고점은 12점이며, 30문항에 하나씩 답했다면 다섯 범주의 총점은 30점이다."},{"title":"높은 점수와 동점의 의미","text":"원문은 최고점을 제1의 언어로, 그다음 점수를 제2의 언어로 해석한다. 최고점이 둘이면 둘 다 중요하고, 1·2위가 가까워도 함께 의미 있게 본다. 숫자는 이번 선택의 상대적 선호이므로 낮은 점수가 해당 표현이 필요 없다는 뜻은 아니다."},{"title":"다른 언어도 이해할 필요","text":"상대가 자신의 최고점과 다른 방식으로 애정을 보여 줄 수 있다. 그 표현을 알아보는 노력과 상대에게 잘 전달되는 표현을 배우는 노력이 함께 필요하다. 검사 결과를 요구를 강제하거나 누가 더 사랑하는지 비교하는 점수판으로 쓰지 않는다."},{"title":"오각형 비교표의 사용","text":"각 언어의 점수를 다섯 축에 표시하고 연결한 뒤 배우자의 결과를 같은 방식으로 겹쳐 본다. 자신의 최고점 범주에서 상대는 몇 점인지, 그 차이가 생활에서 어떻게 나타났는지, 표현을 어떻게 조정할지 대화한다. 이어 상대의 최고점 범주에도 같은 질문을 적용한다."},{"title":"검사 이후의 확인","text":"설문 결과를 평소의 요청, 실제로 기뻤던 경험, 탱크 점검 대화와 연결한다. 이 책의 부록은 사랑의 표현을 찾아가는 자기보고 도구로 제시되어 있으며, 임상 진단이나 관계의 성공 여부 판정으로 다루지 않는다."}],"practice":["편집 적용: 원문 설문에 각자 답한 뒤 최고점 이름만 공유하지 말고 실제로 원하는 행동 두 가지를 함께 설명한다.","편집 적용: 점수 차이가 큰 범주 하나를 골라 일상에서 생긴 오해와 다음에 시도할 표현을 적는다.","편집 적용: 두 사람이 한 주 동안 합의한 표현을 해 보고 점수에 맞았는지보다 실제로 의미 있었는지를 돌아본다."],"keywords":["검사","30문항","A–E","채점","동점","비교표","자기보고"]}],"notes":["제공된 256쪽 한국어 PDF 전체를 읽고 본문·장별 적용란·FAQ 15개·남편용 및 아내용 검사·비교표의 핵심을 주제별 20장으로 재구성했다. 제목은 원래 목차와 학습용 편집 제목을 함께 사용하므로 원서 장 번호와 일대일 대응하지 않는다.","pages는 제공 PDF의 1부터 시작하는 실제 페이지 번호다. 이 판본의 본문 인쇄 쪽수와 대체로 일치하며 FAQ를 주제별로 묶은 장의 범위는 서로 겹친다.","스캔 OCR에 글자·이름·문장부호 오류가 있어 문맥을 대조하고 주요 제목과 저자명, 검사 글자 대응은 페이지 이미지로 확인했다. 불명확한 인쇄·판차 정보와 불필요한 수치·고유명은 재현하지 않았다.","상담 사례는 교훈 중심으로 재서술했다. 저자의 경험적 주장, 신앙적 해석, 연애 기간·성차·언어의 지속성 등에 관한 일반화는 현대의 보편적 사실이나 효과 보증으로 제시하지 않았다.","practice 항목은 원문의 취지를 바탕으로 새로 작성한 편집 적용 제안이다. 원문 설문 60개 진술쌍 전체를 옮기지 않고 실시·채점·해석·비교 방법을 설명했다.","250–253쪽의 다른 도서 광고, 255쪽의 출판사 사명 및 서점 안내, 빈 쪽은 학습 본문에서 제외했다. 부부 관계를 중심으로 한 책의 범위와 사례의 맥락을 유지했다."]},{"order":30,"category":"삶의 태도 · 비움과 균형","id":"tao","title":"노자의 말","author":"노자 지음 · 야스토미 아유미 엮음 · 김현영 옮김","subtitle":"변화하는 세계에서 비움·유연함·무위로 살아가는 지혜","description":"『노자의 말 도덕경』 230쪽 PDF 전체를 바탕으로, 서문과 본문 001–145, 권말 해설을 18개 주제 묶음으로 정리했다. 이 책은 야스토미 아유미가 백서본 등을 토대로 노자를 현대적으로 풀어낸 초역으로, 언어와 존재를 고정하지 않는 시각에서 비움·돌봄·자기 절제·낮은 자리의 지도력을 설명한다. 아래 제목과 요약, 실천 질문은 읽기를 돕기 위한 편집자의 재서술이며 원서의 장별 목차를 그대로 옮긴 것이 아니다.","pages":230,"color":"sage","chapters":[{"id":"tao-01","title":"서문 · 변화를 읽는 고전","part":"읽기 안내 · 편집상 묶음","pages":[2,7],"summary":"편자는 노자를 변화하는 현실을 살아가는 실천적 지혜로 읽는다. 말로 세계를 고정하는 습관을 경계하고, 일상의 경험으로 문장의 뜻을 되짚는 독법을 제시한다.","points":[{"title":"노자라는 이름과 책","text":"서문은 저자의 실존과 생애를 확정하기 어렵다고 밝히며, 특정 인물·장소보다 추상적인 논의를 펼치는 고전이라는 성격을 설명한다.","page":2},{"title":"생활 속에서 해석하기","text":"통치와 처세에서 출발한 사유도 생활의 문제와 연결할 때 의미가 드러난다. 독서와 경험을 오가며 이해를 갱신하는 과정이 중요하다.","page":4},{"title":"이름이 가리는 차이","text":"언어는 상상과 사고를 가능하게 하지만, 사물이나 사람을 하나의 범주에 묶어 실제 차이를 보지 못하게 만들기도 한다.","page":5},{"title":"반복해서 고정관념 풀기","text":"돈이나 집단의 이름에 사로잡히면 다른 가치를 놓친다. 유사한 주제의 반복은 굳어진 인식에서 벗어나도록 돕는 장치로 제시된다.","page":6}],"practice":["익숙한 평가 하나를 골라 그 말이 생략한 실제 모습 세 가지를 적는다."],"keywords":["서문","변화","언어","실천"]},{"id":"tao-02","title":"이름과 구별을 넘어","part":"상편 도경 · 편집상 묶음","pages":[19,30],"summary":"존재와 언어는 고정된 실체가 아니라 가능성과 변화에 열려 있다. 선악·우열의 구분에 매달리기보다 상대적 관계와 자연스러운 움직임을 살핀다.","points":[{"title":"001 · 변화는 가능성이다","text":"지금 피할 수 없어 보이는 상황도 달라진다. 자신과 세계를 고정하지 않으면 불안정성 안에서 새로운 가능성을 발견할 수 있다.","page":19},{"title":"002 · 이름은 대상을 다 담지 못한다","text":"사물과 이름의 관계도 변하므로 특정 명칭에 자신을 가두거나 그 명칭으로 타인을 규정하지 않는다.","page":20},{"title":"003 · 두려움의 이름을 점검하기","text":"두려움이 실제 상황에서 오는지, 스스로 붙인 이름과 해석에서 커진 것인지 구별하면 막연한 불안을 다시 볼 수 있다.","page":21},{"title":"004 · 확실성 집착을 놓기","text":"모든 것이 확고해야 살 수 있다고 믿을수록 불안이 커진다. 변화에 대응할 힘이 자신에게 있음을 신뢰한다.","page":22},{"title":"005 · 드러난 모습과 생성의 과정","text":"의식적으로 구별한 겉모습과 말 이전에 감지되는 생성 과정은 같은 세계의 두 측면이다. 풍요로운 세계는 열려 있는 상태에서 생겨난다.","page":24},{"title":"006 · 가치 판단은 대비에서 생긴다","text":"아름다움과 추함, 선함과 악함은 서로를 전제로 하는 구별이다. 자신의 평가를 사물의 본래 성질과 혼동하지 않는다.","page":26},{"title":"007 · 비교가 만드는 우열","text":"높고 낮음이나 앞뒤처럼 우열과 풍요의 평가도 관계 속에서 성립한다. 한쪽만 독립된 절대 기준으로 삼지 않는다.","page":27},{"title":"008 · 기르되 소유하지 않기","text":"서로 다른 성질이 함께 존재함을 알면 성장에 과도하게 개입하지 않는다. 성인은 돕고 이루어도 소유나 공로를 주장하지 않는다.","page":28},{"title":"009 · 흐름은 결과에 머물지 않는다","text":"변화의 움직임을 하나의 시작점이나 결과에 고정할 수 없다. 결과만 붙잡기보다 계속 이어지는 작용을 살핀다.","page":29},{"title":"010 · 분류보다 본래의 모습","text":"이름으로 세계를 단단히 나눌수록 살아 있는 관계를 놓친다. 강제적인 구분을 줄이고 각 존재가 움직이는 방식을 따른다.","page":30}],"practice":["걱정을 사실·붙인 이름·변할 가능성으로 나누어 기록한다."],"keywords":["언어","상대성","불안","무위"]},{"id":"tao-03","title":"비운 마음과 내면의 감각","part":"상편 도경 · 편집상 묶음","pages":[32,40],"summary":"경쟁과 욕망을 부추기는 통치보다 마음을 비우고 대응할 힘을 기르는 태도를 강조한다. 편자의 해석에서 인은 세상을 온몸으로 느끼는 감성, 충은 자기 마음의 중심을 따르는 자세와 연결된다.","points":[{"title":"011 · 경쟁을 부추기는 기준 줄이기","text":"영리함과 희귀한 소유물을 지나치게 떠받들면 다툼과 욕망이 늘어난다. 다스리는 이는 사람들이 무엇을 탐하게 만드는지 살핀다.","page":32},{"title":"012 · 억지 대신 대응력","text":"미리 세운 의지를 강요하기보다 마음을 비우고 상황에 대응할 힘을 준비한다. 욕심과 술수를 줄이는 일이 안정의 출발점이다.","page":33},{"title":"013 · 빈 근원의 생산성","text":"도는 만물을 이루면서도 소진되지 않는 깊은 작용으로 묘사된다. 비어 있음은 결핍만이 아니라 새로운 것을 받아들이는 조건이다.","page":34},{"title":"014 · 만물에 앞선 도","text":"도는 천지와 만물의 근원으로 설명된다. 일정한 형태에 갇히지 않기에 포용과 생성이 끊이지 않는다.","page":35},{"title":"015 · 드러내지 않고 함께하기","text":"도의 작용은 날카로움을 누그러뜨리고 얽힘을 풀며 빛과 먼지에 어울린다. 자신의 우월함을 드러내기보다 주변과 조화를 이룬다.","page":37},{"title":"016 · 감성으로 삶을 읽기","text":"편자는 인을 살아 있는 감수성과 연결한다. 온몸으로 상황을 느끼는 능력이 행동의 방향을 찾게 한다.","page":38},{"title":"017 · 권위의 말보다 살아 있는 감각","text":"인은 누구에게나 작용하지만 성공한 사람의 말만 좇으면 그 감각을 잊는다. 외부 권위에 판단을 전부 맡기지 않는다.","page":39},{"title":"018 · 마음의 중심을 따르기","text":"내면의 중심에 충실하다는 것은 사사로운 감정만 좇는다는 뜻이 아니다. 마음을 다해 공정하고 차분하게 판단하는 태도다.","page":40}],"practice":["결정 전에 남의 평가와 자신의 직접적인 관찰을 따로 적어본다."],"keywords":["감성","인","충","대응력"]},{"id":"tao-04","title":"낮은 곳에 머무는 힘","part":"상편 도경 · 편집상 묶음","pages":[41,53],"summary":"물과 천지의 비유를 통해 사사로움을 줄이고 때에 맞게 움직이는 태도를 제시한다. 성취한 뒤 물러나고, 돌봄을 지배나 소유의 권리로 바꾸지 않는 것이 핵심이다.","points":[{"title":"019 · 끊이지 않는 생성의 근원","text":"신비로운 근원을 부모와 천지의 이미지로 나타내며, 만물을 낳는 힘이 사용해도 고갈되지 않는다고 설명한다.","page":41},{"title":"020 · 사사로움 없이 살아가기","text":"천지가 오래가는 이유를 자기 이익을 고집하지 않는 데서 찾는다. 삶을 과하게 움켜쥐기보다 자연스러운 활동을 따른다.","page":42},{"title":"021 · 뒤로 물러남의 역설","text":"자기 이익을 앞세우지 않는 사람이 오히려 신뢰와 성과를 얻는다. 앞서려는 집착을 줄이는 것이 자신을 지키는 길이 된다.","page":44},{"title":"022 · 자리와 때의 적합성","text":"머무는 곳, 마음, 말, 정치, 능력과 행동의 때가 도리에 맞아야 한다. 상황과 어긋나지 않는 행동은 불필요한 다툼을 줄인다.","page":45},{"title":"023 · 물처럼 이롭게 하기","text":"물은 낮은 곳으로 흐르며 만물을 돕는다. 평정한 마음, 진실한 관계, 믿을 만한 말과 적절한 행동으로 그 성질을 본받는다.","page":46},{"title":"024 · 성취 뒤의 멈춤","text":"가치 있는 것도 끝없이 늘리면 지키기 어려워진다. 성과를 얻었을 때 욕심과 교만을 덜고 물러날 줄 알아야 한다.","page":48},{"title":"025 · 몸과 마음의 일치","text":"몸과 정신의 조화, 내면의 관찰, 어린아이 같은 소박함을 수양의 질문으로 제시한다. 기와 혼백은 이 책의 고전적 설명 틀이다.","page":50},{"title":"026 · 돌봄과 지배를 구분하기","text":"낳고 기른 공로가 소유하거나 지배할 권리가 되지 않는다. 강요 없이 이끄는 태도를 깊은 덕으로 설명한다.","page":51},{"title":"027 · 능력을 얻어도 고요하기","text":"마음을 맑게 하고 넓게 볼 능력이 생겨도 그 힘을 과시하지 않는다. 돌봄의 결과를 자신의 위신으로 바꾸지 않는지 묻는다.","page":52}],"practice":["누군가를 돕는 일에서 상대가 스스로 결정할 여지를 한 가지 더 남긴다."],"keywords":["물","겸손","돌봄","절제"]},{"id":"tao-05","title":"여백과 평정의 기술","part":"상편 도경 · 편집상 묶음","pages":[54,67],"summary":"비어 있는 공간은 사물이 기능하도록 돕고, 과한 자극은 자신의 문제를 가린다. 몸을 존중하며 기다릴 줄 아는 태도가 판단과 갱신을 가능하게 한다.","points":[{"title":"028 · 쓸모를 만드는 빈자리","text":"바퀴·그릇·방은 재료뿐 아니라 빈 공간이 있어 제 기능을 한다. 채움과 비움의 관계를 함께 보아야 한다.","page":54},{"title":"029 · 자극이 가리는 문제","text":"화려한 감각과 재물에 끌리면 실제 문제에서 눈을 돌리기 쉽다. 생활과 마음이 안정될 만큼 자극을 줄인다.","page":57},{"title":"030 · 평판에 끌려가지 않기","text":"총애와 모욕은 얻거나 잃을 때 모두 마음을 흔든다. 외부의 대우가 삶의 방향을 전부 결정하게 두지 않는다.","page":58},{"title":"031 · 몸을 귀하게 여기는 책임","text":"감정과 삶의 바탕인 몸을 소홀히 하지 않는다. 자신을 온전히 돌볼 줄 아는 태도가 큰 책임을 맡는 기초가 된다.","page":59},{"title":"032 · 형태 뒤의 생성 작용","text":"감각으로 직접 붙잡을 수 없는 작용이 만물을 생겨나게 한다. 개별 형태가 사라져도 생성의 흐름은 이어진다.","page":60},{"title":"033 · 고정할 수 없는 신비","text":"도는 특정 장소나 모양으로 가리키기 어렵다. 가리킨 순간에도 움직이는 것을 정지한 대상으로 오해하지 않는다.","page":62},{"title":"034 · 현재의 모습에서 근원 읽기","text":"먼 근원을 이해할 실마리는 지금 드러난 만물에도 있다. 눈앞의 존재를 그 본래 모습대로 살피는 데서 출발한다.","page":63},{"title":"035 · 깊은 이해의 신중함","text":"도를 체득한 이는 조심스럽고 소박하며 넓고 조용한 모습으로 묘사된다. 드러나는 재치만으로 이해의 깊이를 판단하지 않는다.","page":64},{"title":"036 · 가라앉고 되살아날 시간","text":"혼탁함이 맑아지고 고요함이 생기를 얻는 과정에는 시간이 필요하다. 빈틈없이 채우지 않아야 포용과 변화가 가능하다.","page":65},{"title":"037 · 과잉 성과를 바라지 않기","text":"상황에 대응할 지혜가 있어도 지나친 결실을 요구하지 않는다. 성과의 과잉을 피하는 것이 막다른 상황을 줄인다.","page":67}],"practice":["하루 일정에 판단을 보류하고 관찰할 여백을 남긴다."],"keywords":["여백","평정","자극","신중함"]},{"id":"tao-06","title":"본질을 따르는 자율적 질서","part":"상편 도경 · 편집상 묶음","pages":[68,79],"summary":"만물이 근원으로 돌아감을 차분히 관찰하면 관용과 공정함이 생긴다. 좋은 통치는 도덕적 표어를 늘리기보다 사람들이 스스로 살아갈 조건을 마련한다.","points":[{"title":"038 · 있는 그대로 관찰하기","text":"불필요한 생각을 덜고 생성과 소멸을 바라본다. 활발하게 뻗어가는 만물도 근원으로 돌아가는 흐름 속에 있음을 이해한다.","page":68},{"title":"039 · 돌아감을 아는 밝음","text":"근원으로 돌아감을 이해하는 일은 현실을 있는 그대로 보는 일과 연결된다. 흐름을 외면하면 판단이 망상에 기울 수 있다.","page":69},{"title":"040 · 이해에서 관용으로","text":"현실을 열린 눈으로 받아들이면 관용이 생기고 공정한 판단으로 이어진다. 큰 책임을 감당하는 자질도 이 과정에서 자란다.","page":70},{"title":"041 · 스스로 이루었다고 느끼게 하기","text":"가장 좋은 지도자는 강제와 존재감이 적다. 말을 신중히 하고 신뢰를 지키면 구성원은 결과를 자신들의 자연스러운 성취로 받아들인다.","page":72},{"title":"042 · 덕목이 강조되는 배경","text":"인의·효성·충신이라는 표어의 등장은 오히려 자연스러운 관계와 질서가 약해진 징후일 수 있다. 이름보다 그 배경을 살핀다.","page":74},{"title":"043 · 꾸밈과 술수를 덜기","text":"영리한 말과 명리 추구를 줄이고 사물 사이의 연결과 소박함을 지킨다. 형식적인 도덕 연출보다 실제 관계의 회복을 중시한다.","page":75},{"title":"044 · 지식의 틀을 절대화하지 않기","text":"예의와 윤리의 구분을 외워 사사건건 판정하면 삶의 자유를 좁힌다. 차이를 따지는 지식이 정말 필요한지 돌아본다.","page":76},{"title":"045 · 남과 달라도 지킬 방향","text":"사람들이 즐기는 기준에 동조하지 않을 때 고독과 막막함을 느낄 수 있다. 그럼에도 만물을 기르는 근원에 충실한 삶을 택한다.","page":78}],"practice":["팀의 규칙 하나가 실제 관계를 돕는지, 표어로만 남았는지 살핀다."],"keywords":["관용","자율","지도자","본질"]},{"id":"tao-07","title":"순환을 알고 무리를 줄이기","part":"상편 도경 · 편집상 묶음","pages":[80,90],"summary":"도의 작용은 희미하지만 세계의 변화 속에서 드러난다. 부족함과 물러남을 실패로 단정하지 않고, 과시와 억지를 덜어 자연스러운 순환을 따른다.","points":[{"title":"046 · 희미함 속의 실재","text":"도는 손에 잡히는 모양이 없어도 현상과 사물이 생겨나는 근원이다. 선명하게 규정되지 않는다는 이유로 실재성을 부정하지 않는다.","page":80},{"title":"047 · 반대 방향의 가능성","text":"굽음과 곧음, 낡음과 새로움, 적음과 많음은 전환될 수 있다. 현재의 결핍이나 불리함을 최종 상태로 단정하지 않는다.","page":82},{"title":"048 · 드러내지 않아 얻는 신뢰","text":"자신만 옳다고 주장하거나 공적을 과시하지 않아도 가치가 드러날 수 있다. 다툼의 이유를 줄이는 태도가 오래가는 영향력을 만든다.","page":83},{"title":"049 · 격렬한 현상도 지나간다","text":"폭풍과 비조차 계속되지 않는다. 눈앞의 사건에 휩쓸리기보다 그 변화가 드러내는 말 없는 신호를 읽는다.","page":84},{"title":"050 · 득실 뒤의 흐름","text":"얻음과 잃음을 각각 받아들이며 일희일비를 줄인다. 개별 손익보다 그것을 통해 드러나는 상황의 이치를 살핀다.","page":85},{"title":"051 · 과한 동작의 불안정함","text":"과장된 걸음이나 자기 과시는 지속하기 어렵고 판단도 흐린다. 인정받으려는 무리가 오히려 성과와 신뢰를 방해할 수 있다.","page":87},{"title":"052 · 생성의 작용에 붙인 이름","text":"사물과 상태는 고립된 채 생겨나는 것이 아니라 여러 힘이 얽힌 근원에서 나타난다. 이 생성 작용을 도라고 부른다.","page":88},{"title":"053 · 멀어짐과 돌아옴","text":"도의 큼은 계속 펼쳐지고 멀어지다가 돌아오는 순환으로 설명된다. 한 방향으로 끝없이 확장될 것이라는 생각을 경계한다.","page":89},{"title":"054 · 스스로 그러함을 따르기","text":"인간·대지·하늘·도의 관계를 통해 삶의 기준을 설명한다. 마지막 기준은 외부의 명령보다 스스로 그러한 자연스러움에 있다.","page":90}],"practice":["성과를 위해 무리하게 늘린 행동 하나를 찾아 지속 가능한 크기로 줄인다."],"keywords":["순환","자연","득실","과시"]},{"id":"tao-08","title":"차분한 리더와 열린 본성","part":"상편 도경 · 편집상 묶음","pages":[91,99],"summary":"지도자는 무게와 차분함을 유지하면서 사람과 사물의 쓰임을 살린다. 고정된 역할로 사람을 잘라 맞추기보다 본래의 가능성을 존중한다.","points":[{"title":"055 · 흔들리지 않는 중심","text":"큰 책임을 맡은 이는 많은 말에 예민하게 동요하거나 성급히 행동하지 않는다. 차분함은 판단과 조직을 지탱하는 뿌리다.","page":91},{"title":"056 · 아무도 버리지 않는 솜씨","text":"좋은 능력은 억지의 흔적이 적다. 사람과 물건을 함부로 폐기하지 않고 저마다의 쓰임이 살아나도록 돕는다.","page":93},{"title":"057 · 반면교사도 귀하게 보기","text":"좋은 사람만 스승이 되는 것은 아니다. 부족한 행동에서도 배울 수 있으므로 본받을 이와 돌아볼 계기를 함께 존중한다.","page":94},{"title":"058 · 강함을 알되 유연함 지키기","text":"강한 힘을 알아도 부드러움을 유지하고, 명예와 불명예를 함께 이해한다. 그러면 순박함과 넓은 수용력을 회복할 수 있다.","page":95},{"title":"059 · 사람을 역할에 가두지 않기","text":"명확한 논리와 말로 설명되지 않는 가능성을 함께 인정한다. 제도는 사람을 잘라 맞추기보다 그 본성을 활용해야 한다.","page":96},{"title":"060 · 극단과 과잉 피하기","text":"복잡한 세계를 뜻대로 지배하려 하면 계획이 무너질 수 있다. 변화의 반작용을 고려하며 과분함과 사치를 덜어낸다.","page":98}],"practice":["동료를 직함 밖에서 잘하는 일과 관심으로 다시 설명해본다."],"keywords":["리더십","포용","본성","극단"]},{"id":"tao-09","title":"힘을 과시하지 않는 성취","part":"상편 도경 · 편집상 묶음","pages":[100,112],"summary":"무력과 강함의 과잉은 보복과 쇠퇴를 부른다. 필요한 일을 이루어도 지배나 과시로 이어가지 않으며, 자기 절제와 자연스러운 질서를 중시한다.","points":[{"title":"061 · 목적 이후에는 멈추기","text":"무력 과시는 보복과 생활 기반의 파괴를 가져온다. 부득이한 행동도 필요한 목적을 달성하면 멈추고 힘을 더 휘두르지 않는다.","page":100},{"title":"062 · 절정 뒤의 쇠퇴","text":"기세를 계속 강하게 밀어붙이면 쇠락이 뒤따른다. 공을 이루어도 오만하거나 성취의 자리를 오래 붙들지 않는다.","page":102},{"title":"063 · 무기를 찬미하지 않기","text":"무기는 사람을 해치는 불길한 도
