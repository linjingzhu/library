<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <meta name="description" content="PDF마다 독립된 탭에서 목차, 핵심 개념과 실천 질문을 읽는 지식 라이브러리.">
  <title>사유의 서재 · 지식 라이브러리</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%233c5347'/%3E%3Cpath d='M10 11h7l3 4 3-4h7v19h-7l-3 3-3-3h-7z' fill='none' stroke='%23eff3da' stroke-width='2'/%3E%3Cpath d='M20 15v18' stroke='%23eff3da' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <button id="scrim" class="scrim" aria-label="메뉴 닫기" hidden></button>
  <aside id="sidebar" class="sidebar" aria-label="서재 탐색">
    <a class="brand" href="#home"><span class="brand-mark" aria-hidden="true">◫</span><span>사유의 서재<small>THE THOUGHT LIBRARY</small></span></a>
    <div class="sidebar-caption">나를 넓히는 작은 도서관</div>
    <div id="navigation"></div>
    <div class="sidebar-bottom"><span class="status-dot"></span>자료마다 깊어지는 사유<div>읽고, 연결하고, 삶에 적용하기.</div></div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="header-start"><button id="menu-toggle" class="icon-button mobile-only" aria-label="메뉴 열기" aria-controls="sidebar" aria-expanded="false"></button><a class="header-title" href="#home">지식 라이브러리</a></div>
      <div id="header-search" class="header-search">
        <form id="search-form" role="search" aria-label="전체 자료 검색">
          <span id="search-icon" aria-hidden="true"></span><input id="search-input" type="search" aria-label="전체 자료 검색어" aria-controls="search-panel" placeholder="모든 자료에서 검색" autocomplete="off"><button class="search-submit" type="submit" aria-label="검색 실행">검색</button><kbd aria-hidden="true">Ctrl K</kbd>
        </form>
        <section id="search-panel" class="search-panel" aria-label="전체 자료 검색 결과" hidden>
          <div class="search-panel-top"><span>전체 자료 · 본문, 소개, 연결된 지식</span><button id="search-close" class="icon-button" type="button" aria-label="검색 결과 닫기">✕</button></div>
          <div id="search-results" role="region" aria-label="검색 결과" aria-live="polite"></div>
        </section>
      </div>
      <div class="top-actions"><span class="avatar" aria-label="개인 서재">私</span></div>
    </header>
    <div id="breadcrumb" class="breadcrumb contextbar">나의 라이브러리</div>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>사유의 서재</span><span>지식을 모으는 곳에서, 삶을 이해하는 곳으로.</span></footer>
  </div>
  <dialog id="source-dialog" aria-labelledby="source-title">
    <div class="dialog-top"><h2 id="source-title">원문 페이지 확인</h2><button class="icon-button" data-close="source-dialog" aria-label="원문 안내 닫기">✕</button></div>
    <div id="source-detail"></div>
    <label class="primary-button file-button">이 기기의 PDF 연결<input id="pdf-input" type="file" accept="application/pdf,.pdf"></label>
    <p class="muted small">파일은 서버로 전송되지 않습니다. 현재 창이 열려 있는 동안만 연결됩니다.</p>
    <div id="source-error" role="alert"></div>
  </dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript>이 서재는 책 탐색과 검색을 위해 JavaScript가 필요합니다.</noscript>
</body>
</html>
